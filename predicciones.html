<body data-page="predicciones">

<div id="site-header"></div>

<main class="wrap">
  <h2 class="section-title">Porras</h2>
  <p class="porras-intro">Elige categoría, grupo y jornada, y marca tu resultado para cada partido. Se guarda solo, en cuanto lo escribes.</p>

  <div class="filtros">
    <button class="activo" data-cat="hypermotion">LaLiga Hypermotion</button>
    <button data-cat="primera_federacion">Primera Federación</button>
    <button data-cat="segunda_federacion">Segunda Federación</button>
  </div>
  <div class="filtros-secundarios">
    <select id="filtroGrupo" class="select-filtro" hidden></select>
  </div>

  <div id="porrasTemporadaCont"></div>

  <div class="porras-tabs" role="tablist">
    <button type="button" class="porras-tab activo" data-tab="jornada" role="tab" aria-selected="true">Mi jornada</button>
    <button type="button" class="porras-tab" data-tab="ranking" role="tab" aria-selected="false">Ranking</button>
  </div>

  <div id="jornadasNav" class="porras-jornadas" role="tablist" aria-label="Jornadas"></div>
  <!-- jornadasNav se comparte entre "Mi jornada" y "Ranking": en Ranking
       sirve para elegir de qué jornada ya jugada quiere verse la
       clasificación (ver cargarRanking() en porras.js). -->
  <p id="porrasRankingAyuda" class="porras-ranking-ayuda" hidden>Elige arriba la jornada de la que quieres ver el ranking.</p>

  <div id="porrasCont"></div>
  <div id="porrasRankingCont" hidden></div>
