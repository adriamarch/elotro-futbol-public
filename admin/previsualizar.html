<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Previsualización — ELOTROFÚTBOLTV</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070c17">
<link rel="icon" href="/favicon.ico?v=39af2432" sizes="any">
<link rel="stylesheet" href="/admin/css/previsualizar.css?v=e5d34f46">
</head>
<body>

<header class="pv-barra">
  <div class="pv-marca">
    <span class="pv-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </span>
    <strong>Previsualización</strong>
    <span class="pv-vivo" id="pvVivo" role="status" aria-live="polite"><i></i><span id="pvVivoTxt">En vivo</span></span>
  </div>

  <div class="pv-selector" role="tablist" aria-label="Dispositivo de previsualización">
    <button type="button" class="pv-op" role="tab" data-disp="iphone" title="iPhone 15 Pro (tecla 1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2" width="11" height="20" rx="3"/><path d="M10.5 4.6h3"/></svg>
      <span class="pv-et">iPhone</span>
    </button>
    <button type="button" class="pv-op" role="tab" data-disp="se" title="iPhone SE, pantalla pequeña (tecla 2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><circle cx="12" cy="18.3" r="1"/><path d="M10.5 5.2h3"/></svg>
      <span class="pv-et">iPhone SE</span>
    </button>
    <button type="button" class="pv-op" role="tab" data-disp="ipad" title="iPad (tecla 3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M11 19h2"/></svg>
      <span class="pv-et">Tablet</span>
    </button>
    <button type="button" class="pv-op" role="tab" data-disp="pc" title="Ordenador portátil (tecla 4)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5" width="15" height="10.5" rx="1.6"/><path d="M2.5 19h19"/></svg>
      <span class="pv-et">Ordenador</span>
    </button>
  </div>

  <div class="pv-acciones">
    <button type="button" class="pv-ico pv-solo-marco" id="pvGirar" hidden title="Girar el dispositivo (tecla R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
      <span class="pv-et">Girar</span>
    </button>
    <button type="button" class="pv-ico pv-solo-marco" id="pvZoom" title="Ajustar a la pantalla / tamaño real (tecla F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="pv-et" id="pvZoomTxt">Ajustar</span>
    </button>
    <button type="button" class="pv-ico" id="pvRecargar" title="Recargar la vista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      <span class="pv-et">Recargar</span>
    </button>
    <button type="button" class="pv-ico" id="pvCerrar" title="Cerrar la previsualización">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="pv-et">Cerrar</span>
    </button>
  </div>
</header>

<main class="pv-escenario" id="pvEscenario"></main>
<p class="pv-pie" id="pvPie"></p>

<noscript><p class="pv-vacio">Hace falta JavaScript para ver la previsualización.</p></noscript>
<script src="/admin/js/previsualizar.js?v=9f80278c"></script>
</body>
</html>
