<!DOCTYPE html>
<html lang="es">
<head>
<script>
  // Mismo mecanismo que tema.js: aplicar data-theme antes de pintar,
  // para que el workspace no parpadee de claro a oscuro al cargar.
  //
  // También fijamos "color-scheme" explícitamente: sin esto, algunos
  // navegadores móviles (el "forzar tema oscuro" de Chrome/Android,
  // Samsung Internet, etc.) detectan que la web no declara su propio
  // esquema de color y reescriben ellos mismos fondos y textos para
  // oscurecerla "a la fuerza" -- lo que puede dejar fondo y texto casi
  // del mismo tono oscuro (todo se ve negro/ilegible), sobre todo aquí
  // porque el workspace carga panel.html dentro de un iframe y sin
  // declarar el esquema en los dos documentos el navegador puede
  // tratarlos de forma inconsistente. Al declararlo le decimos "esta
  // web ya gestiona su propio modo oscuro, no reescribas nada".
  document.documentElement.style.colorScheme = "light";
  (function () {
    try {
      if (localStorage.getItem("eof_tema") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      }
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redacción — ELOTROFÚTBOLTV</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/x-icon" href="/img/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Ver nota igual en public/css/style.css: evita que el navegador
       fuerce su propio tema oscuro en móvil por encima del nuestro. */
    color-scheme:light;
    --marino:#0c1b2e;
    --marino2:#152b46;
    --marino3:#1c3a5e;
    --rojo:#d1132e;
    --rojo-oscuro:#9c0e23;
    --celeste:#5bb8e8;
    --celeste-oscuro:#2f8fc4;
    --verde:#1f9d64;
    --ambar:#c8842a;
    --gris-claro:#eef1f5;
    --gris-texto:#5a6270;
    --font-tit:'Oswald','Arial Narrow',sans-serif;
    --font-text:'Inter',Arial,sans-serif;
    --fondo:#ffffff;
    --fondo-alt:#f4f6f9;
    --fondo-hundido:#e9edf3;
    --tarjeta:#ffffff;
    --texto:#161a22;
    --texto-suave:#5a6270;
    --texto-tenue:#8b93a3;
    --borde:#e3e7ee;
    --borde-fuerte:#cdd4e0;

    /* Escala de espaciado e imagen: consistente en todo el workspace,
       en vez de números sueltos repetidos por cada regla. */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:32px;
    --radio-sm:7px; --radio-md:11px; --radio-lg:16px;
    --dur-1:.12s; --dur-2:.2s; --ease:cubic-bezier(.22,.8,.28,1);

    --sombra-1: 0 1px 2px rgba(12,27,46,.07), 0 1px 1px rgba(12,27,46,.04);
    --sombra-2: 0 8px 24px rgba(12,27,46,.12), 0 2px 6px rgba(12,27,46,.06);
    --sombra-3: 0 20px 50px rgba(12,27,46,.20), 0 6px 16px rgba(12,27,46,.10);
    --anillo-foco: 0 0 0 3px rgba(91,184,232,.38);
    --barra-alto: 40px;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --fondo:#10141c;
    --fondo-alt:#151b26;
    --fondo-hundido:#0c1119;
    --tarjeta:#1a212f;
    --texto:#e7eaf0;
    --texto-suave:#9aa4b8;
    --texto-tenue:#69728a;
    --borde:#262e3f;
    --borde-fuerte:#333d52;
    --sombra-1: 0 1px 2px rgba(0,0,0,.3);
    --sombra-2: 0 8px 24px rgba(0,0,0,.42);
    --sombra-3: 0 20px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--fondo-alt);
    color:var(--texto);
    font-family:var(--font-text);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  button, input{font-family:inherit;}
  ::selection{background:rgba(91,184,232,.35);}

  /* Foco visible consistente para todo lo interactivo: accesibilidad de
     teclado sin depender del contorno azul por defecto de cada navegador. */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible{
    outline:none; box-shadow:var(--anillo-foco); border-radius:var(--radio-sm);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s!important; transition-duration:.001s!important;}
  }

  /* ---------- Barra de herramientas del workspace (dividir, layouts,
     ayuda...), sin cabecera de marca/logo/usuario por encima: aquí
     mismo empieza la página, para ir directo a las pestañas. ---------- */
  .ws-header{
    height:48px;flex-shrink:0;
    display:flex;align-items:center;justify-content:flex-end;
    padding:0 14px;
    background:linear-gradient(180deg,var(--marino2),var(--marino));
    color:#fff;
    gap:10px;
    border-bottom:1px solid rgba(0,0,0,.25);
    position:relative;
    z-index:20;
  }
  .ws-header::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,var(--rojo),var(--celeste) 60%,transparent);
    opacity:.9;
  }
  .ws-estado-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--font-text);font-weight:600;font-size:.68rem;
    color:#ffd9c2;background:rgba(209,19,46,.22);border:1px solid rgba(209,19,46,.4);
    padding:2px 8px 2px 6px;border-radius:99px;cursor:default;
  }
  .ws-estado-pill .punto-pulso{
    width:6px;height:6px;border-radius:50%;background:var(--rojo);flex-shrink:0;
    animation:pulso 1.6s ease-in-out infinite;
  }
  @keyframes pulso{0%,100%{opacity:1;}50%{opacity:.35;}}

  .ws-acciones{display:flex;align-items:center;gap:6px;}
  .ws-sep-acc{width:1px;align-self:stretch;margin:9px 2px;background:rgba(255,255,255,.14);}
  .ws-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);
    color:#fff;border-radius:8px;
    padding:7px 11px;font-size:.8rem;font-family:var(--font-text);font-weight:500;
    cursor:pointer;transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
  }
  .ws-btn:hover{background:rgba(255,255,255,.16);}
  .ws-btn:active{transform:translateY(1px);}
  .ws-btn.activo{background:var(--rojo);border-color:var(--rojo-oscuro);}
  .ws-btn.activo:hover{background:var(--rojo-oscuro);}
  .ws-btn svg{width:15px;height:15px;flex-shrink:0;}
  .ws-btn-icono{padding:7px;}
  .ws-volver{
    color:#cfe0f0;text-decoration:none;font-size:.8rem;
    display:flex;align-items:center;gap:4px;padding:6px 9px;border-radius:7px;
    border:1px solid transparent;transition:background var(--dur-1), border-color var(--dur-1);
  }
  .ws-volver:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);}

  .ws-kbd{
    font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;
    font-size:.66rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
    border-radius:4px;padding:1px 5px;line-height:1.5;color:#dbe6f2;
  }

  /* ---------- Fila de pestañas tipo navegador/editor ---------- */
  .ws-tabbar-wrap{
    display:flex;align-items:stretch;background:var(--fondo-hundido);
    border-bottom:1px solid var(--borde);flex-shrink:0;
  }
  .ws-tabbar{
    display:flex;align-items:flex-end;
    flex:1;min-width:0;
    overflow-x:auto;scrollbar-width:thin;
    padding:6px 4px 0;gap:2px;
  }
  .ws-tabbar::-webkit-scrollbar{height:5px;}
  .ws-tabbar::-webkit-scrollbar-thumb{background:var(--borde-fuerte);border-radius:4px;}
  .ws-tab{
    display:flex;align-items:center;gap:7px;
    padding:0 8px 0 12px;
    height:var(--barra-alto);
    background:var(--fondo-hundido);
    border:1px solid transparent;border-bottom:none;
    border-radius:var(--radio-md) var(--radio-md) 0 0;
    color:var(--texto-suave);
    font-size:.81rem;font-family:var(--font-text);font-weight:500;
    cursor:pointer;white-space:nowrap;position:relative;
    min-width:158px;max-width:230px;
    user-select:none;
    transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
  }
  .ws-tab:hover{background:var(--fondo-alt);color:var(--texto);}
  .ws-tab.seleccionada{background:var(--fondo);color:var(--texto);border-color:var(--borde);box-shadow:0 -1px 0 var(--fondo);}
  .ws-tab.seleccionada::after{
    content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;
    background:var(--rojo);
  }
  .ws-tab.en-split{color:var(--celeste-oscuro);}
  [data-theme="dark"] .ws-tab.en-split{color:var(--celeste);}
  .ws-tab.arrastre-sobre{background:var(--fondo);box-shadow:inset 2px 0 0 var(--celeste);}
  .ws-tab.arrastrandose{opacity:.45;}
  .ws-tab .ws-tab-icono{flex-shrink:0;width:13px;height:13px;color:var(--texto-tenue);}
  .ws-tab.seleccionada .ws-tab-icono{color:var(--celeste-oscuro);}
  .ws-tab .ws-tab-titulo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .ws-tab .ws-tab-split-marca{
    font-size:.65rem;font-weight:700;color:var(--celeste-oscuro);
    border:1px solid var(--celeste-oscuro);border-radius:5px;padding:1px 4px;flex-shrink:0;
  }
  [data-theme="dark"] .ws-tab .ws-tab-split-marca{color:var(--celeste);border-color:var(--celeste);}
  .ws-tab .ws-tab-dirty{
    width:7px;height:7px;border-radius:50%;background:var(--rojo);flex-shrink:0;
  }
  .ws-tab .ws-tab-cerrar, .ws-tab .ws-tab-dividir{
    width:19px;height:19px;flex-shrink:0;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:var(--texto-tenue);transition:background var(--dur-1), color var(--dur-1);
  }
  .ws-tab .ws-tab-cerrar:hover{background:var(--borde-fuerte);color:var(--texto);}
  /* Icono de "dividir con esta pestaña": oculto hasta pasar el ratón,
     para no saturar la barra de pestañas cuando hay muchas abiertas. */
  .ws-tab .ws-tab-dividir{opacity:0;}
  .ws-tab:hover .ws-tab-dividir, .ws-tab:focus-within .ws-tab-dividir{opacity:1;}
  .ws-tab .ws-tab-dividir:hover{background:rgba(91,184,232,.16);color:var(--celeste-oscuro);}
  [data-theme="dark"] .ws-tab .ws-tab-dividir:hover{color:var(--celeste);}
  .ws-tab-nueva{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:var(--barra-alto);flex-shrink:0;color:var(--texto-suave);cursor:pointer;
    border-radius:var(--radio-md) var(--radio-md) 0 0;margin-left:2px;
    transition:background var(--dur-1), color var(--dur-1);
  }
  .ws-tab-nueva:hover{background:var(--fondo-alt);color:var(--texto);}
  .ws-tab-nueva svg{width:16px;height:16px;}
  .ws-tabbar-extra{display:flex;align-items:center;gap:4px;padding:0 8px;flex-shrink:0;}
  .ws-tabbar-extra .ws-mini-btn{color:var(--texto-tenue);}

  .ws-mini-btn{
    display:flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:7px;border:1px solid transparent;
    background:transparent;color:var(--texto-suave);cursor:pointer;
    transition:background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
  }
  .ws-mini-btn:hover{background:var(--fondo-alt);color:var(--texto);border-color:var(--borde);}
  .ws-mini-btn svg{width:15px;height:15px;}

  /* ---------- Área de contenido: 1, 2 (split) o 4 (grid) paneles ---------- */
  .ws-area{
    flex:1;display:flex;min-height:0;position:relative;
    background:var(--fondo);
  }
  .ws-area.vertical{flex-direction:row;}
  .ws-area.horizontal{flex-direction:column;}
  .ws-area.grid4{
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    gap:1px;background:var(--borde);
  }
  .ws-panel-slot{
    flex:1;min-width:0;min-height:0;position:relative;
    display:flex;flex-direction:column;
    background:var(--fondo);
  }
  .ws-panel-slot + .ws-panel-slot{border-left:1px solid var(--borde);}
  .ws-area.horizontal .ws-panel-slot + .ws-panel-slot{border-left:none;border-top:1px solid var(--borde);}
  .ws-area.grid4 .ws-panel-slot{border:0;}
  .ws-panel-slot iframe{flex:1;border:0;width:100%;height:100%;background:var(--fondo);position:relative;z-index:1;}
  .ws-slot-etiqueta{
    display:flex;align-items:center;gap:6px;
    padding:6px 10px;font-size:.72rem;color:var(--texto-suave);
    background:var(--fondo-alt);border-bottom:1px solid var(--borde);flex-shrink:0;
  }
  .ws-slot-etiqueta .punto{width:6px;height:6px;border-radius:50%;background:var(--verde);flex-shrink:0;}
  .ws-slot-etiqueta .letra-slot{
    font-weight:700;font-size:.66rem;color:var(--celeste-oscuro);
    border:1px solid var(--celeste-oscuro);border-radius:5px;padding:0 4px;flex-shrink:0;
    cursor:pointer;display:flex;align-items:center;gap:2px;
    transition:background var(--dur-1);
  }
  .ws-slot-etiqueta .letra-slot:hover{background:rgba(91,184,232,.14);}
  .ws-slot-etiqueta .letra-slot svg{width:9px;height:9px;flex-shrink:0;}
  [data-theme="dark"] .ws-slot-etiqueta .letra-slot{color:var(--celeste);border-color:var(--celeste);}
  .ws-slot-cerrar-split{
    margin-left:auto;cursor:pointer;color:var(--texto-suave);
    display:flex;align-items:center;gap:4px;font-size:.72rem;
    padding:3px 7px;border-radius:6px;transition:background var(--dur-1), color var(--dur-1);
  }
  .ws-slot-cerrar-split:hover{color:var(--rojo);background:rgba(209,19,46,.08);}

  /* Estado de carga breve del iframe: evita el "salto" en blanco
     mientras panel.html arranca dentro del slot. */
  .ws-slot-cargando{
    position:absolute;inset:0;top:0;z-index:2;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--fondo);color:var(--texto-tenue);font-size:.78rem;
    transition:opacity var(--dur-2) var(--ease);
  }
  .ws-slot-cargando.oculto{opacity:0;pointer-events:none;}
  .ws-spinner{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--borde-fuerte);border-top-color:var(--celeste-oscuro);
    animation:girar .7s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}

  .ws-divisor{
    flex-shrink:0;background:var(--borde);position:relative;z-index:5;
  }
  .ws-area.vertical .ws-divisor{width:5px;cursor:col-resize;}
  .ws-area.horizontal .ws-divisor{height:5px;cursor:row-resize;}
  .ws-divisor:hover, .ws-divisor.arrastrando{background:var(--celeste-oscuro);}

  /* ---------- Pantalla de bienvenida / elegir sección ---------- */
  .ws-bienvenida{
    flex:1;display:flex;flex-direction:column;align-items:center;
    gap:var(--sp-5);padding:44px 24px;text-align:center;overflow-y:auto;
  }
  .ws-bienvenida-cabecera{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:420px;}
  .ws-bienvenida h2{font-family:var(--font-tit);font-size:1.35rem;margin:0;color:var(--texto);letter-spacing:.2px;}
  .ws-bienvenida p{color:var(--texto-suave);margin:0;font-size:.88rem;}

  .ws-buscador-secciones{
    width:100%;max-width:420px;position:relative;
  }
  .ws-buscador-secciones svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--texto-tenue);pointer-events:none;
  }
  .ws-buscador-secciones input{
    width:100%;padding:9px 12px 9px 34px;border-radius:99px;
    border:1px solid var(--borde-fuerte);background:var(--tarjeta);color:var(--texto);
    font-size:.85rem;transition:border-color var(--dur-1), box-shadow var(--dur-1);
  }
  .ws-buscador-secciones input:focus-visible{border-color:var(--celeste-oscuro);box-shadow:var(--anillo-foco);}

  .ws-recientes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px;}
  .ws-recientes-etq{font-size:.7rem;color:var(--texto-tenue);align-self:center;margin-right:2px;}
  .ws-chip-reciente{
    display:inline-flex;align-items:center;gap:5px;font-size:.76rem;color:var(--texto);
    background:var(--tarjeta);border:1px solid var(--borde);border-radius:99px;
    padding:5px 11px;cursor:pointer;transition:border-color var(--dur-1), transform var(--dur-1);
  }
  .ws-chip-reciente:hover{border-color:var(--celeste-oscuro);transform:translateY(-1px);}

  .ws-grupos-secciones{width:100%;max-width:760px;display:flex;flex-direction:column;gap:var(--sp-5);text-align:left;}
  .ws-grupo-secciones h3{
    font-family:var(--font-text);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--texto-tenue);margin:0 0 var(--sp-2);display:flex;align-items:center;gap:6px;
  }
  .ws-grupo-secciones h3 svg{width:13px;height:13px;}
  .ws-secciones{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:8px;width:100%;
  }
  .ws-seccion-btn{
    display:flex;align-items:flex-start;gap:10px;
    padding:11px 13px;border-radius:var(--radio-md);border:1px solid var(--borde);
    background:var(--tarjeta);color:var(--texto);cursor:pointer;text-align:left;
    font-family:var(--font-text);transition:border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
  }
  .ws-seccion-btn:hover{border-color:var(--celeste-oscuro);transform:translateY(-1px);box-shadow:var(--sombra-1);}
  .ws-seccion-btn .ws-seccion-icono{
    flex-shrink:0;width:28px;height:28px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:var(--fondo-alt);color:var(--celeste-oscuro);
  }
  [data-theme="dark"] .ws-seccion-btn .ws-seccion-icono{color:var(--celeste);}
  .ws-seccion-btn .ws-seccion-icono svg{width:15px;height:15px;}
  .ws-seccion-btn .ws-seccion-texto{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ws-seccion-btn strong{font-size:.85rem;font-weight:600;}
  .ws-seccion-btn span{font-size:.72rem;color:var(--texto-suave);}
  .ws-sin-resultados{color:var(--texto-tenue);font-size:.85rem;padding:20px 0;}

  /* ---------- Menús flotantes (Layouts, ayuda) ---------- */
  .ws-menu-flotante{
    position:absolute;top:48px;right:14px;background:var(--tarjeta);
    border:1px solid var(--borde);border-radius:var(--radio-md);box-shadow:var(--sombra-2);
    min-width:240px;z-index:50;overflow:hidden;display:none;
  }
  .ws-menu-flotante.abierto{display:block;animation:aparecerMenu var(--dur-2) var(--ease);}
  @keyframes aparecerMenu{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .ws-menu-item{
    padding:10px 14px;font-size:.82rem;color:var(--texto);cursor:pointer;
    display:flex;align-items:center;gap:8px;transition:background var(--dur-1);
  }
  .ws-menu-item svg{flex-shrink:0;width:15px;height:15px;color:var(--texto-suave);}
  .ws-menu-item:hover{background:var(--fondo-alt);}
  .ws-menu-sep{height:1px;background:var(--borde);margin:4px 0;}
  .ws-menu-vacio{padding:14px;font-size:.78rem;color:var(--texto-tenue);}
  .ws-menu-titulo{padding:9px 14px 5px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-tenue);}

  .ws-ayuda-lista{padding:6px 4px;}
  .ws-ayuda-fila{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 14px;font-size:.78rem;color:var(--texto-suave);}
  .ws-ayuda-fila span:last-child{display:flex;gap:4px;}

  .ws-aviso-movil{
    display:none;
    align-items:center;gap:8px;
    padding:8px 14px;font-size:.76rem;color:var(--texto-suave);
    background:var(--fondo-alt);border-bottom:1px solid var(--borde);
  }
  .ws-aviso-movil svg{flex-shrink:0;color:var(--ambar);}

  /* ---------- Notificaciones (toast) ---------- */
  .ws-toasts{
    position:fixed;right:16px;bottom:16px;z-index:200;
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;
    pointer-events:none;
  }
  .ws-toast{
    pointer-events:auto;
    display:flex;align-items:center;gap:9px;
    background:var(--tarjeta);color:var(--texto);border:1px solid var(--borde);
    border-left:3px solid var(--celeste-oscuro);
    padding:10px 14px;border-radius:var(--radio-md);box-shadow:var(--sombra-2);
    font-size:.82rem;max-width:320px;
    animation:entrarToast var(--dur-2) var(--ease);
  }
  .ws-toast.saliendo{animation:salirToast var(--dur-2) var(--ease) forwards;}
  .ws-toast.exito{border-left-color:var(--verde);}
  .ws-toast.error{border-left-color:var(--rojo);}
  .ws-toast svg{flex-shrink:0;width:16px;height:16px;color:var(--celeste-oscuro);}
  .ws-toast.exito svg{color:var(--verde);}
  .ws-toast.error svg{color:var(--rojo);}
  @keyframes entrarToast{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  @keyframes salirToast{to{opacity:0;transform:translateY(6px) scale(.98);}}

  /* ---------- Overlay genérico (modal / paleta de comandos) ---------- */
  .ws-overlay{
    position:fixed;inset:0;background:rgba(8,14,24,.5);
    display:none;align-items:flex-start;justify-content:center;
    padding-top:11vh;z-index:150;backdrop-filter:blur(1.5px);
  }
  .ws-overlay.abierto{display:flex;animation:aparecerFondo var(--dur-2) var(--ease);}
  @keyframes aparecerFondo{from{opacity:0;}to{opacity:1;}}

  .ws-modal{
    background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio-lg);
    box-shadow:var(--sombra-3);width:min(420px,92vw);padding:var(--sp-5);
    animation:aparecerModal var(--dur-2) var(--ease);
  }
  @keyframes aparecerModal{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:none;}}
  .ws-modal h3{margin:0 0 6px;font-family:var(--font-tit);font-size:1.05rem;}
  .ws-modal p{margin:0 0 var(--sp-4);color:var(--texto-suave);font-size:.85rem;line-height:1.45;}
  .ws-modal input{
    width:100%;padding:9px 11px;border-radius:var(--radio-sm);border:1px solid var(--borde-fuerte);
    background:var(--fondo);color:var(--texto);font-size:.86rem;margin-bottom:var(--sp-4);
  }
  .ws-modal input:focus-visible{border-color:var(--celeste-oscuro);box-shadow:var(--anillo-foco);}
  .ws-modal-acciones{display:flex;justify-content:flex-end;gap:8px;}
  .ws-modal-btn{
    padding:8px 15px;border-radius:8px;font-size:.83rem;font-weight:600;cursor:pointer;
    border:1px solid var(--borde-fuerte);background:var(--fondo);color:var(--texto);
    transition:background var(--dur-1), transform var(--dur-1);
  }
  .ws-modal-btn:hover{background:var(--fondo-alt);}
  .ws-modal-btn.primario{background:var(--rojo);border-color:var(--rojo-oscuro);color:#fff;}
  .ws-modal-btn.primario:hover{background:var(--rojo-oscuro);}
  .ws-modal-btn.primario.neutro{background:var(--marino2);border-color:var(--marino);}
  .ws-modal-btn.primario.neutro:hover{background:var(--marino);}
  .ws-modal-btn:active{transform:translateY(1px);}

  /* ---------- Paleta de comandos (Ctrl/Cmd + K) ---------- */
  .ws-paleta{
    background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio-lg);
    box-shadow:var(--sombra-3);width:min(560px,92vw);max-height:70vh;
    display:flex;flex-direction:column;overflow:hidden;
    animation:aparecerModal var(--dur-2) var(--ease);
  }
  .ws-paleta-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--borde);flex-shrink:0;}
  .ws-paleta-input-wrap svg{width:17px;height:17px;color:var(--texto-tenue);flex-shrink:0;}
  .ws-paleta-input-wrap input{
    flex:1;border:0;background:transparent;color:var(--texto);font-size:.95rem;outline:none;
  }
  .ws-paleta-input-wrap .ws-kbd{color:var(--texto-tenue);background:var(--fondo-alt);border-color:var(--borde);}
  .ws-paleta-lista{overflow-y:auto;padding:6px;flex:1;}
  .ws-paleta-grupo-tit{padding:8px 10px 4px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-tenue);}
  .ws-paleta-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.86rem;color:var(--texto);
  }
  .ws-paleta-item .ws-seccion-icono{width:24px;height:24px;flex-shrink:0;border-radius:7px;background:var(--fondo-alt);color:var(--celeste-oscuro);display:flex;align-items:center;justify-content:center;}
  [data-theme="dark"] .ws-paleta-item .ws-seccion-icono{color:var(--celeste);}
  .ws-paleta-item .ws-seccion-icono svg{width:13px;height:13px;}
  .ws-paleta-item .txt{flex:1;min-width:0;}
  .ws-paleta-item .txt small{display:block;color:var(--texto-suave);font-size:.72rem;font-weight:400;}
  .ws-paleta-item.activo{background:var(--fondo-alt);}
  .ws-paleta-item.activo .ws-seccion-icono{background:var(--celeste-oscuro);color:#fff;}
  .ws-paleta-vacio{padding:26px 10px;text-align:center;color:var(--texto-tenue);font-size:.85rem;}
  .ws-paleta-footer{
    display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--borde);flex-shrink:0;
    font-size:.7rem;color:var(--texto-tenue);
  }
  .ws-paleta-footer span{display:flex;align-items:center;gap:5px;}

  @media (max-width: 760px){
    .ws-brand small{display:none;}
    .ws-btn span.txt-btn{display:none;}
    #btnDividir, #btnGrid4, #btnGirar{display:none!important;}
    /* El aviso de "cambios sin guardar" (pillEstado) se muestra/oculta
       por JS con style.display inline según haya o no cambios
       pendientes -- por eso hace falta !important aquí para ganarle
       en móvil, donde ya no queda ningún otro botón en .ws-acciones y
       esta píldora sola ocupaba espacio de cabecera sin aportar nada
       que no se vea ya en el punto rojo de la propia pestaña. */
    #pillEstado{display:none!important;}
    /* Buscar (⌘K), Layouts y Ayuda: solo se ocultan en pantallas
       estrechas para ganar espacio en la cabecera del panel de
       redacción -- en escritorio se mantienen tal cual. */
    #btnPaleta, #wrapLayouts, #wrapAyuda{display:none!important;}
    /* Con Buscar, Layouts, Ayuda y la píldora de estado ocultos, y
       Dividir/Grid4/Girar también ocultos, en móvil .ws-acciones no
       tiene ya ningún hijo visible -- pero .ws-header seguía
       reservando su altura fija (48px) y el degradado de fondo para
       una barra completamente vacía, dejando ese hueco de color sin
       nada dentro. Se quita entera: no hay logo ni título dentro de
       esta barra (eso vive en la barra de pestañas, justo debajo). */
    .ws-header{display:none!important;}
    /* Mismo motivo que los botones de arriba: en pantalla estrecha no
       hay sitio para split/grid, así que también hay que tapar esta
       otra vía para entrar en ese modo -- el icono de "dividir con
       esta pestaña" que aparece en cada pestaña de la barra -- o se
       podía activar un split roto sin pasar por los botones de la
       cabecera. */
    .ws-tab-dividir{display:none!important;}
    .ws-estado-pill span.txt-pill{display:none;}
    /* En pantallas estrechas no hay sitio real para pantalla dividida:
       se fuerza siempre a un único panel a pantalla completa y se avisa
       de por qué han desaparecido los controles de split, en vez de
       dejar un botón que generaría una vista inutilizable. */
    .ws-area.vertical, .ws-area.horizontal, .ws-area.grid4{
      display:flex!important;flex-direction:column;
    }
    .ws-area .ws-divisor{display:none!important;}
    .ws-area .ws-panel-slot{display:none!important;}
    .ws-area .ws-panel-slot.ws-slot-movil-activo{display:flex!important;flex:1!important;}
    .ws-aviso-movil.visible{display:flex;}
    .ws-tab{min-width:128px;}
    .ws-overlay{padding-top:6vh;}
  }
</style>
</head>
<body>

<div class="ws-header">
  <div class="ws-acciones">
    <span class="ws-estado-pill" id="pillEstado" style="display:none;" title="Hay pestañas con cambios sin guardar">
      <span class="punto-pulso"></span><span class="txt-pill" id="txtPillEstado"></span>
    </span>
    <button type="button" class="ws-btn" id="btnPaleta" title="Buscar sección (Ctrl/Cmd + K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6.5 7 1-5 5 1.5 7-6.5-3.5L5 21.5l1.5-7-5-5 7-1z"/></svg>

    </div>
    <div style="position:relative;" id="wrapAyuda">
      <button type="button" class="ws-btn ws-btn-icono" id="btnAyuda" title="Atajos de teclado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/></svg>
      </button>
      <div class="ws-menu-flotante" id="menuAyuda" style="min-width:270px;"></div>
    </div>
  </div>
</div>

<div class="ws-tabbar-wrap">
  <div class="ws-tabbar" id="tabbar"></div>
</div>
<div class="ws-aviso-movil" id="avisoMovil">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
  <span>En pantallas pequeñas se muestra una pestaña a la vez. La pantalla dividida está disponible en escritorio o tablet en horizontal.</span>
</div>

<div class="ws-area vertical" id="area">
  <!-- Slots de panel (1, 2 o 4) se generan por JS -->
</div>

<div class="ws-menu-flotante" id="menuContexto" style="position:fixed;"></div>

<div class="ws-toasts" id="toasts"></div>

<div class="ws-overlay" id="overlayModal">
  <div class="ws-modal" id="modalCaja" role="dialog" aria-modal="true"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="paletaInput" placeholder="Buscar sección o acción…" autocomplete="off">
      <span class="ws-kbd">esc</span>
