    <div class="ws-paleta-footer">
      <span><span class="ws-kbd">↑↓</span> moverse</span>
      <span><span class="ws-kbd">↵</span> abrir</span>
      <span><span class="ws-kbd">esc</span> cerrar</span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ===================================================================
  // Comprobación de sesión: igual que hace admin.js, si no hay token no
  // tiene sentido mostrar el workspace (los iframes de panel.html
  // redirigirían igualmente a login, pero así se evita el parpadeo).
  // ===================================================================
  if (!localStorage.getItem("eof_token") || !localStorage.getItem("eof_user")) {
    location.href = "login.html";
    return;
  }

  // Usuario de la sesión actual (mismo localStorage que usa panel.html /
  // admin.js): solo hace falta el rol aquí, para decidir la sección de
  // arranque por defecto (ver el bloque de arranque, al final).
  let USER = null;
  try { USER = JSON.parse(localStorage.getItem("eof_user") || "null"); } catch (e) {}

  // ===================================================================
  // Iconos por categoría (SVG en línea, mismo estilo trazo que ya usa
  // el resto del workspace) y catálogo de secciones navegables (mismo
  // mapa tab.subtab que ya entiende panel.html vía ?ir=). Si mañana se
  // añade una sección nueva al panel, basta con añadirla aquí para que
  // aparezca en la bienvenida y en la paleta de comandos.
  // ===================================================================
  const ICONOS_CATEGORIA = {
    noticias: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/>',
    resultados: '<path d="M3 3v18h18"/><path d="M7 13v5M12 9v9M17 5v13"/>',
    contenido: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/>',
    solicitudes: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    tienda: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    usuarios: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    funcionalidades: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/>',
    ajustes: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.04-1.55 1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .33-1.87 1.7 1.7 0 0 0-1.55-1.04H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.04 1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.33h.06A1.7 1.7 0 0 0 10.14 3H10a2 2 0 0 1 4 0v.09c0 .67.4 1.27 1.02 1.53h.06a1.7 1.7 0 0 0 1.87-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.33 1.87v.06c.26.62.86 1.02 1.53 1.02H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.53 1.02z"/>',
  };
  const CATEGORIAS = [
    { id: "noticias",        nombre: "Noticias" },
    { id: "resultados",      nombre: "Resultados" },
    { id: "contenido",       nombre: "Contenido" },
    { id: "solicitudes",     nombre: "Solicitudes" },
    { id: "tienda",          nombre: "Tienda" },
    { id: "usuarios",        nombre: "Usuarios" },
    { id: "funcionalidades", nombre: "Funcionalidades" },
    { id: "ajustes",         nombre: "Ajustes" },
  ];
  const SECCIONES = [
    { id: "noticias.nueva", tab: "noticias", subtab: "nueva", titulo: "Nueva noticia", desc: "Redactar noticia, previa o crónica", categoria: "noticias" },
    { id: "noticias.lista", tab: "noticias", subtab: "lista", titulo: "Ver noticias", desc: "Listado y edición de noticias", categoria: "noticias" },
    { id: "resultados.resultado", tab: "resultados", subtab: "resultado", titulo: "Nuevo resultado", desc: "Cargar un marcador", categoria: "resultados" },
    { id: "resultados.listaResultados", tab: "resultados", subtab: "listaResultados", titulo: "Ver resultados", desc: "Listado de resultados", categoria: "resultados" },
    { id: "resultados.calendarioJornadas", tab: "resultados", subtab: "calendarioJornadas", titulo: "Calendario de jornadas", desc: "Planificación por jornada", categoria: "resultados" },
    { id: "resultados.importacionRapida", tab: "resultados", subtab: "importacionRapida", titulo: "Importación rápida", desc: "Carga masiva de resultados", categoria: "resultados" },
    { id: "contenido.subir", tab: "contenido", subtab: "subir", titulo: "Subir contenido", desc: "Fotos y vídeos", categoria: "contenido" },
    { id: "contenido.ver", tab: "contenido", subtab: "ver", titulo: "Ver contenido subido", desc: "Galería multimedia", categoria: "contenido" },
    { id: "contenido.galeriaPartido", tab: "contenido", subtab: "galeriaPartido", titulo: "Galería de partido", desc: "Fotos asociadas a un partido", categoria: "contenido" },
    { id: "solicitudes.solicitudesRecibidas", tab: "solicitudes", subtab: "solicitudesRecibidas", titulo: "Solicitudes recibidas", desc: "Pendientes de tu respuesta", categoria: "solicitudes" },
    { id: "solicitudes.solicitudesMias", tab: "solicitudes", subtab: "solicitudesMias", titulo: "Mis solicitudes", desc: "Solicitudes que has enviado", categoria: "solicitudes" },
    { id: "tienda.tiendaCatalogo", tab: "tienda", subtab: "tiendaCatalogo", titulo: "Tienda · Catálogo", desc: "Productos disponibles", categoria: "tienda" },
    { id: "tienda.tiendaMisPedidos", tab: "tienda", subtab: "tiendaMisPedidos", titulo: "Tienda · Mis pedidos", desc: "", categoria: "tienda" },
    { id: "tienda.tiendaGestion", tab: "tienda", subtab: "tiendaGestion", titulo: "Tienda · Gestión de pedidos", desc: "Solo administración", categoria: "tienda" },
    { id: "tienda.tiendaProductos", tab: "tienda", subtab: "tiendaProductos", titulo: "Tienda · Productos", desc: "Solo administración", categoria: "tienda" },
    { id: "usuarios.redactores", tab: "usuarios", subtab: "redactores", titulo: "Usuarios · Colaboradores", desc: "", categoria: "usuarios" },
    { id: "usuarios.lectores", tab: "usuarios", subtab: "lectores", titulo: "Usuarios · Lectores", desc: "", categoria: "usuarios" },
    { id: "funcionalidades.comentarios", tab: "funcionalidades", subtab: "comentarios", titulo: "Comentarios", desc: "Moderación", categoria: "funcionalidades" },
    { id: "funcionalidades.encuestas", tab: "funcionalidades", subtab: "encuestas", titulo: "Encuestas", desc: "", categoria: "funcionalidades" },
    { id: "funcionalidades.newsletter", tab: "funcionalidades", subtab: "newsletter", titulo: "Newsletter", desc: "", categoria: "funcionalidades" },
    { id: "funcionalidades.historial", tab: "funcionalidades", subtab: "historial", titulo: "Historial", desc: "", categoria: "funcionalidades" },
    { id: "funcionalidades.equipos", tab: "funcionalidades", subtab: "equipos", titulo: "Equipos", desc: "", categoria: "funcionalidades" },
    { id: "funcionalidades.redesSociales", tab: "funcionalidades", subtab: "redesSociales", titulo: "Redes sociales", desc: "", categoria: "funcionalidades" },
    { id: "ajustes.perfil", tab: "ajustes", subtab: "perfil", titulo: "Ajustes · Perfil", desc: "", categoria: "ajustes" },
  ];
  const seccionPorId = id => SECCIONES.find(s => s.id === id);
  const iconoSvg = (categoria, tam) => `<svg viewBox="0 0 24 24" width="${tam||15}" height="${tam||15}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONOS_CATEGORIA[categoria] || ICONOS_CATEGORIA.ajustes}</svg>`;

  // ===================================================================
  // Estado: lista de pestañas abiertas + cuál/es están visibles en el
  // área (1 si no hay split, 2 ids si lo hay) + orientación del split.
  // Cada pestaña es { id, seccionId, titulo, subTitulo }.
  // Persistido en localStorage para recuperar la sesión de trabajo al
  // recargar o volver más tarde (no afecta a otros usuarios: es local
  // a este navegador, igual que el tema).
  // ===================================================================
  const CLAVE_ESTADO = "eof_workspace_estado_v1";
  const CLAVE_LAYOUTS = "eof_workspace_layouts_v1";
  const CLAVE_RECIENTES = "eof_workspace_recientes_v1";
  let estado = cargarEstado();

  function estadoPorDefecto(){
    return {
      pestanas: [],
      activaId: null,   // pestaña con foco cuando NO hay split ni grid
      splitIds: null,    // [idA, idB] cuando SÍ hay split de 2, si no null
      gridIds: null,      // [idA, idB, idC, idD] (algunos pueden ser null) cuando hay cuadrícula de 4
      orientacion: "vertical", // "vertical" (lado a lado) u "horizontal" (arriba/abajo), solo aplica al split de 2
    };
  }
  function cargarEstado(){
    try {
      const bruto = localStorage.getItem(CLAVE_ESTADO);
      if (!bruto) return estadoPorDefecto();
      const datos = JSON.parse(bruto);
      if (!datos || !Array.isArray(datos.pestanas)) return estadoPorDefecto();
      return datos;
    } catch (e) {
      return estadoPorDefecto();
    }
  }
  function guardarEstado(){
    try { localStorage.setItem(CLAVE_ESTADO, JSON.stringify(estado)); } catch (e) {}
  }

  let contadorId = 1;
  function nuevoId(){ return "t" + (Date.now().toString(36)) + (contadorId++); }

  // Pestañas con cambios sin guardar conocidos (alimentado por los
  // mensajes "eof-workspace-dirty" que manda cada iframe). Vive fuera
  // de "estado" a propósito: es información transitoria de sesión, no
  // algo que tenga sentido persistir ni restaurar al recargar.
  const pestanasSucias = new Set();

  // ===================================================================
  // Notificaciones (toast): sustituyen a los avisos silenciosos o a
  // usar alert() para confirmar que una acción (guardar layout, cerrar
  // pestaña...) ha surtido efecto.
  // ===================================================================
  const cajaToasts = document.getElementById("toasts");
  const ICONO_TOAST = {
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/>',
    exito: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
    error: '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>',
  };
  function mostrarToast(mensaje, tipo){
    tipo = tipo || "info";
    const el = document.createElement("div");
    el.className = "ws-toast " + (tipo === "info" ? "" : tipo);
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONO_TOAST[tipo] || ICONO_TOAST.info}</svg><span>${escapeHtml(mensaje)}</span>`;
    cajaToasts.appendChild(el);
    const quitar = () => {
      el.classList.add("saliendo");
      setTimeout(() => el.remove(), 220);
    };
    setTimeout(quitar, 2800);
    el.addEventListener("click", quitar);
  }

  // ===================================================================
  // Modal genérico (confirmar / pedir texto), en sustitución de los
  // confirm()/prompt() nativos del navegador para que encajen con el
  // resto de la interfaz. Devuelve una promesa: {ok, valor}.
  // ===================================================================
  const overlayModal = document.getElementById("overlayModal");
  const modalCaja = document.getElementById("modalCaja");
  function mostrarModal({ titulo, mensaje, input = false, valorInicial = "", placeholder = "", textoAceptar = "Aceptar", textoCancelar = "Cancelar", peligro = false }){
    return new Promise((resolver) => {
      modalCaja.innerHTML = `
        <h3>${escapeHtml(titulo)}</h3>
        ${mensaje ? `<p>${escapeHtml(mensaje)}</p>` : ""}
        ${input ? `<input type="text" id="modalInputTexto" placeholder="${escapeHtml(placeholder)}">` : ""}
        <div class="ws-modal-acciones">
          <button type="button" class="ws-modal-btn" data-accion="cancelar">${escapeHtml(textoCancelar)}</button>
          <button type="button" class="ws-modal-btn primario${peligro ? "" : " neutro"}" data-accion="aceptar">${escapeHtml(textoAceptar)}</button>
        </div>`;
      overlayModal.classList.add("abierto");
      const campo = modalCaja.querySelector("#modalInputTexto");
      if (campo) { campo.value = valorInicial; setTimeout(() => { campo.focus(); campo.select(); }, 20); }
      else { setTimeout(() => modalCaja.querySelector('[data-accion="aceptar"]').focus(), 20); }

      function cerrar(ok){
        overlayModal.classList.remove("abierto");
        document.removeEventListener("keydown", alTeclado);
        resolver({ ok, valor: campo ? campo.value.trim() : true });
      }
      function alTeclado(ev){
        if (ev.key === "Escape") cerrar(false);
        if (ev.key === "Enter") cerrar(true);
      }
      modalCaja.querySelector('[data-accion="cancelar"]').addEventListener("click", () => cerrar(false));
      modalCaja.querySelector('[data-accion="aceptar"]').addEventListener("click", () => cerrar(true));
      overlayModal.addEventListener("click", function alFondo(ev){ if (ev.target === overlayModal) { cerrar(false); overlayModal.removeEventListener("click", alFondo); } });
      document.addEventListener("keydown", alTeclado);
    });
  }

  function abrirPestana(seccionId, { activarla = true, enSplitCon = null } = {}){
    const seccion = seccionPorId(seccionId);
    if (!seccion) return;
    const id = nuevoId();
    estado.pestanas.push({ id, seccionId, titulo: seccion.titulo, subTitulo: null });
    if (enSplitCon) {
      estado.splitIds = [enSplitCon, id];
      estado.gridIds = null;
      estado.activaId = null;
    } else if (activarla) {
      estado.splitIds = null;
      estado.gridIds = null;
      estado.activaId = id;
    }
    registrarReciente(seccionId);
    guardarEstado();
    render();
    return id;
  }

  // Abre la sección indicada activándola si ya hay una pestaña abierta
  // con ella (en vez de duplicarla), o crea una pestaña nueva si no.
  // Expuesta en window porque abrirDesdeQuerystring() y
  // abrirPestanaAjustes() la usan más abajo en este mismo IIFE.
  function abrirPestanaPorId(seccionId){
    const existente = estado.pestanas.find(p => p.seccionId === seccionId);
    if (existente) {
      estado.splitIds = null;
      estado.gridIds = null;
      estado.activaId = existente.id;
      guardarEstado();
      render();
      return existente.id;
    }
    return abrirPestana(seccionId);
  }
  window.abrirPestanaPorId = abrirPestanaPorId;

  // "Ajustes de cuenta" del menú de usuario: siempre son la misma
  // sección de workspace (ajustes.perfil, que carga panel.html con
  // ?ir=ajustes.perfil), y una vez abierta esa pestaña se le reenvía a
  // su iframe qué subpestaña concreta activar (perfil/password/
  // progreso/sesiones), tal y como panel.html ya sabe leer por su propio
  // querystring ?ajustes=.
  window.abrirPestanaAjustes = function(seccion){
    const id = abrirPestanaPorId("ajustes.perfil");
    setTimeout(() => {
      const iframe = document.getElementById("iframe-" + id);
      if (iframe) iframe.src = "panel.html?ajustes=" + encodeURIComponent(seccion);
    }, 0);
  };

  function registrarReciente(seccionId){
    try {
      let lista = JSON.parse(localStorage.getItem(CLAVE_RECIENTES) || "[]");
      lista = [seccionId, ...lista.filter(x => x !== seccionId)].slice(0, 6);
      localStorage.setItem(CLAVE_RECIENTES, JSON.stringify(lista));
    } catch (e) {}
  }
  function obtenerRecientes(){
    try { return (JSON.parse(localStorage.getItem(CLAVE_RECIENTES) || "[]")).map(seccionPorId).filter(Boolean); }
    catch (e) { return []; }
  }

  // Pide confirmación si la pestaña tiene cambios sin guardar conocidos
  // (ver seguimiento de "dirty" más abajo, alimentado por admin.js vía
  // postMessage). Devuelve una promesa<boolean>: true si se puede
  // cerrar, false si la persona ha cancelado.
  async function confirmarCierre(id){
    if (!pestanasSucias.has(id)) return true;
    const p = estado.pestanas.find(x => x.id === id);
    const nombre = p ? p.titulo + (p.subTitulo ? " · " + p.subTitulo : "") : "esta pestaña";
    const { ok } = await mostrarModal({
      titulo: "Cambios sin guardar",
      mensaje: `"${nombre}" tiene cambios sin guardar. ¿Cerrarla de todos modos? Se perderá lo que no se haya guardado.`,
      textoAceptar: "Cerrar de todos modos",
      textoCancelar: "Seguir editando",
      peligro: true,
    });
    return ok;
  }

  async function cerrarPestana(id, { forzar = false } = {}){
    if (!forzar && !(await confirmarCierre(id))) return;
    pestanasSucias.delete(id);
    estado.pestanas = estado.pestanas.filter(p => p.id !== id);
    if (estado.activaId === id) estado.activaId = null;
    if (estado.splitIds) {
      estado.splitIds = estado.splitIds.filter(x => x !== id);
      if (estado.splitIds.length < 2) {
        const restante = estado.splitIds[0] || null;
        estado.splitIds = null;
        estado.activaId = restante;
      }
    }
    if (estado.gridIds) {
      estado.gridIds = estado.gridIds.map(x => x === id ? null : x);
      if (estado.gridIds.every(x => !x)) estado.gridIds = null;
    }
    // Si no queda ninguna pestaña activa ni split ni grid, activar la
    // última pestaña abierta (si queda alguna) para no dejar el área
    // en blanco.
    if (!estado.activaId && !estado.splitIds && !estado.gridIds && estado.pestanas.length) {
      estado.activaId = estado.pestanas[estado.pestanas.length - 1].id;
    }
    delete iframesVivos[id];
    guardarEstado();
    render();
  }

  function seleccionarPestana(id){
    if (estado.splitIds && estado.splitIds.includes(id)) return; // ya visible en split
    if (estado.gridIds && estado.gridIds.includes(id)) return; // ya visible en cuadrícula
    estado.splitIds = null;
    estado.gridIds = null;
    estado.activaId = id;
    guardarEstado();
    render();
  }

  // ---------- Reordenar pestañas arrastrando (como cualquier editor) ----------
  let idArrastrado = null;
  function iniciarArrastreTab(id){ idArrastrado = id; }
  function soltarTabSobre(idDestino){
    if (!idArrastrado || idArrastrado === idDestino) { idArrastrado = null; return; }
    const iOrigen = estado.pestanas.findIndex(p => p.id === idArrastrado);
    const iDestino = estado.pestanas.findIndex(p => p.id === idDestino);
    if (iOrigen === -1 || iDestino === -1) { idArrastrado = null; return; }
    const [movida] = estado.pestanas.splice(iOrigen, 1);
    estado.pestanas.splice(iDestino, 0, movida);
    idArrastrado = null;
    guardarEstado();
    renderTabbar();
  }

  // ---------- Cuadrícula 2x2 (hasta 4 pestañas a la vez) ----------
  function activarGrid4(){
    if (estado.pestanas.length < 2) { mostrarToast("Abre al menos dos pestañas para usar la cuadrícula.", "info"); return; }
    const enUso = new Set();
    if (estado.activaId) enUso.add(estado.activaId);
    if (estado.splitIds) estado.splitIds.forEach(x => enUso.add(x));
    // Se parte de lo que ya estaba visible y se completa con las
    // siguientes pestañas abiertas hasta llegar a 4 (o hasta agotarlas).
    const orden = [...enUso, ...estado.pestanas.map(p => p.id).filter(id => !enUso.has(id))];
    estado.gridIds = [orden[0] || null, orden[1] || null, orden[2] || null, orden[3] || null];
    estado.splitIds = null;
    estado.activaId = null;
    guardarEstado();
    render();
  }

  function cerrarGrid4(idQueQueda){
    estado.gridIds = null;
    estado.activaId = idQueQueda || (estado.pestanas[estado.pestanas.length - 1] || {}).id || null;
    guardarEstado();
    render();
  }

  // Cambia qué pestaña ocupa un hueco concreto de la cuadrícula (se usa
  // desde el selector que aparece en cada hueco vacío o para sustituir
  // una pestaña por otra sin salir del modo cuadrícula).
  function asignarHuecoGrid(indice, pestanaId){
    if (!estado.gridIds) return;
    estado.gridIds[indice] = pestanaId;
    guardarEstado();
    render();
  }

  function dividirConSeleccionada(){
    const base = estado.activaId || (estado.gridIds || []).find(Boolean);
    const abiertas = estado.pestanas.filter(p => p.id !== base);
    if (!base || !abiertas.length) { mostrarToast("Abre otra pestaña para poder dividir la pantalla.", "info"); return; }
    // Se pide con qué otra pestaña abierta partir; si solo hay una más,
    // se usa directamente sin preguntar.
    if (abiertas.length === 1) {
      estado.splitIds = [base, abiertas[0].id];
      estado.gridIds = null;
      estado.activaId = null;
      guardarEstado();
      render();
      return;
    }
    mostrarSelectorSplit(base, abiertas);
  }

  function mostrarSelectorSplit(idBase, candidatas){
    const menu = document.getElementById("menuLayouts");
    menu.innerHTML = "";
    const titulo = document.createElement("div");
    titulo.className = "ws-menu-titulo";
    titulo.textContent = "Dividir con...";
    menu.appendChild(titulo);
    candidatas.forEach(p => {
      const item = document.createElement("div");
      item.className = "ws-menu-item";
      item.innerHTML = `${iconoSvg((seccionPorId(p.seccionId)||{}).categoria)}<span>${escapeHtml(p.titulo)}${p.subTitulo ? " · " + escapeHtml(p.subTitulo) : ""}</span>`;
      item.addEventListener("click", () => {
        estado.splitIds = [idBase, p.id];
        estado.gridIds = null;
        estado.activaId = null;
        guardarEstado();
        cerrarMenuLayouts();
        render();
      });
      menu.appendChild(item);
    });
    abrirMenuLayouts();
  }

  // Pone una pestaña concreta en split junto a otra, sin pasar por el
  // selector: se usa desde el icono de "dividir" que aparece al pasar
  // el ratón por cada pestaña y desde el menú contextual (clic
  // derecho). Así, con tres o más pestañas abiertas, cualquier pareja
  // de ellas se puede dividir directamente sin tener que activarlas
  // primero una a una.
  function ponerEnSplit(idA, idB){
    estado.splitIds = [idA, idB];
    estado.gridIds = null;
    estado.activaId = null;
    guardarEstado();
    render();
  }
  function dividirConTab(idObjetivo){
    if (estado.pestanas.length < 2) { mostrarToast("Abre otra pestaña para poder dividir la pantalla.", "info"); return; }
    let idBase = estado.activaId && estado.activaId !== idObjetivo ? estado.activaId
      : (estado.splitIds || []).find(x => x !== idObjetivo)
      || (estado.pestanas.map(p => p.id).find(id => id !== idObjetivo));
    if (!idBase) { mostrarToast("Necesitas otra pestaña distinta para dividir.", "info"); return; }
    ponerEnSplit(idBase, idObjetivo);
  }

  // Cambia qué pestaña ocupa un hueco ya visible de un split o de la
  // cuadrícula, sin cerrar nada: se usa desde el desplegable que
  // aparece al pulsar la letra (A/B/C/D) de cada panel.
  function reemplazarPestanaEnSlot(idViejo, idNuevo, indiceGrid){
    if (typeof indiceGrid === "number") { asignarHuecoGrid(indiceGrid, idNuevo); return; }
    if (estado.splitIds) {
      estado.splitIds = estado.splitIds.map(x => x === idViejo ? idNuevo : x);
      guardarEstado();
      render();
    }
  }

  function duplicarPestana(p){
    abrirPestana(p.seccionId);
    mostrarToast(`"${p.titulo}" duplicada.`, "exito");
  }
  async function cerrarOtrasPestanas(idQueQueda){
    const otras = estado.pestanas.filter(p => p.id !== idQueQueda);
    for (const p of otras) { if (!pestanasSucias.has(p.id) || await confirmarCierre(p.id)) await cerrarPestana(p.id, { forzar: true }); }
    seleccionarPestana(idQueQueda);
  }
  async function cerrarPestanasADerecha(id){
    const idx = estado.pestanas.findIndex(p => p.id === id);
    if (idx === -1) return;
    const aCerrar = estado.pestanas.slice(idx + 1);
    for (const p of aCerrar) { if (!pestanasSucias.has(p.id) || await confirmarCierre(p.id)) await cerrarPestana(p.id, { forzar: true }); }
  }

  // ---------- Menú contextual de pestañas (clic derecho) ----------
  const menuContexto = document.getElementById("menuContexto");
  function cerrarMenuContexto(){ menuContexto.classList.remove("abierto"); }
  function itemMenu(svgPath, texto, onClick){
    const item = document.createElement("div");
    item.className = "ws-menu-item";
    item.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svgPath}</svg><span>${escapeHtml(texto)}</span>`;
    item.addEventListener("click", () => { cerrarMenuContexto(); onClick(); });
    return item;
  }
  function posicionarMenuFlotante(menu, x, y){
    menu.style.right = "auto"; menu.style.left = "0"; menu.style.top = "0";
    menu.classList.add("abierto");
    const ancho = menu.offsetWidth || 230, alto = menu.offsetHeight || 160;
    menu.style.left = Math.max(8, Math.min(x, window.innerWidth - ancho - 10)) + "px";
    menu.style.top = Math.max(8, Math.min(y, window.innerHeight - alto - 10)) + "px";
  }
  function abrirMenuContextoTab(p, x, y){
    cerrarMenuLayouts(); cerrarMenuAyuda();
    menuContexto.innerHTML = "";
    const hayOtras = estado.pestanas.length > 1;
    // En pantalla estrecha no hay sitio para split/grid (ver
    // @media max-width:760px): se quita también esta tercera vía de
    // entrar en ese modo, además de los botones de la cabecera y el
    // icono de "dividir" de cada pestaña.
    if (!ES_MOVIL()) {
      menuContexto.appendChild(itemMenu('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/>', "Dividir con la pestaña activa", () => hayOtras ? dividirConTab(p.id) : mostrarToast("Abre otra pestaña primero.", "info")));
    }
    menuContexto.appendChild(itemMenu('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>', "Duplicar pestaña", () => duplicarPestana(p)));
    menuContexto.appendChild(Object.assign(document.createElement("div"), { className: "ws-menu-sep" }));
    menuContexto.appendChild(itemMenu('<path d="M6 6l12 12M18 6L6 18"/>', "Cerrar", () => cerrarPestana(p.id)));
    if (hayOtras) menuContexto.appendChild(itemMenu('<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>', "Cerrar las demás", () => cerrarOtrasPestanas(p.id)));
    if (estado.pestanas[estado.pestanas.length - 1] && estado.pestanas[estado.pestanas.length - 1].id !== p.id) {
      menuContexto.appendChild(itemMenu('<path d="M5 12h14M13 6l6 6-6 6"/>', "Cerrar las de la derecha", () => cerrarPestanasADerecha(p.id)));
    }
    posicionarMenuFlotante(menuContexto, x, y);
  }
  function abrirMenuCambiarSlot(idActual, candidatas, x, y, indiceGrid){
    cerrarMenuLayouts(); cerrarMenuAyuda();
    menuContexto.innerHTML = "";
    const titulo = document.createElement("div");
    titulo.className = "ws-menu-titulo";
    titulo.textContent = "Mostrar aquí...";
    menuContexto.appendChild(titulo);
    if (!candidatas.length) {
      const vacio = document.createElement("div");
      vacio.className = "ws-menu-vacio";
      vacio.textContent = "No hay otras pestañas abiertas.";
      menuContexto.appendChild(vacio);
    }
    candidatas.forEach(p => {
      const item = document.createElement("div");
      item.className = "ws-menu-item";
      item.innerHTML = `${iconoSvg((seccionPorId(p.seccionId)||{}).categoria)}<span>${escapeHtml(p.titulo)}${p.subTitulo ? " · " + escapeHtml(p.subTitulo) : ""}</span>`;
      item.addEventListener("click", () => { cerrarMenuContexto(); reemplazarPestanaEnSlot(idActual, p.id, indiceGrid); });
      menuContexto.appendChild(item);
    });
    posicionarMenuFlotante(menuContexto, x, y);
  }

  function cerrarSplit(idQueQueda){
    estado.splitIds = null;
    estado.activaId = idQueQueda;
    guardarEstado();
    render();
  }

  function girarOrientacion(){
    estado.orientacion = estado.orientacion === "vertical" ? "horizontal" : "vertical";
    guardarEstado();
    render();
  }

  // ===================================================================
  // Pill de estado en la cabecera: cuántas pestañas tienen cambios sin
  // guardar, para que se vea de un vistazo sin tener que mirar pestaña
  // por pestaña.
  // ===================================================================
  const pillEstado = document.getElementById("pillEstado");
  const txtPillEstado = document.getElementById("txtPillEstado");
  function renderPillEstado(){
    const n = pestanasSucias.size;
    pillEstado.style.display = n ? "inline-flex" : "none";
    txtPillEstado.textContent = n === 1 ? "1 sin guardar" : `${n} sin guardar`;
    pillEstado.title = n === 1 ? "Hay 1 pestaña con cambios sin guardar" : `Hay ${n} pestañas con cambios sin guardar`;
  }

  // ===================================================================
  // Render de la barra de pestañas
  // ===================================================================
  const tabbar = document.getElementById("tabbar");
  function renderTabbar(){
    tabbar.innerHTML = "";
    estado.pestanas.forEach((p, idx) => {
      const enSplit = estado.splitIds && estado.splitIds.includes(p.id);
      const enGrid = estado.gridIds && estado.gridIds.includes(p.id);
      const esActiva = estado.activaId === p.id;
      const categoria = (seccionPorId(p.seccionId) || {}).categoria;
      const el = document.createElement("div");
      el.className = "ws-tab" + (esActiva || enSplit || enGrid ? " seleccionada" : "") + (enSplit || enGrid ? " en-split" : "");
      el.title = p.titulo + (p.subTitulo ? " · " + p.subTitulo : "") + (idx < 9 ? ` (Ctrl+${idx + 1})` : "");
      el.draggable = true;
      const marca = enSplit ? (estado.splitIds[0] === p.id ? "A" : "B")
        : enGrid ? String.fromCharCode(65 + estado.gridIds.indexOf(p.id))
        : null;
      el.innerHTML = `
        <span class="ws-tab-icono">${iconoSvg(categoria, 13)}</span>
        ${pestanasSucias.has(p.id) ? '<span class="ws-tab-dirty" title="Cambios sin guardar"></span>' : ""}
        <span class="ws-tab-titulo">${escapeHtml(p.titulo)}${p.subTitulo ? " · " + escapeHtml(p.subTitulo) : ""}</span>
        ${marca ? `<span class="ws-tab-split-marca">${marca}</span>` : ""}
        ${estado.pestanas.length > 1 && !enGrid ? `<span class="ws-tab-dividir" data-dividir="${p.id}" title="Dividir con esta pestaña">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
        </span>` : ""}
        <span class="ws-tab-cerrar" data-cerrar="${p.id}" title="Cerrar (Ctrl+W)">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </span>`;
      el.addEventListener("click", (ev) => {
        if (ev.target.closest("[data-cerrar],[data-dividir]")) return;
        seleccionarPestana(p.id);
      });
      el.querySelector("[data-cerrar]").addEventListener("click", (ev) => {
        ev.stopPropagation();
        cerrarPestana(p.id);
      });
      const btnDividirTab = el.querySelector("[data-dividir]");
      if (btnDividirTab) btnDividirTab.addEventListener("click", (ev) => {
        ev.stopPropagation();
        dividirConTab(p.id);
      });
      el.addEventListener("contextmenu", (ev) => {
        ev.preventDefault();
        abrirMenuContextoTab(p, ev.clientX, ev.clientY);
      });
      el.addEventListener("dragstart", (ev) => {
        iniciarArrastreTab(p.id);
        el.classList.add("arrastrandose");
        try { ev.dataTransfer.setData("text/plain", p.id); ev.dataTransfer.effectAllowed = "move"; } catch (e) {}
      });
      el.addEventListener("dragend", () => el.classList.remove("arrastrandose"));
      el.addEventListener("dragover", (ev) => { ev.preventDefault(); el.classList.add("arrastre-sobre"); });
      el.addEventListener("dragleave", () => el.classList.remove("arrastre-sobre"));
      el.addEventListener("drop", (ev) => { ev.preventDefault(); el.classList.remove("arrastre-sobre"); soltarTabSobre(p.id); });
      tabbar.appendChild(el);
    });
    const btnNueva = document.createElement("div");
    btnNueva.className = "ws-tab-nueva";
    btnNueva.title = "Nueva pestaña (Ctrl+T)";
    btnNueva.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
    btnNueva.addEventListener("click", () => mostrarBienvenida(null));
    tabbar.appendChild(btnNueva);
    renderPillEstado();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ===================================================================
  // Render del área principal: bienvenida, 1 panel, split de 2, o
  // cuadrícula de hasta 4
  // ===================================================================
  const area = document.getElementById("area");
  const avisoMovil = document.getElementById("avisoMovil");
  const iframesVivos = {}; // id de pestaña -> elemento iframe, para no recargarlos al re-renderizar
  const ES_MOVIL = () => {
    try { return window.matchMedia("(max-width: 760px)").matches; }
    catch (e) { return window.innerWidth <= 760; }
  };

  function render(){
    renderTabbar();
    document.getElementById("btnGirar").style.display = estado.splitIds ? "" : "none";
    document.getElementById("btnDividir").classList.toggle("activo", !!estado.splitIds);
    document.getElementById("btnGrid4").classList.toggle("activo", !!estado.gridIds);
    document.getElementById("btnDividir").querySelector(".txt-btn").textContent = estado.splitIds ? "Cerrar split" : "Dividir";

    if (estado.gridIds) {
      area.className = "ws-area grid4";
      area.innerHTML = "";
      avisoMovil.classList.toggle("visible", ES_MOVIL());
      estado.gridIds.forEach((id, idx) => {
        area.appendChild(id ? crearSlot(id, true, idx) : crearHuecoVacioGrid(idx));
      });
      if (ES_MOVIL()) marcarSlotVisibleMovil(estado.gridIds.find(Boolean));
      return;
    }

    area.className = "ws-area " + (estado.orientacion === "horizontal" ? "horizontal" : "vertical");
    area.innerHTML = "";

    if (estado.splitIds && estado.splitIds.length === 2) {
      avisoMovil.classList.toggle("visible", ES_MOVIL());
      const [idA, idB] = estado.splitIds;
      const slotA = crearSlot(idA, true);
      const slotB = crearSlot(idB, true);
      const divisor = document.createElement("div");
      divisor.className = "ws-divisor";
      area.appendChild(slotA);
      area.appendChild(divisor);
      area.appendChild(slotB);
      habilitarArrastreDivisor(divisor, slotA, slotB);
      if (ES_MOVIL()) marcarSlotVisibleMovil(idA);
      return;
    }

    avisoMovil.classList.remove("visible");

    if (estado.activaId) {
      area.appendChild(crearSlot(estado.activaId, false));
      // Caso de una sola pestaña sin split/grid: en pantallas estrechas
      // el CSS oculta con display:none!important cualquier
      // .ws-panel-slot que no lleve esta clase (ver @media max-width:
      // 760px), así que sin marcarla aquí el único slot se queda
      // oculto y el área se ve vacía/negra aunque el iframe siga
      // cargado y respondiendo por debajo.
      if (ES_MOVIL()) marcarSlotVisibleMovil(estado.activaId);
      return;
    }

    mostrarBienvenida();
  }

  // En móvil no hay sitio para mostrar 2-4 iframes a la vez con
  // usabilidad real, así que aunque el estado lógico siga siendo
  // split/grid (se conserva para cuando se vuelva a escritorio), solo
  // se muestra un slot cada vez, marcado con esta clase.
  function marcarSlotVisibleMovil(idVisible){
    area.querySelectorAll(".ws-panel-slot").forEach(slot => {
      slot.classList.toggle("ws-slot-movil-activo", slot.dataset.pestanaId === idVisible);
    });
  }

  function crearHuecoVacioGrid(indice){
    const hueco = document.createElement("div");
    hueco.className = "ws-panel-slot";
    hueco.style.display = "flex";
    hueco.style.alignItems = "center";
    hueco.style.justifyContent = "center";
    hueco.style.background = "var(--fondo-alt)";
    hueco.innerHTML = `<button type="button" class="ws-seccion-btn" style="cursor:pointer;box-shadow:none;">
        <span class="ws-seccion-icono"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="ws-seccion-texto"><strong>Añadir pestaña aquí</strong><span>Elegir una sección para este hueco</span></span>
      </button>`;
    hueco.querySelector("button").addEventListener("click", () => mostrarBienvenida(indice));
    return hueco;
  }

  function crearSlot(pestanaId, esSplit, indiceGrid){
    const p = estado.pestanas.find(x => x.id === pestanaId);
    const slot = document.createElement("div");
    slot.className = "ws-panel-slot";
    slot.dataset.pestanaId = pestanaId;
    slot.style.flex = "1 1 0";

    if (esSplit) {
      const letra = typeof indiceGrid === "number" ? String.fromCharCode(65 + indiceGrid) : (estado.splitIds[0] === pestanaId ? "A" : "B");
      const etiqueta = document.createElement("div");
      etiqueta.className = "ws-slot-etiqueta";
      etiqueta.innerHTML = `<span class="letra-slot" title="Mostrar otra pestaña aquí">${letra}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span><span class="punto"></span><span>${escapeHtml(p ? p.titulo + (p.subTitulo ? " · " + p.subTitulo : "") : "")}</span>
        <span class="ws-slot-cerrar-split" data-cerrar-split="${pestanaId}">${typeof indiceGrid === "number" ? "Quitar" : "Cerrar split"}</span>`;
      etiqueta.querySelector(".letra-slot").addEventListener("click", (ev) => {
        const visibles = new Set(estado.gridIds ? estado.gridIds.filter(Boolean) : (estado.splitIds || []));
        const candidatas = estado.pestanas.filter(x => !visibles.has(x.id));
        abrirMenuCambiarSlot(pestanaId, candidatas, ev.clientX, ev.clientY, indiceGrid);
      });
      etiqueta.querySelector("[data-cerrar-split]").addEventListener("click", () => {
        if (typeof indiceGrid === "number") {
          asignarHuecoGrid(indiceGrid, null);
        } else {
          const otro = estado.splitIds.find(x => x !== pestanaId);
          cerrarSplit(otro);
        }
      });
      slot.appendChild(etiqueta);
    }

    let iframe = iframesVivos[pestanaId];
    if (!iframe) {
      iframe = document.createElement("iframe");
      const seccion = seccionPorId(p.seccionId);
      iframe.src = "panel.html" + (seccion ? "?ir=" + encodeURIComponent(seccion.tab + "." + seccion.subtab) : "");
      iframe.id = "iframe-" + pestanaId;
      iframe.setAttribute("title", p.titulo);
      iframesVivos[pestanaId] = iframe;

      // Estado de carga breve: se retira en cuanto el iframe dispara
      // "load" (o pasados unos segundos como red de seguridad si el
      // navegador no llega a dispararlo por algún motivo).
      const cargando = document.createElement("div");
      cargando.className = "ws-slot-cargando";
      cargando.innerHTML = `<span class="ws-spinner"></span><span>Cargando ${escapeHtml(p.titulo)}…</span>`;
      const quitarCargando = () => { cargando.classList.add("oculto"); setTimeout(() => cargando.remove(), 250); };
      iframe.addEventListener("load", quitarCargando, { once: true });
      setTimeout(quitarCargando, 4000);
      slot.appendChild(cargando);
    }
    slot.appendChild(iframe);
    return slot;
  }

  function habilitarArrastreDivisor(divisor, slotA, slotB){
    let arrastrando = false;
    const esVertical = estado.orientacion !== "horizontal";
    divisor.addEventListener("mousedown", (e) => {
      arrastrando = true;
      divisor.classList.add("arrastrando");
      document.body.style.userSelect = "none";
      // Overlay invisible sobre los iframes mientras se arrastra, para
      // que el propio iframe no "robe" los eventos de mousemove.
      [slotA, slotB].forEach(s => {
        const ifr = s.querySelector("iframe");
        if (ifr) ifr.style.pointerEvents = "none";
      });
    });
    window.addEventListener("mousemove", (e) => {
      if (!arrastrando) return;
      const rectArea = area.getBoundingClientRect();
      if (esVertical) {
        const pct = Math.min(80, Math.max(20, ((e.clientX - rectArea.left) / rectArea.width) * 100));
        slotA.style.flex = `0 0 ${pct}%`;
        slotB.style.flex = `0 0 ${100 - pct}%`;
      } else {
        const pct = Math.min(80, Math.max(20, ((e.clientY - rectArea.top) / rectArea.height) * 100));
        slotA.style.flex = `0 0 ${pct}%`;
        slotB.style.flex = `0 0 ${100 - pct}%`;
      }
    });
    window.addEventListener("mouseup", () => {
      if (!arrastrando) return;
      arrastrando = false;
      divisor.classList.remove("arrastrando");
      document.body.style.userSelect = "";
      [slotA, slotB].forEach(s => {
        const ifr = s.querySelector("iframe");
        if (ifr) ifr.style.pointerEvents = "";
      });
    });
  }

  // ===================================================================
  // Pantalla de bienvenida / elegir sección para pestaña nueva, con
  // buscador, accesos recientes y secciones agrupadas por área para
  // que sea fácil de escanear en vez de una sola rejilla de 24 botones.
  // ===================================================================
  // huecoGridIndice: si se pasa, la sección elegida se coloca en ese
  // hueco de la cuadrícula 2x2 en vez de abrir una pestaña nueva suelta
  // (se usa desde el botón "+ Añadir pestaña aquí" de un hueco vacío).
  function mostrarBienvenida(huecoGridIndice){
    const dentroDeGrid = typeof huecoGridIndice === "number";
    if (!dentroDeGrid) {
      area.className = "ws-area vertical";
      area.innerHTML = "";
    }

    function elegir(seccionId){
      if (dentroDeGrid) {
        const seccion = seccionPorId(seccionId);
        const id = nuevoId();
        estado.pestanas.push({ id, seccionId, titulo: seccion.titulo, subTitulo: null });
        registrarReciente(seccionId);
        asignarHuecoGrid(huecoGridIndice, id);
      } else {
        abrirPestana(seccionId);
      }
    }

    const wrap = document.createElement("div");
    wrap.className = "ws-bienvenida";
    wrap.innerHTML = `
      <div class="ws-bienvenida-cabecera">
        <h2>¿Qué quieres abrir?</h2>
        <p>Elige una sección para esta pestaña. Puedes abrir varias a la vez y dividir la pantalla entre dos o cuatro de ellas.</p>
      </div>
      <div class="ws-buscador-secciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="buscadorSecciones" placeholder="Buscar sección…" autocomplete="off">
      </div>
      <div class="ws-recientes" id="recientesWrap"></div>
      <div class="ws-grupos-secciones" id="gruposSecciones"></div>
    `;

    const recientesWrap = wrap.querySelector("#recientesWrap");
    const recientes = obtenerRecientes();
    if (recientes.length) {
      const etq = document.createElement("span");
      etq.className = "ws-recientes-etq";
      etq.textContent = "Recientes:";
      recientesWrap.appendChild(etq);
      recientes.forEach(s => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "ws-chip-reciente";
        chip.innerHTML = `${iconoSvg(s.categoria, 13)}<span>${escapeHtml(s.titulo)}</span>`;
        chip.addEventListener("click", () => elegir(s.id));
        recientesWrap.appendChild(chip);
      });
    }

    const gruposWrap = wrap.querySelector("#gruposSecciones");
    function pintarGrupos(filtro){
      gruposWrap.innerHTML = "";
      const f = (filtro || "").trim().toLowerCase();
      let totalVisible = 0;
      CATEGORIAS.forEach(cat => {
        const items = SECCIONES.filter(s => s.categoria === cat.id && (!f || (s.titulo + " " + s.desc).toLowerCase().includes(f)));
        if (!items.length) return;
        totalVisible += items.length;
        const grupo = document.createElement("div");
        grupo.className = "ws-grupo-secciones";
        grupo.innerHTML = `<h3>${iconoSvg(cat.id, 13)}${escapeHtml(cat.nombre)}</h3>`;
        const grid = document.createElement("div");
        grid.className = "ws-secciones";
        items.forEach(s => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ws-seccion-btn";
          btn.innerHTML = `<span class="ws-seccion-icono">${iconoSvg(s.categoria)}</span>
            <span class="ws-seccion-texto"><strong>${escapeHtml(s.titulo)}</strong>${s.desc ? `<span>${escapeHtml(s.desc)}</span>` : ""}</span>`;
          btn.addEventListener("click", () => elegir(s.id));
          grid.appendChild(btn);
        });
        grupo.appendChild(grid);
        gruposWrap.appendChild(grupo);
      });
      if (!totalVisible) {
        gruposWrap.innerHTML = `<div class="ws-sin-resultados">Ninguna sección coincide con “${escapeHtml(filtro)}”.</div>`;
      }
    }
    pintarGrupos("");
    wrap.querySelector("#buscadorSecciones").addEventListener("input", (ev) => pintarGrupos(ev.target.value));

    if (dentroDeGrid) {
      const hueco = area.children[huecoGridIndice];
      if (hueco) { hueco.innerHTML = ""; hueco.appendChild(wrap); }
    } else {
      area.appendChild(wrap);
      setTimeout(() => { const c = wrap.querySelector("#buscadorSecciones"); if (c) c.focus(); }, 30);
    }
  }

  // ===================================================================
  // Escuchar mensajes de cada iframe (panel.html) para reflejar el
  // título real de la subsección activa en la pestaña del workspace,
  // ya que "Noticias" y "Resultados" abiertos a la vez son ambos
  // panel.html y sin esto se verían indistinguibles.
  // ===================================================================
  window.addEventListener("message", (ev) => {
    if (ev.origin !== location.origin) return;
    if (!ev.data || !ev.data.tipo) return;

    // El toggle de tema vive en la cabecera de cada iframe de panel.html
    // (ver admin.js): al pulsarlo, ese iframe aplica el cambio en su
    // propio documento y avisa aquí. El Workspace lo aplica también en
    // su propia ventana y lo reenvía al resto de iframes vivos, que de
    // otro modo se quedarían con el tema antiguo hasta recargar.
    if (ev.data.tipo === "eof-workspace-tema") {
      const nuevo = ev.data.tema === "dark" ? "dark" : "light";
      if (nuevo === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      } else {
        document.documentElement.removeAttribute("data-theme");
        document.documentElement.style.colorScheme = "light";
      }
      Object.values(iframesVivos).forEach((ifr) => {
        if (ifr.contentWindow && ifr.contentWindow !== ev.source) {
          try {
            ifr.contentWindow.postMessage({ tipo: "eof-workspace-tema", tema: nuevo }, location.origin);
          } catch (e) {}
        }
      });
      return;
    }

    // Averiguar qué pestaña es este iframe comparando ev.source con los
    // iframes vivos.
    const idPestana = Object.keys(iframesVivos).find(id => iframesVivos[id].contentWindow === ev.source);
    if (!idPestana) return;

    if (ev.data.tipo === "eof-workspace-dirty") {
      const yaEstaba = pestanasSucias.has(idPestana);
      if (ev.data.dirty) pestanasSucias.add(idPestana); else pestanasSucias.delete(idPestana);
      if (yaEstaba !== ev.data.dirty) renderTabbar();
      return;
    }

    if (ev.data.tipo !== "eof-workspace-seccion") return;
    const p = estado.pestanas.find(x => x.id === idPestana);
    if (!p) return;
    const seccion = SECCIONES.find(s => s.tab === ev.data.tab && s.subtab === ev.data.subtab);
    if (seccion) {
      p.titulo = seccion.titulo.split(" · ")[0];
      p.subTitulo = null;
    } else if (ev.data.tituloTab) {
      p.titulo = ev.data.tituloTab;
    }
    guardarEstado();
    renderTabbar();
  });

  // ===================================================================
  // Botones de la cabecera
  // ===================================================================
  document.getElementById("btnDividir").addEventListener("click", () => {
    if (estado.splitIds) { cerrarSplit(estado.splitIds[0]); return; }
    dividirConSeleccionada();
  });
  document.getElementById("btnGirar").addEventListener("click", girarOrientacion);
  document.getElementById("btnGrid4").addEventListener("click", () => {
    if (estado.gridIds) { cerrarGrid4(estado.gridIds.find(Boolean)); return; }
    activarGrid4();
  });

  // ===================================================================
  // Atajos de teclado: Ctrl+T, Ctrl+W y Ctrl+1…9 son atajos del propio
  // NAVEGADOR (nueva pestaña, cerrar pestaña, ir a la pestaña N) y
  // ningún navegador deja que una página web los intercepte con
  // preventDefault(), pase lo que pase en el código -- por eso "no
  // funcionaban": no es un fallo de esta página, es un límite de
  // seguridad del navegador (si no, cualquier web podría cerrar tus
  // pestañas o abrir otras sin que pudieras evitarlo). La única forma de
  // tener atajos de UNA sola tecla que el navegador SÍ deja interceptar
  // es no usar Ctrl/Cmd a secas para ellos, así que aquí se usa Alt (Alt
  // en Windows/Linux, ⌥ Option en Mac), que ningún navegador reserva
  // para nada parecido y por tanto sí se puede sobreponer sin pedir
  // combinaciones raras de varias teclas. Ctrl/⌘ + K (paleta de
  // comandos) SÍ se puede mantener, porque ese combo no está reservado
  // por el navegador.
  // ===================================================================
  window.addEventListener("keydown", (ev) => {
    // Paleta de comandos: Ctrl/Cmd + K (no reservado por el navegador).
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "k" || ev.key === "K")) {
      ev.preventDefault();
      abrirPaleta();
      return;
    }
    // Resto de atajos: Alt + tecla (sin Ctrl/Cmd), para no chocar con
    // los atajos del propio navegador.
    if (!ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (ev.key === "t" || ev.key === "T") {
      ev.preventDefault();
      mostrarBienvenida();
      return;
    }
    if (ev.key === "w" || ev.key === "W") {
      ev.preventDefault();
      const idActual = estado.activaId || (estado.splitIds || [])[0] || (estado.gridIds || []).find(Boolean);
      if (idActual) cerrarPestana(idActual);
      return;
    }
    const numero = parseInt(ev.key, 10);
    if (numero >= 1 && numero <= 9 && estado.pestanas[numero - 1]) {
      ev.preventDefault();
      seleccionarPestana(estado.pestanas[numero - 1].id);
    }
  });

  // Si la ventana cambia de tamaño y se cruza el umbral móvil/escritorio
  // mientras hay un split o grid activo, se re-renderiza para mostrar u
  // ocultar el aviso y el modo "un slot a la vez" en consecuencia.
  let anchoAnterior = window.innerWidth;
  window.addEventListener("resize", () => {
    const eraMovil = anchoAnterior <= 760;
    anchoAnterior = window.innerWidth;
    // También hay que re-renderizar con una sola pestaña activa (sin
    // split ni grid): el CSS de pantalla estrecha oculta con
    // display:none!important CUALQUIER .ws-panel-slot que no lleve la
    // clase ws-slot-movil-activo, así que si no se vuelve a marcar al
    // cruzar el umbral, ese slot único se queda oculto igual que en el
    // bug de split/grid.
    if (eraMovil !== ES_MOVIL() && (estado.splitIds || estado.gridIds || estado.activaId)) render();
  });

  // ---------- Menú de layouts guardados ----------
  const menuLayouts = document.getElementById("menuLayouts");
  function abrirMenuLayouts(){ cerrarMenuAyuda(); menuLayouts.classList.add("abierto"); }
  function cerrarMenuLayouts(){ menuLayouts.classList.remove("abierto"); }
  document.getElementById("btnLayouts").addEventListener("click", (e) => {
    e.stopPropagation();
    if (menuLayouts.classList.contains("abierto")) { cerrarMenuLayouts(); return; }
    renderMenuLayouts();
    abrirMenuLayouts();
  });
  document.addEventListener("click", (e) => {
    if (!menuLayouts.contains(e.target) && e.target.id !== "btnLayouts") cerrarMenuLayouts();
  });

  function cargarLayouts(){
    try { return JSON.parse(localStorage.getItem(CLAVE_LAYOUTS) || "[]"); } catch (e) { return []; }
  }
  function guardarLayouts(lista){
    try { localStorage.setItem(CLAVE_LAYOUTS, JSON.stringify(lista)); } catch (e) {}
  }

  function renderMenuLayouts(){
    menuLayouts.innerHTML = "";
    const guardar = document.createElement("div");
    guardar.className = "ws-menu-item";
    guardar.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Guardar layout actual`;
    guardar.addEventListener("click", async () => {
      if (!estado.pestanas.length) { cerrarMenuLayouts(); mostrarToast("No hay pestañas abiertas que guardar.", "info"); return; }
      cerrarMenuLayouts();
      const { ok, valor } = await mostrarModal({
        titulo: "Guardar layout actual",
        mensaje: `Se guardarán las ${estado.pestanas.length} pestaña(s) abiertas ahora mismo, con su disposición.`,
        input: true, placeholder: 'p. ej. "Redacción diaria"', textoAceptar: "Guardar",
      });
      if (!ok || !valor) return;
      const lista = cargarLayouts();
      lista.push({
        nombre: valor,
        pestanas: estado.pestanas.map(p => ({ seccionId: p.seccionId })),
        splitIndices: estado.splitIds ? estado.splitIds.map(id => estado.pestanas.findIndex(p => p.id === id)) : null,
        orientacion: estado.orientacion,
      });
      guardarLayouts(lista);
      mostrarToast(`Layout "${valor}" guardado.`, "exito");
    });
    menuLayouts.appendChild(guardar);
    menuLayouts.appendChild(Object.assign(document.createElement("div"), { className: "ws-menu-sep" }));

    const lista = cargarLayouts();
    if (!lista.length) {
      const vacio = document.createElement("div");
      vacio.className = "ws-menu-vacio";
      vacio.textContent = "Sin layouts guardados todavía.";
      menuLayouts.appendChild(vacio);
      return;
    }
    const titulo = document.createElement("div");
    titulo.className = "ws-menu-titulo";
    titulo.textContent = "Guardados";
    menuLayouts.appendChild(titulo);
    lista.forEach((layout, idx) => {
      const item = document.createElement("div");
      item.className = "ws-menu-item";
      item.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg>
        <span style="flex:1;">${escapeHtml(layout.nombre)}</span>
        <span data-borrar="${idx}" title="Eliminar" style="color:var(--texto-tenue);cursor:pointer;display:flex;">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </span>`;
      item.addEventListener("click", (ev) => {
        if (ev.target.closest("[data-borrar]")) {
          const l2 = cargarLayouts();
          l2.splice(idx, 1);
          guardarLayouts(l2);
          renderMenuLayouts();
          mostrarToast(`Layout "${layout.nombre}" eliminado.`, "info");
          return;
        }
        aplicarLayout(layout);
        cerrarMenuLayouts();
        mostrarToast(`Layout "${layout.nombre}" aplicado.`, "exito");
      });
      menuLayouts.appendChild(item);
    });
  }

  function aplicarLayout(layout){
    estado.pestanas = [];
    estado.activaId = null;
    estado.splitIds = null;
    estado.gridIds = null;
    estado.orientacion = layout.orientacion || "vertical";
    const idsNuevos = layout.pestanas.map(p => {
      const seccion = seccionPorId(p.seccionId);
      if (!seccion) return null;
      const id = nuevoId();
      estado.pestanas.push({ id, seccionId: seccion.id, titulo: seccion.titulo, subTitulo: null });
      return id;
    });
    if (layout.splitIndices && layout.splitIndices.length === 2 && idsNuevos[layout.splitIndices[0]] && idsNuevos[layout.splitIndices[1]]) {
      estado.splitIds = [idsNuevos[layout.splitIndices[0]], idsNuevos[layout.splitIndices[1]]];
    } else if (idsNuevos.length) {
      estado.activaId = idsNuevos[idsNuevos.length - 1];
    }
    guardarEstado();
    render();
  }

  // ---------- Menú de ayuda (atajos de teclado) ----------
  const menuAyuda = document.getElementById("menuAyuda");
  const ATAJOS = [
    ["Buscar / paleta de comandos", "Ctrl/⌘ + K"],
    ["Nueva pestaña", "Alt + T"],
    ["Cerrar pestaña", "Alt + W"],
    ["Ir a la pestaña 1-9", "Alt + 1…9"],
  ];
  function cerrarMenuAyuda(){ menuAyuda.classList.remove("abierto"); }
  document.getElementById("btnAyuda").addEventListener("click", (e) => {
    e.stopPropagation();
    if (menuAyuda.classList.contains("abierto")) { cerrarMenuAyuda(); return; }
    menuAyuda.innerHTML = `<div class="ws-menu-titulo">Atajos de teclado</div><div class="ws-ayuda-lista">${
      ATAJOS.map(([nombre, atajo]) => `<div class="ws-ayuda-fila"><span>${escapeHtml(nombre)}</span><span>${atajo.split(" + ").map(k => `<span class="ws-kbd" style="color:var(--texto);background:var(--fondo-alt);border-color:var(--borde);">${escapeHtml(k)}</span>`).join("")}</span></div>`).join("")
    }</div>`;
    cerrarMenuLayouts();
    menuAyuda.classList.add("abierto");
  });
  document.addEventListener("click", (e) => {
    if (!menuAyuda.contains(e.target) && e.target.id !== "btnAyuda") cerrarMenuAyuda();
  });
  document.addEventListener("click", (e) => {
    if (!menuContexto.contains(e.target)) cerrarMenuContexto();
  });
  document.addEventListener("scroll", cerrarMenuContexto, true);

  // ===================================================================
  // Paleta de comandos (Ctrl/Cmd + K): forma rápida de abrir cualquier
  // sección o disparar una acción del workspace sin tocar el ratón,
  // igual que la paleta de comandos de un editor de código.
  // ===================================================================
  const overlayPaleta = document.getElementById("overlayPaleta");
  const paletaInput = document.getElementById("paletaInput");
  const paletaLista = document.getElementById("paletaLista");
  const ACCIONES_PALETA = [
    { nombre: "Nueva pestaña", detalle: "Elegir una sección para abrir", cat: "accion", run: () => mostrarBienvenida() },
    { nombre: "Dividir pantalla", detalle: "Con la pestaña activa", cat: "accion", run: () => dividirConSeleccionada() },
    { nombre: "Vista en cuadrícula", detalle: "Hasta 4 pestañas a la vez", cat: "accion", run: () => activarGrid4() },
    { nombre: "Guardar layout actual", detalle: "Para volver a abrirlo más tarde", cat: "accion", run: () => document.getElementById("btnLayouts").click() },
  ];
  let indiceActivoPaleta = 0;
  let itemsPaletaActuales = [];

  function abrirPaleta(){
    cerrarMenuLayouts(); cerrarMenuAyuda();
    overlayPaleta.classList.add("abierto");
    paletaInput.value = "";
    pintarPaleta("");
    setTimeout(() => paletaInput.focus(), 20);
  }
  function cerrarPaleta(){ overlayPaleta.classList.remove("abierto"); }
  document.getElementById("btnPaleta").addEventListener("click", abrirPaleta);
  overlayPaleta.addEventListener("click", (ev) => { if (ev.target === overlayPaleta) cerrarPaleta(); });

  function pintarPaleta(filtro){
    const f = (filtro || "").trim().toLowerCase();
    const secciones = SECCIONES.filter(s => !f || (s.titulo + " " + s.desc).toLowerCase().includes(f))
      .map(s => ({ nombre: s.titulo, detalle: s.desc, cat: "seccion", icono: s.categoria, run: () => abrirPestana(s.id) }));
    const acciones = ACCIONES_PALETA.filter(a => !f || a.nombre.toLowerCase().includes(f));
    itemsPaletaActuales = [...acciones, ...secciones];
    indiceActivoPaleta = 0;

    paletaLista.innerHTML = "";
    if (!itemsPaletaActuales.length) {
      paletaLista.innerHTML = `<div class="ws-paleta-vacio">Sin resultados para “${escapeHtml(filtro)}”.</div>`;
      return;
    }
    let ultimaCat = null;
    itemsPaletaActuales.forEach((item, idx) => {
      if (item.cat !== ultimaCat) {
        ultimaCat = item.cat;
        const tit = document.createElement("div");
        tit.className = "ws-paleta-grupo-tit";
        tit.textContent = item.cat === "accion" ? "Acciones" : "Secciones";
        paletaLista.appendChild(tit);
      }
      const el = document.createElement("div");
      el.className = "ws-paleta-item" + (idx === indiceActivoPaleta ? " activo" : "");
      el.dataset.idx = idx;
      el.innerHTML = `<span class="ws-seccion-icono">${item.cat === "accion"
          ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>'
          : iconoSvg(item.icono, 13)}</span>
        <span class="txt">${escapeHtml(item.nombre)}${item.detalle ? `<small>${escapeHtml(item.detalle)}</small>` : ""}</span>`;
      el.addEventListener("mouseenter", () => marcarActivoPaleta(idx));
      el.addEventListener("click", () => ejecutarItemPaleta(idx));
      paletaLista.appendChild(el);
    });
  }
  function marcarActivoPaleta(idx){
    indiceActivoPaleta = idx;
    paletaLista.querySelectorAll(".ws-paleta-item").forEach(el => el.classList.toggle("activo", Number(el.dataset.idx) === idx));
  }
  function ejecutarItemPaleta(idx){
    const item = itemsPaletaActuales[idx];
    if (!item) return;
    cerrarPaleta();
    item.run();
  }
  paletaInput.addEventListener("input", (ev) => pintarPaleta(ev.target.value));
  paletaInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { ev.preventDefault(); cerrarPaleta(); return; }
    if (ev.key === "ArrowDown") { ev.preventDefault(); marcarActivoPaleta(Math.min(indiceActivoPaleta + 1, itemsPaletaActuales.length - 1)); return; }
    if (ev.key === "ArrowUp") { ev.preventDefault(); marcarActivoPaleta(Math.max(indiceActivoPaleta - 1, 0)); return; }
    if (ev.key === "Enter") { ev.preventDefault(); ejecutarItemPaleta(indiceActivoPaleta); return; }
  });

  // ===================================================================
  // Enlaces heredados de panel.html (marcadores, correos, notificaciones
  // guardadas...) que ahora redirigen aquí conservando su querystring
  // (ver el <script> de redirección en panel.html): si trae "?ir=" o
  // "?ajustes=" se abre esa sección directamente, en vez de la de
  // arranque por defecto, igual que antes hacía panel.html.
  // "?minuto_a_minuto=<id>" no tiene una sección de workspace propia
  // (es una vista de partido en directo, no una pestaña de las de
  // SECCIONES): para ese caso se abre tal cual dentro de "resultados"
  // pasándole el mismo querystring al iframe.
  // ===================================================================
  function abrirDesdeQuerystring(){
    const params = new URLSearchParams(location.search);
    const ir = params.get("ir");
    const ajustes = params.get("ajustes");
    const minutoAMinuto = params.get("minuto_a_minuto");
    if (ir && seccionPorId(ir)) {
      history.replaceState(null, "", location.pathname);
      abrirPestanaPorId(ir);
      return true;
    }
    if (ajustes) {
      history.replaceState(null, "", location.pathname);
      window.abrirPestanaAjustes(ajustes);
      return true;
    }
    if (minutoAMinuto) {
      history.replaceState(null, "", location.pathname);
      const id = abrirPestanaPorId("resultados.listaResultados");
      setTimeout(() => {
        const iframe = document.getElementById("iframe-" + id);
        if (iframe) iframe.src = "panel.html?minuto_a_minuto=" + encodeURIComponent(minutoAMinuto);
      }, 0);
      return true;
    }
    return false;
  }

  // ===================================================================
  // Arranque: un enlace heredado con querystring manda sobre todo lo
  // demás; si no, se recupera la sesión anterior si había pestañas
  // abiertas; y si tampoco hay eso, se abre directamente la sección por
  // defecto según el rol -- la tarea más habitual de cada perfil:
  // redactores y admins entran directos a "Nueva noticia"; fotógrafos
  // entran directos a "Subir contenido", ya que Noticias ni siquiera es
  // una sección pensada para ellos (ver ICONOS_CATEGORIA/SECCIONES más
  // arriba y rol-inicial.js en el panel clásico, que oculta esas
  // pestañas para ese rol). Nada de preguntar qué abrir: siempre hay
  // una pantalla útil desde el primer segundo.
  // ===================================================================
  if (abrirDesdeQuerystring()) {
    // ya se ha abierto la sección pedida por querystring
  } else if (!estado.pestanas.length) {
    const esFotografo = USER && USER.rol === "fotografo";
    abrirPestana(esFotografo ? "contenido.subir" : "noticias.nueva");
  } else {
    render();
  }
})();
</script>
