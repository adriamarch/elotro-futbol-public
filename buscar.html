.busq-aviso{background:var(--fondo-alt);border:1px solid var(--borde);border-left:4px solid var(--rojo);border-radius:var(--radio-sm,6px);padding:.7rem 1rem;margin:0 0 1rem;font-size:.92rem;color:var(--texto);}

.busq-chip small{opacity:.7;margin-left:.25rem;}

.busq-fila input,.busq-fila select{margin-left:.3rem;padding:.3rem .5rem;border:1px solid var(--borde);border-radius:var(--radio-sm,6px);background:var(--tarjeta);color:var(--texto);font:inherit;}

<script>
const TIPOS_BUSQUEDA = {
  noticia: "Noticias", previa: "Previas", cronica: "Crónicas",
  analisis: "Análisis", opinion: "Opinión", entrevista: "Entrevistas", uno_por_uno: "1x1 de jugadores",
};
const POR_PAGINA = 20;
const FILTROS = ["categoria", "tipo", "desde", "hasta", "orden"];
let busqFacetas = null;   // recuentos de la primera página (no cambian al paginar)
let busqIntento = null;   // criterio con el que se resolvió la primera página
let busqOffset = 0;
let busqPeticion = 0;     // identifica la última búsqueda lanzada: las respuestas anteriores se descartan

function parametrosBusqueda() { return new URLSearchParams(location.search); }

// Cambia filtros en la URL (sin recargar) y repite la búsqueda desde cero.
function cambiarFiltros(cambios) {
  const ps = parametrosBusqueda();
  for (const [k, v] of Object.entries(cambios)) { if (v) ps.set(k, v); else ps.delete(k); }
  // Si el rango está al revés ("desde" posterior a "hasta") se le da la vuelta
  // en vez de mostrar una página vacía sin explicación.
  if (ps.get("desde") && ps.get("hasta") && ps.get("desde") > ps.get("hasta")) {
    const d = ps.get("desde"); ps.set("desde", ps.get("hasta")); ps.set("hasta", d);
  }
  // pushState: el botón "Atrás" del navegador deshace el último filtro.
  history.pushState(null, "", location.pathname + "?" + ps.toString());
  cargarResultados(true);
}
window.addEventListener("popstate", () => { if (parametrosBusqueda().get("q")) cargarResultados(true); });

function urlApiBusqueda(primera) {
  const ps = parametrosBusqueda();
  const api = new URLSearchParams({ q: ps.get("q") || "", limit: String(POR_PAGINA) });
  for (const k of FILTROS) if (ps.get(k)) api.set(k, ps.get(k));
  if (ps.get("exacto") === "1") api.set("exacto", "1");
  if (primera) api.set("facetas", "1");
  else { api.set("offset", String(busqOffset)); if (busqIntento !== null) api.set("intento", String(busqIntento)); }
  return `/api/articles?${api.toString()}`;
}

function pintarFiltros(hayFiltrosActivos) {
  const ps = parametrosBusqueda();
  const form = document.getElementById("filtrosBusqueda");
  const chips = (id, clave, etiquetas, conteos) => {
    const el = document.getElementById(id);
    const actual = ps.get(clave) || "";
    const claves = Object.keys(conteos || {}).filter((c) => conteos[c] > 0).sort((a, b) => conteos[b] - conteos[a]);
    if (!claves.length && !actual) { el.innerHTML = ""; return; }
    const total = claves.reduce((n, c) => n + conteos[c], 0);
    const boton = (valor, texto, n) =>
      `<button type="button" class="busq-chip" data-k="${clave}" data-v="${escapeHtml(valor)}" aria-pressed="${actual === valor}">${escapeHtml(texto)}${n != null ? `<small>${n}</small>` : ""}</button>`;
    el.innerHTML = boton("", "Todas", total || null) + claves.map((c) => boton(c, etiquetas(c), conteos[c])).join("");
  };
  chips("chipsCategoria", "categoria", (c) => categoriaLabel(c), busqFacetas && busqFacetas.categorias);
  chips("chipsTipo", "tipo", (t) => TIPOS_BUSQUEDA[t] || t, busqFacetas && busqFacetas.tipos);
  document.getElementById("fDesde").value = ps.get("desde") || "";
  document.getElementById("fHasta").value = ps.get("hasta") || "";
  document.getElementById("fOrden").value = ps.get("orden") === "fecha" ? "fecha" : "relevancia";
  document.getElementById("fLimpiar").hidden = !hayFiltrosActivos;
  form.hidden = false;
}

function pintarAviso(info, q) {
  const el = document.getElementById("avisoBusqueda");
  const ps = parametrosBusqueda();
  const partes = [];
  if (info && info.corregido) {
    ps.set("exacto", "1");
    partes.push(`Mostrando resultados para <strong>${escapeHtml(info.corregido)}</strong>. <a href="?${escapeHtml(ps.toString())}">Buscar "${escapeHtml(q)}" tal cual</a>`);
  }
  if (info && info.modo === "or") {
    partes.push("Ninguna noticia contiene todas las palabras: se muestran las que contienen alguna de ellas.");
  }
  el.innerHTML = partes.join("<br>");
  el.hidden = !partes.length;
}

function tarjetaResultado(a) {
  const html = cardHTML(a);
  if (!a.extracto_html) return html;
  // extracto_html ya viene escapado por el servidor (solo contiene <mark>).
  return html.replace(/<\/div>\s*<\/a>\s*$/, `<p class="busq-extracto">${a.extracto_html}</p></div></a>`);
}

async function cargarResultados(primera) {
  const q = parametrosBusqueda().get("q") || "";
  const grid = document.getElementById("grid");
  const mas = document.getElementById("busqMas");
  const hayFiltros = FILTROS.some((k) => k !== "orden" && parametrosBusqueda().get(k));
  if (primera) {
    busqOffset = 0; busqIntento = null;
    mas.hidden = true;
    grid.innerHTML = spinnerHTML("Buscando...");
  }
  const boton = document.getElementById("btnMas");
  boton.disabled = true;
  const miPeticion = ++busqPeticion;
  try {
    const data = await conReintento(async () => (await apiFetch(urlApiBusqueda(primera))).json());
    if (miPeticion !== busqPeticion) return;   // llegó tarde: ya hay otra búsqueda en curso
    const articles = data.articles || [];
    const info = data.busqueda || null;
    if (primera) {
      busqFacetas = (info && info.facetas) || busqFacetas;
      busqIntento = info ? info.intento : null;
      pintarAviso(info, q);
      pintarFiltros(hayFiltros);
      grid.innerHTML = articles.length
        ? articles.map(tarjetaResultado).join("")
        : estadoHTML({
            titulo: "Sin resultados",
            texto: hayFiltros
              ? `No hay resultados para "${q}" con esos filtros.`
              : `No hemos encontrado ninguna noticia relacionada con "${q}". Prueba con otra palabra o menos palabras, revisa la ortografía, o usa comillas para una frase exacta ("real madrid") y un guion para excluir una palabra (-fichaje).`,
            tipo: "busqueda",
            cta: hayFiltros
              ? `<a href="#" class="btn-volver" id="ctaQuitarFiltros">Quitar filtros</a>`
              : `<a href="/" class="btn-volver">Ir a portada</a>`,
          });
      if (articles.length) insertarAdsEnGrid(grid);
    } else {
      grid.insertAdjacentHTML("beforeend", articles.map(tarjetaResultado).join(""));
    }
    busqOffset += articles.length;
    mas.hidden = !data.hay_mas;
  } catch (err) {
    if (miPeticion !== busqPeticion) return;
    if (primera) {
      grid.innerHTML = estadoHTML({
        titulo: "No se ha podido conectar",
        texto: "Ha habido un problema al realizar la búsqueda. Comprueba tu conexión e inténtalo de nuevo.",
        tipo: "error",
        cta: `<a href="javascript:location.reload()" class="btn-volver">Reintentar</a>`,
      });
    }
  } finally {
    if (miPeticion === busqPeticion) boton.disabled = false;
  }
}

function enlazarFiltros() {
  const quitarTodo = (e) => {
    e.preventDefault();
    const sinFiltros = {}; for (const k of FILTROS) sinFiltros[k] = "";
    cambiarFiltros(sinFiltros);
  };
  document.getElementById("filtrosBusqueda").addEventListener("click", (e) => {
    const chip = e.target.closest(".busq-chip");
    if (chip) cambiarFiltros({ [chip.dataset.k]: chip.dataset.v });
  });
  document.getElementById("filtrosBusqueda").addEventListener("submit", (e) => e.preventDefault());
  document.getElementById("fDesde").addEventListener("change", (e) => cambiarFiltros({ desde: e.target.value }));
  document.getElementById("fHasta").addEventListener("change", (e) => cambiarFiltros({ hasta: e.target.value }));
  document.getElementById("fOrden").addEventListener("change", (e) => cambiarFiltros({ orden: e.target.value === "fecha" ? "fecha" : "" }));
  document.getElementById("fLimpiar").addEventListener("click", quitarTodo);
  document.getElementById("grid").addEventListener("click", (e) => { if (e.target.id === "ctaQuitarFiltros") quitarTodo(e); });
  document.getElementById("btnMas").addEventListener("click", () => cargarResultados(false));
}

async function buscar() {
  const q = parametrosBusqueda().get("q") || "";

  // Si lo buscado coincide con el nombre de uno o varios equipos: con
  // UN solo club encontrado, se redirige directamente a su ficha (igual
  // que hacía antes) para no hacer perder un paso a quien claramente
  // busca ese equipo en concreto. Con VARIOS clubes encontrados (p.ej.
  // buscar "nas" encuentra "Arenas Club" y otros que contengan esas
  // letras) ya no se puede elegir uno a ciegas: se listan todos como
  // accesos directos por encima de los resultados de artículos, para
  // que la persona escoja el que buscaba en vez de quedarse solo con
  // el primero que encontrara internamente la búsqueda. Se esperan los
  // clubes personalizados antes de comprobarlo, para que también
  // funcione con clubes añadidos a mano ("Otro equipo").
  // No se redirige si la persona pidió expresamente ver los resultados
  // ("Ver todos los resultados", todos=1), buscó "tal cual" (exacto=1) o ya
  // aplicó filtros: en esos casos quiere artículos, no la ficha. El club
  // aparece entonces como acceso directo encima de los resultados.
  const ps0 = parametrosBusqueda();
  const quiereResultados = ps0.get("todos") === "1" || ps0.get("exacto") === "1" || FILTROS.some((k) => ps0.get(k));
  let clubesEncontrados = [];
  if (q.trim()) {
    await cargarCustomClubs();
    clubesEncontrados = (typeof buscarClubesPorTexto === "function") ? buscarClubesPorTexto(q) : [];
    if (clubesEncontrados.length === 1 && !quiereResultados) {
      const club = clubesEncontrados[0];
      location.replace(`categoria.html?cat=${encodeURIComponent(club.categoria)}&club=${encodeURIComponent(club.nombre)}`);
      return;
    }
  }

  document.getElementById("tituloBusqueda").textContent = q ? `Resultados para: "${q}"` : "Buscar noticias";
  fijarSeoBasico({
    titulo: (q ? `Resultados para: "${q}"` : "Buscar noticias") + " — ELOTROFÚTBOLTV",
    urlPath: location.pathname + location.search,
    noindex: true,
  });
  const grid = document.getElementById("grid");

  // Si hubo varios clubes coincidentes (con uno solo ya se habría
  // redirigido más arriba), se listan aquí como accesos directos antes
  // de los resultados de artículos.
  const clubesEl = document.getElementById("clubesBusqueda");
  if (clubesEncontrados.length >= 1) {
    clubesEl.innerHTML = `
      <h3 class="section-subtitle">${clubesEncontrados.length === 1 ? "Equipo" : "Equipos"} que coinciden con "${escapeHtml(q)}"</h3>
      <div class="grid-clubes-busqueda">
        ${clubesEncontrados.map(club => `
          <a class="search-item search-item-club" href="/categoria?cat=${encodeURIComponent(club.categoria)}&club=${encodeURIComponent(club.nombre)}">
            <span class="search-item-cat">Ficha del equipo</span>
            <span class="search-item-titulo">${escapeHtml(club.nombre)}</span>
          </a>`).join("")}
      </div>`;
  }

  if (!q.trim()) {
    grid.innerHTML = estadoHTML({
      titulo: "Escribe algo para buscar",
      texto: "Usa el buscador de la cabecera para encontrar noticias, previas, crónicas y entrevistas por título o contenido.",
      tipo: "busqueda",
    });
    return;
  }

  enlazarFiltros();
  await cargarResultados(true);
}
document.addEventListener("DOMContentLoaded", buscar);
</script>
