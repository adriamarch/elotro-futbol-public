<!DOCTYPE html>
<html lang="es">
<head>
<!-- <base href="/"> tiene que ir aquí, antes que cualquier recurso con
     ruta relativa (incluido el <script> de justo debajo). Es necesario
     porque public/_worker.js sirve este mismo archivo bajo la URL
     bonita /galeria/{slug} (un nivel bajo la raíz): sin esto,
     "js/tema.js", "css/style.css", etc. se resolverían contra
     /galeria/ en vez de contra la raíz del sitio, y todo el CSS/JS de
     la página daría 404 (mismo problema ya resuelto así en
     noticia.html, que se sirve igual bajo /futbol/categoria/slug). Con
     <base href="/"> toda ruta relativa de esta página se resuelve
     siempre contra la raíz, se sirva la página desde donde se sirva. -->
<base href="/">
<script src="js/tema.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Galería de contenido — ELOTROFÚTBOLTV</title>
<meta name="description" content="Fotos del partido, organizadas por equipo.">
<link rel="canonical" id="canonicalGaleria" href="https://elotrofutbol.media/galeria.html">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/x-icon" href="/img/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="dns-prefetch" href="https://res.cloudinary.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=17">
<style>
  /* ---------- GALERÍA DE CONTENIDO (PARTIDO) ----------
     Cabecera tipo marcador de retransmisión (fondo marino de marca,
     escudos, marcador en Oswald) para reconocer de qué partido es la
     galería, y debajo, un muro de fotos a todo el ancho de la
     pantalla (estilo Pixieset/Flickr) con pestañas por equipo,
     miniaturas grandes en masonry, y overlay de acciones rápidas
     (descargar/compartir). Igual lenguaje visual que galerias.html
     (la mediateca general). */

  body[data-page="galeria"]{background:var(--fondo-alt);}
  body[data-page="galeria"] main{margin:0 auto;}

  .gal-cabecera{
    background:linear-gradient(160deg, var(--marino) 0%, var(--marino2) 100%);
    color:#fff;padding:20px 0 26px;position:relative;overflow:hidden;
    box-shadow:0 6px 22px rgba(12,27,46,.22);
  }
  .gal-cabecera::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(circle at 15% 20%, #fff 0, transparent 45%),
      radial-gradient(circle at 85% 80%, #fff 0, transparent 45%);
  }
  .gal-cabecera-inner{max-width:900px;margin:0 auto;padding:0 20px;position:relative;}
  .gal-breadcrumb{
    display:flex;align-items:center;gap:6px;font-size:.72rem;
    color:var(--celeste-claro);text-decoration:none;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;margin-bottom:18px;width:fit-content;
    transition:gap .15s ease;
  }
  .gal-breadcrumb:hover{color:#fff;gap:9px;}
  .gal-breadcrumb svg{width:13px;height:13px;transform:rotate(180deg);flex-shrink:0;}

  .gal-marcador-fila{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
  .gal-equipo{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0;}
  .gal-escudo{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
  .gal-nombre{
    font-family:var(--font-tit);font-weight:600;font-size:.85rem;text-align:center;
    line-height:1.2;letter-spacing:.01em;max-width:140px;
  }
  .gal-centro{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px;}
  .gal-marcador{
    font-family:var(--font-tit);font-size:2.1rem;font-weight:700;line-height:1;
    letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .gal-marcador small{font-size:.62rem;font-weight:500;color:var(--celeste-claro);letter-spacing:.02em;}
  .gal-meta{
    font-size:.68rem;font-weight:600;letter-spacing:.04em;color:var(--celeste-claro);
    text-align:center;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .gal-meta-punto{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0;}
  .gal-titulo-pagina{
    font-family:var(--font-tit);font-size:1.05rem;font-weight:600;margin:18px 0 0;
    text-align:center;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .gal-titulo-pagina svg{width:18px;height:18px;color:var(--celeste-claro);flex-shrink:0;}

  /* ---------- Barra de pestañas, pegajosa como en galerias.html ---------- */
  .gal-barra{
    position:sticky;top:0;z-index:20;background:var(--tarjeta);
    border-bottom:1px solid var(--borde);box-shadow:0 2px 10px rgba(12,27,46,.05);
    transition:background .2s ease,border-color .2s ease;
  }
  [data-theme="dark"] .gal-barra{box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .gal-barra-inner{
    max-width:1600px;margin:0 auto;padding:10px 24px;
    display:flex;justify-content:center;
  }
  .gal-pestanas{
    display:flex;gap:4px;flex-wrap:wrap;justify-content:center;
    background:var(--fondo-alt);padding:4px;border-radius:12px;border:1px solid var(--borde);
    width:fit-content;margin:0 auto;
  }
  .gal-pestana{
    appearance:none;border:none;background:transparent;cursor:pointer;
    padding:8px 15px;font-family:var(--font-text);font-weight:600;font-size:.82rem;
    color:var(--texto-suave);border-radius:9px;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:color .15s ease,background .15s ease;
  }
  .gal-pestana:hover{color:var(--marino-texto);background:var(--tarjeta);}
  .gal-pestana.activa{color:#fff;background:linear-gradient(135deg, var(--marino), var(--marino2));box-shadow:0 3px 10px rgba(12,27,46,.28);}
  .gal-pestana .gal-pestana-escudo{width:17px;height:17px;object-fit:contain;flex-shrink:0;}
  .gal-pestana .gal-contador{
    background:var(--gris-claro);color:var(--texto-suave);font-size:.7rem;font-weight:700;
    border-radius:999px;padding:2px 8px;min-width:20px;text-align:center;
  }
  .gal-pestana.activa .gal-contador{background:rgba(255,255,255,.22);color:#fff;}

  /* ---------- Lienzo a todo el ancho, mosaico tipo Pinterest ---------- */
  .gal-wrap{width:100%;max-width:1900px;margin:0 auto;padding:0 18px 70px;box-sizing:border-box;}

  /* Cuadrícula de columnas exactas (repeat(N,1fr)): cada fila ocupa
     todo el ancho disponible, sin huecos a la derecha. Cada celda tiene
     proporción fija (aspect-ratio) y la foto la rellena con object-fit:cover,
     así las miniaturas perezosas ya tienen altura antes de cargar. */
  .gal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
  .gal-item{
    position:relative;overflow:hidden;cursor:pointer;background:var(--gris-claro);
    border-radius:14px;box-shadow:0 1px 4px rgba(12,27,46,.10);
    display:block;margin:0;aspect-ratio:4/5;min-width:0;
    animation:apareceGalItem .4s ease both;
    transition:box-shadow .2s ease,transform .2s ease;
  }
  @keyframes apareceGalItem{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .gal-item:hover{z-index:3;box-shadow:0 14px 34px rgba(12,27,46,.24);transform:translateY(-2px);}
  [data-theme="dark"] .gal-item{box-shadow:0 1px 4px rgba(0,0,0,.35);}
  [data-theme="dark"] .gal-item:hover{box-shadow:0 14px 34px rgba(0,0,0,.55);}
  .gal-item img, .gal-item video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .35s ease;
    background:var(--gris-claro);
  }
  .gal-item:hover img, .gal-item:hover video{transform:scale(1.035);}
  .gal-item img{filter:blur(0);}
  .gal-item img.cargando{filter:blur(14px);transform:scale(1.04);}
  .gal-item::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:46%;
    background:linear-gradient(to top, rgba(6,16,28,.72), rgba(6,16,28,0));
    pointer-events:none;opacity:0;transition:opacity .2s ease;
  }
  .gal-item:hover::after{opacity:1;}
  .gal-item .gal-badge-tipo{
    position:absolute;top:9px;left:9px;z-index:2;width:26px;height:26px;border-radius:50%;
    background:rgba(6,16,28,.55);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
  }
  .gal-item .gal-badge-tipo svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;}
  .gal-item .gal-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
    width:50px;height:50px;border-radius:50%;background:rgba(6,16,28,.42);
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(4px);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:background .2s ease, transform .2s ease, border-color .2s ease;
  }
  .gal-item:hover .gal-play{background:var(--rojo);border-color:var(--rojo);transform:translate(-50%,-50%) scale(1.1);}
  .gal-item .gal-play svg{width:18px;height:18px;fill:#fff;margin-left:2px;}

  .gal-item-overlay{
    position:absolute;left:0;right:0;bottom:0;padding:10px 10px 9px;z-index:2;
    display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
    opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease;
  }
  .gal-item:hover .gal-item-overlay{opacity:1;transform:translateY(0);}
  .gal-item-credito{
    color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.01em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .gal-item-acciones{display:flex;gap:6px;flex-shrink:0;}
  .gal-item-accion{
    appearance:none;border:1px solid rgba(255,255,255,.3);background:rgba(6,16,28,.55);
    backdrop-filter:blur(3px);color:#fff;border-radius:8px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease,transform .15s ease,border-color .15s ease;
  }
  .gal-item-accion svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;}
  .gal-item-accion:hover{background:var(--celeste);border-color:var(--celeste);transform:translateY(-1px);}
  .gal-item-accion.ok{background:#1f9d55;border-color:#1f9d55;}

  .gal-vacio{
    text-align:center;color:var(--texto-suave);padding:80px 20px;font-size:.92rem;
    background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;
  }
  .gal-vacio svg{width:44px;height:44px;color:var(--borde);margin-bottom:14px;}
  [data-theme="dark"] .gal-vacio svg{color:var(--borde);}

  /* Skeleton de carga: siluetas animadas en vez de un simple texto, para
     que la página no parezca "vacía" el instante antes de recibir los
     datos de la API. */
  .gal-skeleton-cabecera{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .gal-skel{background:rgba(255,255,255,.14);border-radius:10px;position:relative;overflow:hidden;}
  .gal-skel::after{
    content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    animation:galSkelBrillo 1.4s ease-in-out infinite;
  }
  @keyframes galSkelBrillo{100%{transform:translateX(100%);}}
  .gal-grid-skeleton{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
  .gal-grid-skeleton .gal-skel{background:var(--gris-claro);border-radius:14px;
    width:100%;aspect-ratio:4/5;margin:0;}
  .gal-grid-skeleton .gal-skel::after{background:linear-gradient(90deg, transparent, rgba(0,0,0,.05), transparent);}
  [data-theme="dark"] .gal-grid-skeleton .gal-skel::after{background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);}

  /* ---------- Lightbox grande, estilo visor profesional ---------- */
  .gal-lightbox{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(4,9,16,.97);padding:0;backdrop-filter:blur(6px);
  }
  .gal-lightbox.abierto{display:flex;animation:galLightboxFade .18s ease both;}
  @keyframes galLightboxFade{from{opacity:0;}to{opacity:1;}}
  .gal-lightbox-media{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:70px 90px 100px;box-sizing:border-box;}
  .gal-lightbox-media img, .gal-lightbox-media video{
    max-width:100%;max-height:100%;border-radius:6px;object-fit:contain;
    box-shadow:0 20px 70px rgba(0,0,0,.6);animation:galLightboxMediaIn .22s ease both;
  }
  @keyframes galLightboxMediaIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .gal-lightbox-info{
    position:absolute;left:0;right:0;bottom:0;padding:18px 90px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:linear-gradient(to top, rgba(4,9,16,.85), transparent);
  }
  .gal-lightbox-texto{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .gal-lightbox-credito{color:#fff;font-size:.86rem;font-weight:600;}
  .gal-lightbox-contador{color:#8a96a8;font-size:.72rem;font-weight:600;letter-spacing:.03em;}
  .gal-lightbox-acciones{display:flex;gap:8px;flex-shrink:0;}
  .gal-lightbox-boton{
    appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);
    color:#fff;border-radius:10px;padding:9px 16px;display:flex;align-items:center;gap:7px;
    font-family:var(--font-text);font-weight:600;font-size:.78rem;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .gal-lightbox-boton svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
  .gal-lightbox-boton:hover{background:var(--celeste);border-color:var(--celeste);transform:translateY(-1px);}
  .gal-lightbox-boton.ok{background:#1f9d55;border-color:#1f9d55;}

  .gal-lightbox-cerrar, .gal-lightbox-nav{
    position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:background .15s ease,transform .15s ease,border-color .15s ease;
    z-index:3;
  }
  .gal-lightbox-cerrar:hover, .gal-lightbox-nav:hover{background:var(--celeste);border-color:var(--celeste);transform:scale(1.06);}
  .gal-lightbox-cerrar{top:20px;right:20px;}
  .gal-lightbox-nav svg, .gal-lightbox-cerrar svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
  .gal-lightbox-prev{left:18px;top:50%;transform:translateY(-50%);}
  .gal-lightbox-next{right:18px;top:50%;transform:translateY(-50%);}
  .gal-lightbox-prev:hover, .gal-lightbox-next:hover{transform:translateY(-50%) scale(1.06);}

  @media (max-width:1300px){
    .gal-grid, .gal-grid-skeleton{grid-template-columns:repeat(4,minmax(0,1fr));}
  }
  @media (max-width:900px){
    .gal-grid, .gal-grid-skeleton{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
    .gal-item{border-radius:11px;}
    .gal-lightbox-media{padding:56px 16px 96px;}
    .gal-lightbox-info{padding:14px 16px 18px;}
  }
  @media (max-width:640px){
    .gal-pestana{padding:8px 10px;font-size:.78rem;}
    .gal-barra-inner{padding:10px 12px;}
    .gal-grid, .gal-grid-skeleton{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .gal-item{border-radius:9px;}
  }
  @media (max-width:520px){
    .gal-marcador{font-size:1.7rem;}
    .gal-escudo{width:44px;height:44px;}
    .gal-nombre{font-size:.76rem;max-width:100px;}
    .gal-lightbox-nav{width:38px;height:38px;}
    .gal-lightbox-cerrar{width:38px;height:38px;top:12px;right:12px;}
    .gal-lightbox-prev{left:8px;}
    .gal-lightbox-next{right:8px;}
    .gal-lightbox-info{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body data-page="galeria">

<div id="site-header"></div>

<header class="gal-cabecera">
  <div class="gal-cabecera-inner">
    <a href="galerias.html" class="gal-breadcrumb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>

    </a>
    <div id="galCabeceraDatos">

</header>

<div class="gal-barra" id="galBarra" hidden>
  <div class="gal-barra-inner">
    <div class="gal-pestanas" id="galPestanas"></div>
  </div>
</div>

<main class="gal-wrap">

</main>

<script>
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const slugGaleria = new URLSearchParams(location.search).get("slug") || location.pathname.split("/galeria/")[1];
const GAL_ANCHO_THUMB = 420;

let GRUPOS_GALERIA = {};
let ORDEN_PESTANAS = [];
let PESTANA_ACTIVA = null;
let LIGHTBOX_INDICE = -1;
let GAL_IO = null;
let GAL_PARTIDO = null;

function esquelasGal(n) {
  return Array.from({ length: n }, () => `<div class="gal-skel"></div>`).join("");
}
document.getElementById("galSkeleton").innerHTML = esquelasGal(24);

function marcadorTexto(p) {
  if (p.estado === "programado") return "vs";
  const local = p.goles_local ?? "-";
  const visitante = p.goles_visitante ?? "-";
  let texto = `${local} - ${visitante}`;
  if (p.penaltis_local !== null && p.penaltis_local !== undefined) {
    texto += ` <small>(${p.penaltis_local}-${p.penaltis_visitante} p.)</small>`;
  }
  return texto;
}

async function cargaGaleria() {
  const cont = document.getElementById("galContenido");
  if (!slugGaleria) {
    cont.innerHTML = estadoVacioHTML("Galería no encontrada", "El enlace no parece válido.");
    return;
  }
  try {
    const res = await apiFetch(`/api/results/galeria/${encodeURIComponent(slugGaleria)}`);
    if (!res.ok) {
      cont.innerHTML = estadoVacioHTML("Galería no encontrada", "Puede que el enlace sea antiguo o que la galería ya no exista.");
      return;
    }
    const { partido, grupos } = await res.json();
    GAL_PARTIDO = partido;
    GRUPOS_GALERIA = grupos || {};
    pintarCabecera(partido);
    pintarPestanas();
  } catch (err) {
    cont.innerHTML = estadoVacioHTML("No se ha podido cargar", "Ha habido un problema de conexión. Inténtalo de nuevo.");
  }
}

function pintarCabecera(p) {
  const cont = document.getElementById("galCabeceraDatos");
  const urlLocal = getEscudoUrl(p.equipo_local, p.escudo_local_url);
  const urlVisitante = getEscudoUrl(p.equipo_visitante, p.escudo_visitante_url);
  const meta = [
    p.jornada ? "Jornada " + p.jornada : null,
    p.fecha_partido ? new Date(p.fecha_partido).toLocaleDateString("es-ES", { day: "2-digit", month: "long", year: "numeric" }) : null,
  ].filter(Boolean);

  cont.innerHTML = `
    <div class="gal-marcador-fila">
      <div class="gal-equipo">
        <img class="gal-escudo" data-equipo="${escapeHtml(p.equipo_local || "")}" src="${urlLocal}" alt="" loading="lazy" onerror="manejarErrorEscudo(this);">
        <span class="gal-nombre">${escapeHtml(p.equipo_local || "")}</span>
      </div>
      <div class="gal-centro">
        <span class="gal-marcador">${marcadorTexto(p)}</span>
      </div>
      <div class="gal-equipo">
        <img class="gal-escudo" data-equipo="${escapeHtml(p.equipo_visitante || "")}" src="${urlVisitante}" alt="" loading="lazy" onerror="manejarErrorEscudo(this);">
        <span class="gal-nombre">${escapeHtml(p.equipo_visitante || "")}</span>
      </div>
    </div>
    ${meta.length ? `<p class="gal-meta">${meta.map(escapeHtml).join('<span class="gal-meta-punto"></span>')}</p>` : ""}
    <p class="gal-titulo-pagina">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L15 16"/><path d="m13.5 14.5 1-1a2 2 0 0 1 2.8 0L20 16.5"/></svg>
      Galería de contenido
    </p>`;

  const titulo = `Galería de contenido: ${p.equipo_local} ${p.goles_local ?? ""}-${p.goles_visitante ?? ""} ${p.equipo_visitante} — ELOTROFÚTBOLTV`;
  document.getElementById("pageTitle").textContent = titulo;
  document.getElementById("canonicalGaleria").href = `https://elotrofutbol.media/galeria/${p.slug}`;
  if (typeof fijarSeoBasico === "function") {
    fijarSeoBasico({
      titulo,
      descripcion: `Fotos del partido ${p.equipo_local} vs ${p.equipo_visitante}.`,
      urlPath: `/galeria/${p.slug}`,
    });
  }
}

function pintarPestanas() {
  const cont = document.getElementById("galContenido");
  const barra = document.getElementById("galBarra");
  ORDEN_PESTANAS = ["local", "visitante", "general"].filter((k) => GRUPOS_GALERIA[k]);

  if (!ORDEN_PESTANAS.length) {
    barra.hidden = true;
    cont.innerHTML = estadoVacioHTML("Todavía no hay fotos", "Vuelve más tarde: puede que la galería se publique después del partido.");
    return;
  }

  PESTANA_ACTIVA = ORDEN_PESTANAS[0];

  // Si solo hay un grupo, se muestran las fotos directamente, sin
  // pestañas (sin sub-agrupación real no tiene sentido mostrar una
  // única pestaña).
  const necesitaPestanas = ORDEN_PESTANAS.length > 1;
  barra.hidden = !necesitaPestanas;

  cont.innerHTML = `<div class="gal-grid" id="galGrid"></div>`;

  if (necesitaPestanas) pintarBarraPestanas();
  pintarGrid();
}

function pintarBarraPestanas() {
  const barra = document.getElementById("galPestanas");
  if (!barra) return;
  barra.innerHTML = ORDEN_PESTANAS.map((clave) => {
    const grupo = GRUPOS_GALERIA[clave];
    const escudo = clave !== "general" ? getEscudoUrl(grupo.nombre) : null;
    return `
      <button type="button" class="gal-pestana${clave === PESTANA_ACTIVA ? " activa" : ""}" data-clave="${clave}">
        ${escudo ? `<img class="gal-pestana-escudo" src="${escudo}" alt="" onerror="this.remove();">` : ""}
        ${escapeHtml(grupo.nombre)}
        <span class="gal-contador">${grupo.fotos.length}</span>
      </button>`;
  }).join("");
  barra.querySelectorAll(".gal-pestana").forEach((btn) => {
    btn.addEventListener("click", () => cambiarPestana(btn.dataset.clave));
  });
}

function cambiarPestana(clave) {
  PESTANA_ACTIVA = clave;
  pintarBarraPestanas();
  pintarGrid();
}

function pintarGrid() {
  const grid = document.getElementById("galGrid");
  if (!grid) return;
  const fotos = GRUPOS_GALERIA[PESTANA_ACTIVA]?.fotos || [];
  const iconoFoto = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L15 16"/><path d="m13.5 14.5 1-1a2 2 0 0 1 2.8 0L20 16.5"/></svg>`;
  const iconoVideo = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="14" height="12" rx="2"/><path d="m16.5 10.5 5-3v9l-5-3Z"/></svg>`;
  const iconoDescargar = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`;
  const iconoCompartir = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>`;

  if (!fotos.length) {
    grid.outerHTML = estadoVacioHTML("Todavía no hay fotos en esta pestaña", "Prueba a mirar en otra pestaña del partido.");
    return;
  }

  grid.innerHTML = fotos.map((f, i) => {
    const esFoto = f.tipo === "foto";
    const thumb = esFoto ? cloudinaryOptimizada(f.cloudinary_url, GAL_ANCHO_THUMB) : "";
    return `
      <div class="gal-item" data-indice="${i}">
        <span class="gal-badge-tipo">${esFoto ? iconoFoto : iconoVideo}</span>
        ${esFoto
          ? `<img data-src="${thumb}" alt="${escapeHtml(f.titulo || "")}" class="cargando" decoding="async">`
          : `<video src="${f.cloudinary_url}#t=0.1" preload="metadata" muted playsinline></video><div class="gal-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`}
        <div class="gal-item-overlay">
          <span class="gal-item-credito">${f.autor_nombre ? "© " + escapeHtml(f.autor_nombre) : (f.titulo ? escapeHtml(f.titulo) : "")}</span>
          <span class="gal-item-acciones">
            <button type="button" class="gal-item-accion" title="Descargar" data-accion="descargar" data-indice="${i}">${iconoDescargar}</button>
            <button type="button" class="gal-item-accion" title="Compartir" data-accion="compartir" data-indice="${i}">${iconoCompartir}</button>
          </span>
        </div>
      </div>`;
  }).join("");

  grid.onclick = (e) => {
    const btnAccion = e.target.closest(".gal-item-accion");
    if (btnAccion) {
      e.stopPropagation();
      const idx = Number(btnAccion.dataset.indice);
      if (btnAccion.dataset.accion === "descargar") descargarMedia(idx);
      if (btnAccion.dataset.accion === "compartir") compartirMedia(idx, btnAccion);
      return;
    }
    const item = e.target.closest(".gal-item");
    if (item) abrirLightbox(Number(item.dataset.indice));
  };

  activarCargaPerezosaGal();
}

function activarCargaPerezosaGal() {
  if (GAL_IO) GAL_IO.disconnect();
  const imgs = document.querySelectorAll("#galGrid img[data-src]");
  GAL_IO = new IntersectionObserver((entradas) => {
    entradas.forEach((entrada) => {
      if (!entrada.isIntersecting) return;
      const img = entrada.target;
      const src = img.dataset.src;
      if (!src) return;
      img.src = src;
      img.loading = "lazy";
      img.addEventListener("load", () => img.classList.remove("cargando"), { once: true });
      img.removeAttribute("data-src");
      GAL_IO.unobserve(img);
    });
  }, { rootMargin: "600px 0px" });
  imgs.forEach((img) => GAL_IO.observe(img));
}

function urlDescargaGal(url) {
  if (!url || typeof url !== "string") return url;
  const marca = "/upload/";
  const i = url.indexOf(marca);
  if (i === -1) return url;
  return url.slice(0, i + marca.length) + "fl_attachment/" + url.slice(i + marca.length);
}

function descargarMedia(indice) {
  const fotos = GRUPOS_GALERIA[PESTANA_ACTIVA]?.fotos || [];
  const f = fotos[indice];
  if (!f) return;
  const a = document.createElement("a");
  a.href = urlDescargaGal(f.cloudinary_url);
  a.download = (f.titulo || "elotrofutbol-foto").replace(/[^a-z0-9-_]+/gi, "-");
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function compartirMedia(indice, boton) {
  const fotos = GRUPOS_GALERIA[PESTANA_ACTIVA]?.fotos || [];
  const f = fotos[indice];
  if (!f) return;
  const url = location.href.split("?")[0];
  const titulo = GAL_PARTIDO ? `${GAL_PARTIDO.equipo_local} vs ${GAL_PARTIDO.equipo_visitante}` : "ELOTROFÚTBOLTV";
  const datos = { title: titulo, text: f.titulo || `Fotos de ${titulo} en ELOTROFÚTBOLTV`, url };
  try {
    if (navigator.share) {
      await navigator.share(datos);
      return;
    }
    await navigator.clipboard.writeText(url);
    marcarAccionOkGal(boton);
  } catch (err) {
    if (err && err.name === "AbortError") return;
    try { await navigator.clipboard.writeText(url); marcarAccionOkGal(boton); } catch (e2) { /* silencioso */ }
  }
}

function marcarAccionOkGal(boton) {
  if (!boton) return;
  boton.classList.add("ok");
  const original = boton.innerHTML;
  boton.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  setTimeout(() => { boton.classList.remove("ok"); boton.innerHTML = original; }, 1400);
}

function estadoVacioHTML(titulo, texto) {
  return `<div class="gal-vacio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L15 16"/><path d="m13.5 14.5 1-1a2 2 0 0 1 2.8 0L20 16.5"/></svg>
    <strong style="display:block;margin-bottom:6px;color:var(--marino-texto);">${escapeHtml(titulo)}</strong>${escapeHtml(texto)}</div>`;
}

function abrirLightbox(indice) {
  LIGHTBOX_INDICE = indice;
  pintarLightbox();
  document.getElementById("galLightbox").classList.add("abierto");
  document.body.style.overflow = "hidden";
}

function cerrarLightbox() {
  document.getElementById("galLightbox").classList.remove("abierto");
  document.body.style.overflow = "";
  document.getElementById("galLightboxMedia").innerHTML = "";
}

function moverLightbox(delta) {
  const fotos = GRUPOS_GALERIA[PESTANA_ACTIVA]?.fotos || [];
  if (!fotos.length) return;
  LIGHTBOX_INDICE = (LIGHTBOX_INDICE + delta + fotos.length) % fotos.length;
  pintarLightbox();
}

function pintarLightbox() {
  const fotos = GRUPOS_GALERIA[PESTANA_ACTIVA]?.fotos || [];
  const f = fotos[LIGHTBOX_INDICE];
  if (!f) return;
  const esFoto = f.tipo === "foto";
  const iconoDescargar = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`;
  const iconoCompartir = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>`;
  const credito = (f.titulo || f.autor_nombre)
    ? `${escapeHtml(f.titulo || "")}${f.titulo && f.autor_nombre ? " — " : ""}${f.autor_nombre ? "© " + escapeHtml(f.autor_nombre) : ""}`
    : "";
  const srcGrande = esFoto ? cloudinaryOptimizada(f.cloudinary_url, 1800) : f.cloudinary_url;

  document.getElementById("galLightboxMedia").innerHTML = `
    ${esFoto ? `<img src="${srcGrande}" alt="${escapeHtml(f.titulo || "")}" decoding="async">` : `<video src="${f.cloudinary_url}" controls autoplay></video>`}
    <div class="gal-lightbox-info">
      <div class="gal-lightbox-texto">
        ${credito ? `<p class="gal-lightbox-credito">${credito}</p>` : ""}
        ${fotos.length > 1 ? `<p class="gal-lightbox-contador">${LIGHTBOX_INDICE + 1} / ${fotos.length}</p>` : ""}
      </div>
      <div class="gal-lightbox-acciones">
        <button type="button" class="gal-lightbox-boton" id="galBtnDescargarLB">${iconoDescargar} Descargar</button>
        <button type="button" class="gal-lightbox-boton" id="galBtnCompartirLB">${iconoCompartir} Compartir</button>
      </div>
    </div>`;

  document.getElementById("galBtnDescargarLB").onclick = () => descargarMedia(LIGHTBOX_INDICE);
  document.getElementById("galBtnCompartirLB").onclick = (e) => compartirMedia(LIGHTBOX_INDICE, e.currentTarget);
}

document.getElementById("galLightbox").addEventListener("click", (e) => {
  if (e.target.id === "galLightbox") cerrarLightbox();
});
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("galLightbox").classList.contains("abierto")) return;
  if (e.key === "Escape") cerrarLightbox();
  if (e.key === "ArrowLeft") moverLightbox(-1);
  if (e.key === "ArrowRight") moverLightbox(1);
});

document.addEventListener("DOMContentLoaded", cargaGaleria);
</script>
</body>
</html>
