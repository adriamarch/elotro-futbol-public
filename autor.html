<main class="wrap">
  <div id="perfilAutor">
    <div class="estado-info"><div class="spinner"></div><p>Cargando...</p></div>
  </div>
  <div id="noticiasAutorWrap" style="display:none">
    <h2 class="section-title">Sus últimas noticias <span class="pa-contador" id="contadorAutor"></span></h2>
    <div class="grid-noticias" id="gridAutor"></div>
  </div>

<script src="js/main.js?v=14"></script>
<script>
async function cargaPerfilAutor() {
  const id = new URLSearchParams(location.search).get("id");
  const cont = document.getElementById("perfilAutor");
  if (!id) {
    _seoMeta("name", "robots", "noindex");
    cont.innerHTML = estadoHTML({
      titulo: "Autor no especificado",
      texto: "El enlace al que has accedido no incluye ningún autor. Vuelve a la portada para seguir navegando.",
      tipo: "error",
      cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
    });
    return;
  }
  try {
    const { autor, articulos } = await conReintento(async () => {
      const res = await apiFetch(`/api/autores/${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error("No encontrado");
      return res.json();
    });
    fijarSeoBasico({
      titulo: `${autor.nombre} — ELOTROFÚTBOLTV`,
      descripcion: autor.bio || `Perfil de ${autor.nombre}, autor en ELOTROFÚTBOLTV.`,
      urlPath: location.pathname + location.search,
      imagen: autor.avatar_url || undefined,
      migas: [{ nombre: autor.nombre }],
    });

    const nombre = autor.nombre || "";
    const primerNombre = nombre.trim().split(/\s+/)[0] || nombre;
    const lista = Array.isArray(articulos) ? articulos : [];

    const redesHTML = Object.entries(autor.redes || {})
      .filter(([, url]) => urlExternaSegura(url))
      .map(([key, url]) => `<a href="${urlExternaSegura(url)}" target="_blank" rel="noopener" title="${escapeHtml(NOMBRES_REDES[key] || key)}" aria-label="${escapeHtml(nombre)} en ${escapeHtml(NOMBRES_REDES[key] || key)}">${ICONOS_REDES[key] || ""}</a>`)
      .join("");

    // Avatar: foto con su foco, o iniciales si no hay foto (o si falla al cargar).
    const inicialesAutor = escapeHtml(iniciales(nombre) || "?");
    const avatarHTML = autor.avatar_url
      ? `<img${EOF_FOCO.attrs(autor.avatar_foco, "pa-avatar")} src="${urlExternaSegura(cloudinaryOptimizada(autor.avatar_url, 340))}" alt="${escapeHtml(nombre)}" width="170" height="170" onerror="this.replaceWith(Object.assign(document.createElement('span'), {className:'pa-avatar pa-avatar-iniciales', textContent:'${inicialesAutor}'}))">`
      : `<span class="pa-avatar pa-avatar-iniciales" aria-hidden="true">${inicialesAutor}</span>`;

    // Clubes: etiqueta con escudo (el mismo que usa el resto de la web).
    const equipos = Array.isArray(autor.equipo) ? autor.equipo : (autor.equipo ? [autor.equipo] : []);
    const clubHTML = (nombreClub) => {
      let escudo = "";
      try {
        let url = typeof getEscudoUrl === "function" ? getEscudoUrl(nombreClub) : "";
        if (url) {
          if (!/^(https?:)?\/\//.test(url) && !url.startsWith("/")) url = "/" + url;
          escudo = `<img src="${escapeHtml(url)}" alt="" width="26" height="26" loading="lazy" data-equipo="${escapeHtml(nombreClub)}" onerror="manejarErrorEscudo(this)">`;
        }
      } catch (_) {}
      return `<li class="pa-club">${escudo}${escapeHtml(nombreClub)}</li>`;
    };

    // Experiencia: cada línea escrita en el panel pasa a ser un punto de la línea de tiempo.
    const lineasExperiencia = String(autor.experiencia || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const experienciaHTML = lineasExperiencia.length
      ? `<ol class="pa-linea">${lineasExperiencia.map((l) => `<li>${escapeHtml(l)}</li>`).join("")}</ol>`
      : `<p class="pa-vacio">No hay experiencias previas.</p>`;

    // Actividad, calculada con las noticias recientes que devuelve la API.
    const hace = (fecha) => {
      const dias = Math.floor((Date.now() - fecha.getTime()) / 86400000);
      if (dias <= 0) return "Hoy";
      if (dias === 1) return "Ayer";
      if (dias < 7) return `Hace ${dias} días`;
      if (dias < 30) { const s = Math.floor(dias / 7); return `Hace ${s} ${s === 1 ? "semana" : "semanas"}`; }
      return formatFecha(fecha.toISOString());
    };
    const fechas = lista.map((a) => new Date(a.fecha_publicacion)).filter((d) => !isNaN(d.getTime())).sort((a, b) => b - a);
    const cuentaCat = {};
    lista.forEach((a) => { if (a.categoria) cuentaCat[a.categoria] = (cuentaCat[a.categoria] || 0) + 1; });
    const secciones = Object.entries(cuentaCat).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([cat]) => cat);
    const lateralHTML = lista.length
      ? `<aside class="pa-lateral" aria-label="Actividad de ${escapeHtml(nombre)}">
          <h2 class="pa-h2">Actividad</h2>
          <ul class="pa-datos">
            <li><strong class="pa-cifra">${lista.length}</strong><span>Noticias recientes</span></li>
            <li><strong class="pa-cifra pa-cifra-texto">${fechas.length ? escapeHtml(hace(fechas[0])) : "—"}</strong><span>Última publicación</span></li>
          </ul>
          ${secciones.length ? `<h3 class="pa-h3">Secciones en las que escribe</h3>
          <ul class="pa-secciones">${secciones.map((cat) => `<li>${escapeHtml(categoriaLabel(cat))}</li>`).join("")}</ul>` : ""}
        </aside>`
      : `<aside class="pa-lateral" aria-label="Actividad de ${escapeHtml(nombre)}">
          <h2 class="pa-h2">Actividad</h2>
          <p class="pa-vacio">Todavía no ha publicado noticias.</p>
        </aside>`;

    cont.innerHTML = `
      <section class="pa-ficha" aria-labelledby="paNombre">
        <div class="pa-banda" aria-hidden="true"></div>
        <div class="pa-identidad">
          ${avatarHTML}
          <div class="pa-id-texto">
            <span class="pa-rol">Autor</span>
            <h1 class="pa-nombre" id="paNombre">${escapeHtml(nombre)}</h1>
            ${equipos.length ? `<ul class="pa-clubes" aria-label="Clubes que sigue">${equipos.map(clubHTML).join("")}</ul>` : ""}
          </div>
          ${redesHTML ? `<div class="pa-redes" aria-label="Redes sociales">${redesHTML}</div>` : ""}
        </div>
        <div class="pa-cuerpo">
          <div class="pa-principal">
            <section class="pa-bloque">
              <h2 class="pa-h2">Sobre ${escapeHtml(primerNombre)}</h2>
              ${autor.bio
                ? `<p class="pa-bio">${escapeHtml(autor.bio)}</p>`
                : `<p class="pa-vacio">Este autor todavía no ha añadido una presentación.</p>`}
            </section>
            <section class="pa-bloque">
              <h2 class="pa-h2">Experiencia previa</h2>
              ${experienciaHTML}
            </section>
          </div>
          ${lateralHTML}
        </div>
      </section>`;

    const gridWrap = document.getElementById("noticiasAutorWrap");
    const grid = document.getElementById("gridAutor");
    if (articulos && articulos.length) {
      gridWrap.style.display = "block";
      grid.innerHTML = articulos.map(cardHTML).join("");
      const contador = document.getElementById("contadorAutor");
      if (contador) contador.textContent = articulos.length;
    }
  } catch (err) {
    _seoMeta("name", "robots", "noindex");
    cont.innerHTML = estadoHTML({
      titulo: "No se ha podido cargar este perfil",
      texto: "Puede que el autor ya no exista o que haya un problema de conexión. Vuelve a la portada e inténtalo de nuevo.",
      tipo: "error",
      cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
    });
  }
}
document.addEventListener("DOMContentLoaded", cargaPerfilAutor);
</script>
</body>
</html>
