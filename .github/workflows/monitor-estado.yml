# Monitor automático del histórico de incidencias de /estado.
# Cada 10 min comprueba desde fuera la web, la API y la base de datos y guarda cada caída y
# cada mantenimiento en data/estado/incidencias.json, que lee public/js/estado-historico.js.
# Solo hace commit cuando hay un cambio (o como latido cada 12 h), así que el sitio solo se
# vuelve a desplegar entonces.
# Secret opcional: DISCORD_WEBHOOK_URL (el mismo de monitor-salud.yml).
name: Monitor de estado (histórico)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-estado
  cancel-in-progress: false

# Escribe en el repositorio: es la única forma de publicar el histórico como fichero del sitio.
permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar web, API y base de datos
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/monitor-estado.mjs
      - name: Guardar histórico
        run: |
          if [ -z "$(git status --porcelain -- data/estado/incidencias.json)" ]; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado/incidencias.json
          git commit -m "Monitor de estado: histórico de incidencias"
          for intento in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          echo "No se pudo publicar el histórico tras 3 intentos." >&2
          exit 1
