// ---------- Fotos (galería pública del partido, por su slug) ----------
async function cpCargarGaleria() {
  const p = mamPartido;
  if (!p || !p.url_galeria || cpGaleria) return;
  cpGaleria = "cargando";
  try {
    const slug = decodeURIComponent(String(p.url_galeria).split("?")[0].replace(/\/+$/, "").split("/").pop() || "");
    if (!slug) throw new Error("sin slug");
    const res = await apiFetch(`/api/results/galeria/${encodeURIComponent(slug)}`, { cache: "no-store" });
    if (!res.ok) throw new Error("http");
    const datos = await res.json();
    const fotos = Object.values(datos.grupos || {}).flatMap((g) => g.fotos || []).filter((f) => !f.tipo || f.tipo === "foto");
    cpGaleria = { fotos, total: Number(datos.totalFotos) || fotos.length };
  } catch (_) {
    cpGaleria = "error";
  }
  if (cpVisible("fotos")) cpRenderFotos();
}

function cpRenderFotos() {
  const p = mamPartido;
  const cont = document.getElementById("cpFotos");
  if (!p || !cont) return;
  if (!p.url_galeria) { cpPintarSi("fotos", cont, `<p class="cp-vacio">Este partido todavía no tiene fotos.</p>`); return; }
  if (cpGaleria === null) cpCargarGaleria();
  if (cpGaleria === null || cpGaleria === "cargando") {
    cpPintarSi("fotos", cont, `<div class="cp-fotos" aria-label="Cargando fotos">${'<div class="cp-skel-foto"></div>'.repeat(6)}</div>`);
    return;
  }
  const url = escapeHtml(p.url_galeria);
  if (cpGaleria === "error" || !cpGaleria.fotos.length) {
    cpPintarSi("fotos", cont, `<div class="cp-vacio">No se han podido cargar las fotos aquí.<div class="cp-fotos-pie"><a class="cp-boton" href="${url}">Abrir la galería</a></div></div>`);
    return;
  }
  const muestra = cpGaleria.fotos.slice(0, 9);
  cpPintarSi("fotos", cont, `
    <div class="cp-fotos">${muestra.map((f, i) => `
      <a class="cp-foto" href="${url}" aria-label="${escapeHtml(f.titulo || `Foto ${i + 1} del partido`)}">
        <img src="${escapeHtml(cloudinaryMiniatura(f.cloudinary_url, 480, false))}" alt="${escapeHtml(f.titulo || "")}" loading="lazy" decoding="async">
      </a>`).join("")}</div>
    <div class="cp-fotos-pie"><a class="cp-boton" href="${url}">Ver galería completa${cpGaleria.total > muestra.length ? ` (${cpGaleria.total} fotos)` : ""}</a></div>`);
}

// ============================================================
// FASE 2 · Clasificación, forma reciente y cara a cara
// Todo se calcula en el navegador con /api/results (misma regla que /clasificacion).
// La lógica pura vive en js/centro-partido-datos.js (EOFCentro) y tiene tests.
// Los datos se piden solo al abrir la pestaña que los necesita, para no gastar lecturas
// en quien solo sigue el directo.
// ============================================================
// enlaceEquipoHref (clubs.js) usa baseHref() de layout.js, que esta página no carga: se define el mismo valor ("/").
if (typeof baseHref !== "function") window.baseHref = () => "/";

async function cpPedirLista(params) {
  const res = await apiFetch(`/api/results?${new URLSearchParams(params).toString()}`, { cache: "no-store" });
  if (!res.ok) throw new Error("http");
  const datos = await res.json();
  return Array.isArray(datos.results) ? datos.results : [];
}

function cpTemporada() {
  return EOFCentro.temporadaDe(mamPartido && mamPartido.fecha_partido);
}

// La pestaña existe en ligas con tabla; se oculta si la tabla sale vacía (aún sin partidos jugados).
function cpClasifDisponible() {
  const p = mamPartido;
  if (!p || !window.EOFCentro || !EOFCentro.tieneTabla(p.competicion)) return false;
  return !(cpClasif && cpClasif.vacia);
}

async function cpCargarClasificacion() {
  const p = mamPartido;
  if (!p || cpClasifPidiendo) return;
  const hayDatos = cpClasif && cpClasif.lista;
  const caducada = hayDatos && p.estado === "en_juego" && Date.now() - cpClasif.ts > 60000;
  if (hayDatos && !caducada) return; // ya cargada (en directo se refresca como mucho cada minuto)
  if (cpClasif === "error" && Date.now() - cpClasifErrorTs < 30000) return; // no insistir en bucle tras un fallo
  const previa = cpClasif;
  cpClasifPidiendo = true;
  try {
    const t = cpTemporada();
    const params = { competicion: p.competicion, desde_fecha: t.desde, limit: "500" };
    if (p.grupo) params.grupo = p.grupo;
    const lista = EOFCentro.delTemporada(await cpPedirLista(params), t);
    cpClasif = { lista, ts: Date.now(), vacia: EOFCentro.calcularClasificacion(lista).length === 0 };
  } catch (_) {
    cpClasif = previa && previa.lista ? previa : "error";
    cpClasifErrorTs = Date.now();
  }
  cpClasifPidiendo = false;
  cpActualizar("datos"); // puede ocultar la pestaña si no hay tabla
  if (cpVisible("clasificacion")) cpRenderClasificacion();
  try { cpRenderPreviaDirecto(); } catch (_) {} // si es un partido sin jugar, los puestos se añaden a «Cómo llegan»
}

function cpClasificacionHTML() {
  const p = mamPartido;
  const e = escapeHtml;
  const t = cpTemporada();
  const tabla = EOFCentro.calcularClasificacion(EOFCentro.conPartidoActual(cpClasif.lista, p));
  if (!tabla.length) return `<p class="cp-vacio">Todavía no hay clasificación de este grupo.</p>`;
  const nombres = [p.equipo_local, p.equipo_visitante];
  const zonas = new Set();
  const filas = tabla.map((f, i) => {
    const pos = i + 1;
    const zona = EOFCentro.zonaParaPosicion(p.competicion, pos, tabla.length);
    if (zona) zonas.add(zona);
    const sel = nombres.includes(f.equipo);
    return `
      <tr${sel ? ` class="cp-clas-sel" aria-current="true"` : ""}${f.enVivo ? ` data-vivo="1"` : ""}>
        <td class="cp-c-pos"><span class="cp-clas-pos"${zona ? ` data-zona="${zona}"` : ""}>${pos}</span></td>
        <td class="cp-c-eq"><a href="${enlaceEquipoHref(f.equipo, p.competicion)}"><img src="${getEscudoUrl(f.equipo, f.escudoUrl)}" alt="" loading="lazy" data-equipo="${e(f.equipo)}" onerror="manejarErrorEscudo(this);"><span>${e(f.equipo)}</span>${f.enVivo ? `<i class="en-vivo-punto" title="Partido en juego: puntos provisionales"></i>` : ""}</a></td>
        <td>${f.pj}</td>
        <td class="cp-c-peq">${f.pg}</td><td class="cp-c-peq">${f.pe}</td><td class="cp-c-peq">${f.pp}</td>
        <td>${f.gf - f.gc > 0 ? "+" : ""}${f.gf - f.gc}</td>
        <td class="cp-c-pts">${f.pts}</td>
      </tr>`;
  }).join("");
  const ETQ = { ascenso: "Ascenso", playoff: "Play-off", playout: "Permanencia", descenso: "Descenso" };
  const leyenda = ["ascenso", "playoff", "playout", "descenso"].filter((z) => zonas.has(z))
    .map((z) => `<span><i data-zona="${z}"></i>${ETQ[z]}</span>`).join("");
  const titulo = (t.actual ? "Clasificación actual" : `Clasificación ${t.etiqueta}`) + (p.grupo ? ` · ${e(p.grupo)}` : "");
  return `
    <section class="cp-tarjeta cp-tarjeta-tabla" aria-label="${e(titulo)}">
      <h3 class="cp-titulo">${titulo}</h3>
      <div class="cp-clas-scroll"><table class="cp-clas">
        <thead><tr><th class="cp-c-pos" scope="col">#</th><th class="cp-c-eq" scope="col">Equipo</th><th scope="col"><abbr title="Partidos jugados">PJ</abbr></th><th class="cp-c-peq" scope="col"><abbr title="Ganados">G</abbr></th><th class="cp-c-peq" scope="col"><abbr title="Empatados">E</abbr></th><th class="cp-c-peq" scope="col"><abbr title="Perdidos">P</abbr></th><th scope="col"><abbr title="Diferencia de goles">DG</abbr></th><th class="cp-c-pts" scope="col"><abbr title="Puntos">Pts</abbr></th></tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
      <p class="cp-nota">Los dos equipos del partido aparecen resaltados.${tabla.some((f) => f.enVivo) ? " Los puntos de los partidos en juego son provisionales." : ""}</p>
      ${leyenda ? `<div class="cp-clas-leyenda" aria-label="Leyenda de zonas">${leyenda}</div>` : ""}
      <div class="cp-fotos-pie"><a class="cp-boton" href="clasificacion?cat=${encodeURIComponent(p.competicion)}">Ver clasificación completa</a></div>
    </section>`;
}

function cpRenderClasificacion() {
  const p = mamPartido;
  const cont = document.getElementById("cpClasificacion");
  if (!p || !cont) return;
  if (cpVisible("clasificacion")) cpCargarClasificacion();
  if (cpClasif === null) {
    cpPintarSi("clasificacion", cont, `<div class="cp-skel-tabla" aria-label="Cargando clasificación">${'<div class="cp-skel-fila"></div>'.repeat(8)}</div>`);
    return;
  }
  if (cpClasif === "error") {
    cpPintarSi("clasificacion", cont, `<div class="cp-vacio">No se ha podido cargar la clasificación.<div class="cp-fotos-pie"><a class="cp-boton" href="clasificacion?cat=${encodeURIComponent(p.competicion)}">Abrir la clasificación</a></div></div>`);
    return;
  }
  cpPintarSi("clasificacion", cont, cpClasificacionHTML());
}

// ---------- Forma reciente y cara a cara (Resumen) ----------
async function cpCargarPrevia() {
  const p = mamPartido;
  if (!p || cpPrevia || !p.equipo_local || !p.equipo_visitante) return;
  cpPrevia = "cargando";
  try {
    const [a, b] = await Promise.all([
      cpPedirLista({ club: p.equipo_local, limit: "200" }),
      cpPedirLista({ club: p.equipo_visitante, limit: "200" }),
    ]);
    cpPrevia = { lista: a.concat(b.filter((x) => !a.some((y) => y.id === x.id))) };
  } catch (_) {
    cpPrevia = "error";
  }
  if (cpVisible("resumen")) cpRenderResumen();
  try { cpRenderPreviaDirecto(); } catch (_) {}
}

function cpPreviaOpciones() {
  const p = mamPartido;
  // Antes de este partido: así un partido ya jugado muestra la forma con la que llegó.
  return { excluirId: p.id, antesDe: p.fecha_partido || "" };
}

function cpMarcadorTitulo(v) {
  const r = { V: "Victoria", E: "Empate", D: "Derrota" }[v.res];
  return `${r} ${v.gf}-${v.gc} ${v.local ? "ante" : "en campo de"} ${v.rival}`;
}

function cpFormaHTML() {
  const p = mamPartido;
  if (!p || !cpPrevia || typeof cpPrevia !== "object" || !cpPrevia.lista) return "";
  const e = escapeHtml;
  const equipos = [[p.equipo_local, p.escudo_local_url], [p.equipo_visitante, p.escudo_visitante_url]]
    .map(([nombre, esc]) => ({ nombre, esc, forma: EOFCentro.formaReciente(cpPrevia.lista, nombre, cpPreviaOpciones()) }));
  if (!equipos.some((x) => x.forma.length)) return "";
  const filas = equipos.map((x) => `
    <div class="cp-forma-fila">
      <span class="cp-forma-eq"><img src="${getEscudoUrl(x.nombre, x.esc)}" alt="" data-equipo="${e(x.nombre)}" onerror="manejarErrorEscudo(this);"><span>${e(x.nombre)}</span></span>
      <span class="cp-forma-chips">${x.forma.length ? x.forma.slice().reverse().map((v) =>
        `<a class="cp-chip cp-chip-${v.res}" href="minuto-a-minuto?id=${v.id}" title="${e(cpMarcadorTitulo(v))}" aria-label="${e(cpMarcadorTitulo(v))}">${v.res}</a>`).join("")
        : `<small class="cp-forma-nd">Sin partidos anteriores</small>`}</span>
    </div>`).join("");
  return `<section class="cp-tarjeta" aria-label="Forma reciente"><h3 class="cp-titulo">Forma reciente</h3>${filas}<p class="cp-nota">Últimos cinco partidos antes de este; el más reciente, a la derecha.</p></section>`;
}

// conVacio: en un partido sin jugar, si no hay enfrentamientos previos se dice (en Resumen simplemente no sale).
function cpCaraACaraHTML(conVacio) {
  const p = mamPartido;
  if (!p || !cpPrevia || typeof cpPrevia !== "object" || !cpPrevia.lista) return "";
  const e = escapeHtml;
  const r = EOFCentro.caraACara(cpPrevia.lista, p.equipo_local, p.equipo_visitante, cpPreviaOpciones());
  if (!r.total) {
    return conVacio
      ? `<section class="cp-tarjeta" aria-label="Cara a cara"><h3 class="cp-titulo">Cara a cara</h3><p class="cp-vacio cp-vacio-previa">No hay enfrentamientos anteriores registrados entre ${e(p.equipo_local)} y ${e(p.equipo_visitante)}. Este sería el primero.</p></section>`
      : "";
  }
  const mediaGoles = (r.golesA + r.golesB) / r.total;
  const media = conVacio ? ` · ${Number.isInteger(mediaGoles) ? mediaGoles : mediaGoles.toFixed(1).replace(".", ",")} goles por partido` : "";
  const plural = (n, s, pl) => `${n} ${n === 1 ? s : pl}`;
  const mes = r.desde ? new Date(r.desde + "T12:00:00").toLocaleDateString("es-ES", { month: "long", year: "numeric" }) : "";
  const lista = r.ultimos.map((v) => {
    const [nl, gl, gv, nv] = v.local ? [p.equipo_local, v.gf, v.gc, p.equipo_visitante] : [p.equipo_visitante, v.gc, v.gf, p.equipo_local];
    const fecha = v.fecha ? formatFecha(v.fecha) : "";
    return `<li><a href="minuto-a-minuto?id=${v.id}"><span class="cp-h2h-fecha">${e(fecha)}${v.competicion && v.competicion !== p.competicion ? ` · ${e(categoriaLabel(v.competicion))}` : ""}</span><span class="cp-h2h-res"><span>${e(nl)}</span><b>${gl}-${gv}</b><span>${e(nv)}</span></span></a></li>`;
  }).join("");
  return `
    <section class="cp-tarjeta" aria-label="Cara a cara">
      <h3 class="cp-titulo">Cara a cara</h3>
      <div class="cp-h2h-cifras">
        <div><b>${r.a}</b><small>${e(p.equipo_local)}</small></div>
        <div><b>${r.e}</b><small>Empates</small></div>
        <div><b>${r.b}</b><small>${e(p.equipo_visitante)}</small></div>
      </div>
      <div class="cp-h2h-barra" role="img" aria-label="${e(`${plural(r.a, "victoria", "victorias")} de ${p.equipo_local}, ${plural(r.e, "empate", "empates")} y ${plural(r.b, "victoria", "victorias")} de ${p.equipo_visitante}`)}">
        ${r.a ? `<i class="a" style="flex-grow:${r.a}"></i>` : ""}${r.e ? `<i class="e" style="flex-grow:${r.e}"></i>` : ""}${r.b ? `<i class="b" style="flex-grow:${r.b}"></i>` : ""}
      </div>
      <p class="cp-nota">${plural(r.total, "partido registrado", "partidos registrados")}${mes ? ` desde ${e(mes)}` : ""} · goles: ${e(p.equipo_local)} ${r.golesA}, ${e(p.equipo_visitante)} ${r.golesB}${media}</p>
      <ul class="cp-h2h-lista">${lista}</ul>
    </section>`;
}

// ---------- Partido sin jugar: cara a cara y «Cómo llegan» dentro de Directo ----------
// Mientras el partido no ha empezado, Directo solo tenía la cuenta atrás. Ahora debajo salen el cara a cara
// y cómo llega cada equipo (puesto en la tabla y últimos cinco). Reutiliza los datos del Resumen (cpPrevia, cpClasif).
// Pone a false si quieres ahorrar la petición de la clasificación (solo se pierde el puesto en «Cómo llegan»).
const CP_PREVIA_CON_TABLA = true;

function cpLlegadaHTML() {
  const p = mamPartido;
  if (!p || !cpPrevia || typeof cpPrevia !== "object" || !cpPrevia.lista) return "";
  const e = escapeHtml;
  const tabla = cpClasif && cpClasif.lista ? EOFCentro.calcularClasificacion(cpClasif.lista) : [];
  const equipos = [[p.equipo_local, p.escudo_local_url], [p.equipo_visitante, p.escudo_visitante_url]].map(([nombre, esc]) => ({
    nombre, esc,
    forma: EOFCentro.formaReciente(cpPrevia.lista, nombre, cpPreviaOpciones()),
    puesto: CP_PREVIA_CON_TABLA ? EOFCentro.puestoEnTabla(tabla, nombre) : null,
  }));
  if (!equipos.some((x) => x.forma.length || x.puesto)) return "";
  const filas = equipos.map((x) => {
    const dato = x.puesto ? `${x.puesto.pos}.º · ${x.puesto.pts} ${x.puesto.pts === 1 ? "punto" : "puntos"}` : "";
    return `
    <div class="cp-forma-fila">
      <span class="cp-forma-eq"><img src="${getEscudoUrl(x.nombre, x.esc)}" alt="" data-equipo="${e(x.nombre)}" onerror="manejarErrorEscudo(this);"><span class="cp-forma-nom"><span>${e(x.nombre)}</span>${dato ? `<small>${e(dato)}</small>` : ""}</span></span>
      <span class="cp-forma-chips">${x.forma.length ? x.forma.slice().reverse().map((v) =>
        `<a class="cp-chip cp-chip-${v.res}" href="minuto-a-minuto?id=${v.id}" title="${e(cpMarcadorTitulo(v))}" aria-label="${e(cpMarcadorTitulo(v))}">${v.res}</a>`).join("")
        : `<small class="cp-forma-nd">Sin partidos anteriores</small>`}</span>
    </div>`;
  }).join("");
  const t = cpTemporada();
  const nota = (equipos.some((x) => x.puesto) ? `Puesto en la clasificación${t.actual ? " actual" : ` ${e(t.etiqueta)}`}. ` : "")
    + "Forma: últimos cinco partidos; el más reciente, a la derecha.";
  return `<section class="cp-tarjeta" aria-label="Cómo llegan"><h3 class="cp-titulo">Cómo llegan</h3>${filas}<p class="cp-nota">${nota}</p></section>`;
}

function cpRenderPreviaDirecto() {
  const p = mamPartido;
  const el = document.getElementById("cpPreviaDirecto");
  if (!el || !p || p.estado !== "programado" || !p.equipo_local || !p.equipo_visitante || !window.EOFCentro) return;
  if (cpPrevia === null) cpCargarPrevia();
  if (CP_PREVIA_CON_TABLA && cpClasif === null && EOFCentro.tieneTabla(p.competicion)) cpCargarClasificacion();
  let html;
  if (cpPrevia === null || cpPrevia === "cargando") {
    html = `<div class="cp-skel-tabla" aria-label="Cargando cara a cara">${'<div class="cp-skel-fila"></div>'.repeat(3)}</div>`;
  } else if (cpPrevia === "error") {
    html = ""; // sin datos no se enseña nada: la cuenta atrás sigue como siempre
  } else {
    html = cpCaraACaraHTML(true) + cpLlegadaHTML();
  }
  cpPintarSi("previaDirecto", el, html);
}

// ---------- Enganches: las pestañas se actualizan solas tras cada pintado de la página ----------
(function cpEnganchar() {
  const envolver = (nombre, origen) => {
    const orig = window[nombre];
    if (typeof orig !== "function") return;
    window[nombre] = function () {
      const r = orig.apply(this, arguments);
      try { cpActualizar(origen); } catch (_) {}
      return r;
    };
  };
  envolver("mamPintarCabecera", "cabecera");
  envolver("mamRenderTimeline", "datos");
  envolver("mamPintarPrevia", "datos");
  envolver("mamPintarAplazado", "datos");
  // Si los eventos no cargan (error de red), las pestañas aparecen igualmente.
  const cargar = window.mamCargarEventos;
  window.mamCargarEventos = async function () {
    try { return await cargar.apply(this, arguments); }
    finally { try { cpActualizar("datos"); } catch (_) {} }
  };
})();

// Al pasar de pestañas a tablero (o al revés) al redimensionar o girar el dispositivo.
const cpAlCambiarModo = () => {
  cpTablero = cpMQ.matches;
  if (!cpInicializado) return;
  cpAplicarTablero();
  cpFirmaPestanas = "";
  cpPintarPestanas(cpDisponibles());
  if (cpTablero) cpRenderTodo(); else cpRenderPanel(cpActiva);
};
if (cpMQ.addEventListener) cpMQ.addEventListener("change", cpAlCambiarModo); else if (cpMQ.addListener) cpMQ.addListener(cpAlCambiarModo);

document.getElementById("cpPestanas").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-cp-tab]");
  if (b && b.dataset.cpTab !== cpActiva) cpMostrar(b.dataset.cpTab, true);
});
// Flechas izquierda/derecha, Inicio y Fin entre pestañas (patrón WAI-ARIA de tablist).
document.getElementById("cpPestanas").addEventListener("keydown", (ev) => {
  const tabs = [...document.querySelectorAll("#cpPestanas [data-cp-tab]")];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  let j = null;
  if (ev.key === "ArrowRight") j = (i + 1) % tabs.length;
  else if (ev.key === "ArrowLeft") j = (i - 1 + tabs.length) % tabs.length;
  else if (ev.key === "Home") j = 0;
  else if (ev.key === "End") j = tabs.length - 1;
  if (j === null) return;
  ev.preventDefault();
  cpMostrar(tabs[j].dataset.cpTab, true);
  const nuevo = document.getElementById("cpTab-" + tabs[j].dataset.cpTab);
  if (nuevo) nuevo.focus();
});
// Atrás/adelante del navegador o un enlace con #alineaciones cambian de pestaña.
window.addEventListener("hashchange", () => {
  const h = cpPestanaDeHash();
  if (cpInicializado && h && h !== cpActiva && cpDisponibles().includes(h)) cpMostrar(h, false);
});

// La cabecera se compacta y queda fija arriba: la barra de pestañas se pega justo debajo de ella.
(function cpPegarBajoCabecera() {
  const cab = document.getElementById("mamCabecera");
  if (!cab) return;
  const medir = () => {
    const alto = cab.classList.contains("mam-compacta") ? cab.offsetHeight : 0;
    document.body.style.setProperty("--cp-top", alto + "px");
  };
  new MutationObserver(medir).observe(cab, { attributes: true, attributeFilter: ["class"] });
  if ("ResizeObserver" in window) new ResizeObserver(medir).observe(cab);
  medir();
})();

// En pantallas anchas el tablero se monta ya (el esqueleto de carga sale en la columna central).
try { cpAplicarTablero(); } catch (_) {}
mamCargarInicial();
</script>
