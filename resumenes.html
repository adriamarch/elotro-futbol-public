<script>
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let RES_VIDEOS = [];
let RES_PAGINA = 1;
let RES_HAY_MAS = false;
let RES_CARGANDO = false;
let RES_ULTIMO = 0;

const RES_ICONO_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

document.getElementById("resSkeleton").innerHTML = Array.from({ length: 6 }, () => '<div class="res-skel"><i></i></div>').join("");

const RES_ICONO_VACIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>';
const RES_ICONO_ERROR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>';

function resEstadoHTML(titulo, texto, opciones) {
  const error = !!(opciones && opciones.error);
  return `<div class="res-vacio${error ? " res-vacio-error" : ""}" role="${error ? "alert" : "status"}">
    ${error ? RES_ICONO_ERROR : RES_ICONO_VACIO}
    <strong>${escapeHtml(titulo)}</strong>
    <span>${escapeHtml(texto)}</span>
    ${error ? '<button type="button" class="res-reintentar" id="resReintentar">Reintentar</button>' : ""}
  </div>`;
}

function resTituloVideo(v) {
  if (v.titulo && v.titulo.trim()) return v.titulo.trim();
  if (v.partido) return `${v.partido.equipo_local} - ${v.partido.equipo_visitante}`;
  return "Vídeo";
}

function pintarVideos() {
  const cont = document.getElementById("resContenido");
  const wrap = document.getElementById("resCargarMasWrap");
  if (!RES_VIDEOS.length) {
    cont.innerHTML = resEstadoHTML("Todavía no hay vídeos", "Vuelve pronto: aquí irán apareciendo los resúmenes de los partidos que cubrimos.");
    wrap.hidden = true;
    return;
  }
  cont.innerHTML = `<div class="res-grid" id="resGrid">${RES_VIDEOS.map((v, i) => {
    const titulo = resTituloVideo(v);
    const poster = VisorMedia.posterVideo(v.cloudinary_url, 640);
    const meta = [v.club, v.created_at ? formatFecha(v.created_at) : ""].filter(Boolean).join(" · ");
    const partido = v.partido
      ? `<a class="res-enlace-partido" href="/galeria/${encodeURIComponent(v.partido.slug)}">Ver galería del partido →</a>`
      : "";
    return `
      <article class="res-tarjeta">
        <button type="button" class="res-miniatura" data-indice="${i}" aria-label="Reproducir vídeo: ${escapeHtml(titulo)}">
          ${poster
            ? `<img src="${escapeHtml(poster)}" alt="" loading="${i < 6 ? "eager" : "lazy"}" decoding="async">`
            : `<video src="${escapeHtml(v.cloudinary_url)}#t=0.1" preload="metadata" muted playsinline></video>`}
          <span class="res-play">${RES_ICONO_PLAY}</span>
        </button>
        <div class="res-info">
          <h2 class="res-tarjeta-titulo">${escapeHtml(titulo)}</h2>
          ${meta ? `<p class="res-meta">${escapeHtml(meta)}</p>` : ""}
          ${v.autor_nombre ? `<p class="res-credito">© ${escapeHtml(v.autor_nombre)}</p>` : ""}
          ${partido}
        </div>
      </article>`;
  }).join("")}</div>`;
  wrap.hidden = !RES_HAY_MAS;
}

function pintarContador() {
  const el = document.getElementById("resContador");
  if (!RES_VIDEOS.length) { el.hidden = true; return; }
  const n = RES_VIDEOS.length;
  el.hidden = false;
  el.textContent = `${n.toLocaleString("es-ES")}${RES_HAY_MAS ? "+" : ""} ${n === 1 && !RES_HAY_MAS ? "vídeo" : "vídeos"}`;
  el.setAttribute("aria-label", `${el.textContent} disponibles`);
}

async function cargarVideos(reset) {
  if (RES_CARGANDO) return;
  RES_CARGANDO = true;
  const btn = document.getElementById("resBtnCargarMas");
  btn.disabled = true;
  btn.textContent = "Cargando…";
  if (reset) { RES_PAGINA = 1; RES_VIDEOS = []; }
  try {
    const params = new URLSearchParams({ pagina: RES_PAGINA, tipo: "video" });
    const res = await apiFetch(`/api/media/publica?${params.toString()}`);
    if (!res.ok) throw new Error("Error de red");
    const data = await res.json();
    RES_HAY_MAS = !!data.hayMas;
    RES_VIDEOS = RES_VIDEOS.concat((data.media || []).filter((m) => m && m.tipo === "video" && m.cloudinary_url));
    pintarVideos();
    pintarContador();
  } catch (err) {
    if (!RES_VIDEOS.length) {
      document.getElementById("resContenido").innerHTML = resEstadoHTML("No se han podido cargar los vídeos", "Ha habido un problema de conexión. Comprueba tu red e inténtalo de nuevo.", { error: true });
      document.getElementById("resCargarMasWrap").hidden = true;
    } else if (typeof EOF !== "undefined" && EOF.toast) {
      EOF.toast("No se han podido cargar más vídeos.", "error");
    }
  } finally {
    RES_CARGANDO = false;
    btn.disabled = false;
    btn.textContent = "Cargar más vídeos";
  }
}

function abrirVisorResumenes(indice) {
  const items = RES_VIDEOS.map((v) => ({
    tipo: "video",
    url: v.cloudinary_url,
    titulo: resTituloVideo(v),
    credito: v.autor_nombre ? "© " + v.autor_nombre : "",
    enlace: v.partido
      ? { href: `/galeria/${v.partido.slug}`, texto: `Ver galería de ${v.partido.equipo_local} - ${v.partido.equipo_visitante} →` }
      : null,
    compartirUrl: v.partido ? `${location.origin}/galeria/${v.partido.slug}` : "",
  }));
  VisorMedia.abrir(items, indice, {
    titulo: "ELOTROFÚTBOLTV",
    onCambio: (i) => { RES_ULTIMO = i; },
    onCerrar: () => {
      const el = document.querySelector(`#resGrid .res-miniatura[data-indice="${RES_ULTIMO}"]`);
      if (el) { el.scrollIntoView({ block: "nearest" }); el.focus({ preventScroll: true }); }
    },
  });
}

document.getElementById("resContenido").addEventListener("click", (e) => {
  const btn = e.target.closest(".res-miniatura");
  if (!btn) return;
  RES_ULTIMO = Number(btn.dataset.indice) || 0;
  abrirVisorResumenes(RES_ULTIMO);
});

document.getElementById("resContenido").addEventListener("click", (e) => {
  if (!e.target.closest("#resReintentar")) return;
  document.getElementById("resContenido").innerHTML = '<div class="res-grid" id="resSkeleton" aria-hidden="true">' + Array.from({ length: 6 }, () => '<div class="res-skel"><i></i></div>').join("") + "</div>";
  cargarVideos(true);
});

document.getElementById("resBtnCargarMas").addEventListener("click", () => {
  RES_PAGINA += 1;
  cargarVideos(false);
});

document.addEventListener("DOMContentLoaded", () => cargarVideos(true));
</script>
