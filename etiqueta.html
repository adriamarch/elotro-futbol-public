<script>
const ET_POR_PAGINA = 12;
// Mismo patrón que en src-worker.js: /etiqueta/<slug>. También vale ?e=<slug> por compatibilidad.
function slugDeLaUrl() {
  const m = location.pathname.match(/^\/etiqueta\/([^/]+)\/?$/);
  let s = m ? m[1] : (new URLSearchParams(location.search).get("e") || "");
  try { s = decodeURIComponent(s); } catch (_) {}
  return s.trim();
}

function estadoEtiquetaNoEncontrada(cont, texto) {
  _seoMeta("name", "robots", "noindex");
  cont.innerHTML = estadoHTML({
    titulo: "Etiqueta no encontrada",
    texto,
    tipo: "error",
    cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
  });
}

async function cargaEtiqueta() {
  const slug = slugDeLaUrl();
  const cont = document.getElementById("cabeceraEtiqueta");
  if (!slug) return estadoEtiquetaNoEncontrada(cont, "El enlace no incluye ninguna etiqueta. Vuelve a la portada para seguir navegando.");

  let datos;
  try {
    datos = await conReintento(async () => {
      const res = await apiFetch(`/api/etiquetas/${encodeURIComponent(slug)}`);
      if (res.status === 404) return { noExiste: true };
      if (!res.ok) throw new Error("Error " + res.status);
      return res.json();
    });
  } catch (_) {
    cont.innerHTML = estadoHTML({
      titulo: "No se ha podido cargar esta etiqueta",
      texto: "Hay un problema de conexión. Vuelve a la portada e inténtalo de nuevo.",
      tipo: "error",
      cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
    });
    return;
  }
  if (datos.noExiste) return estadoEtiquetaNoEncontrada(cont, "Todavía no hay noticias con esta etiqueta.");

  const { etiqueta, indexable } = datos;
  const nombre = etiqueta.nombre;
  const total = etiqueta.total;
  const urlCanonica = `/etiqueta/${encodeURIComponent(etiqueta.slug)}`;
  fijarSeoBasico({
    titulo: `${nombre}: noticias y crónicas — ELOTROFÚTBOLTV`,
    descripcion: `Todas las noticias de ELOTROFÚTBOLTV sobre ${nombre} (${total} ${total === 1 ? "noticia" : "noticias"}).`,
    urlPath: urlCanonica,
    migas: [{ nombre: `#${nombre}` }],
    noindex: !indexable, // con una sola noticia sería contenido casi duplicado de esa noticia
  });
  fijarRssAlternativo(`/rss/etiqueta/${etiqueta.slug}.xml`, `${nombre} — ELOTROFÚTBOLTV`);

  cont.innerHTML = `
    <section class="et-cabecera" aria-labelledby="etNombre">
      <span class="et-rotulo">Etiqueta</span>
      <h1 class="et-nombre" id="etNombre"><span class="et-almohadilla" aria-hidden="true">#</span>${escapeHtml(nombre)}</h1>
      <p class="et-conteo">${total} ${total === 1 ? "noticia" : "noticias"}</p>
      <a class="et-rss" href="/rss/etiqueta/${escapeHtml(etiqueta.slug)}.xml" rel="alternate" type="application/rss+xml">Seguir por RSS</a>
    </section>`;

  const wrap = document.getElementById("noticiasEtiquetaWrap");
  const grid = document.getElementById("gridEtiqueta");
  const btn = document.getElementById("btnMasEtiqueta");
  let offset = 0;
  let cargando = false;
  async function pedirPagina() {
    if (cargando) return;
    cargando = true;
    btn.disabled = true;
    try {
      const res = await apiFetch(`/api/articles?etiqueta=${encodeURIComponent(etiqueta.slug)}&limit=${ET_POR_PAGINA}&offset=${offset}`);
      if (!res.ok) throw new Error("Error " + res.status);
      const { articles, hay_mas } = await res.json();
      const lista = Array.isArray(articles) ? articles : [];
      grid.insertAdjacentHTML("beforeend", lista.map(cardHTML).join(""));
      offset += lista.length;
      wrap.style.display = "block";
      btn.style.display = hay_mas ? "inline-block" : "none";
    } catch (_) {
      btn.style.display = "inline-block";
      btn.textContent = "No se han podido cargar. Reintentar";
    } finally {
      cargando = false;
      btn.disabled = false;
    }
  }
  btn.addEventListener("click", () => { btn.textContent = "Cargar más noticias"; pedirPagina(); });
  pedirPagina();
}
document.addEventListener("DOMContentLoaded", cargaEtiqueta);
</script>
