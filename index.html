<script>
/* Rendimiento: los dos listados que pintan el hero se piden YA, sin esperar a
   que se descarguen y ejecuten los ~16 scripts del final de la pagina. main.js
   (cargaPortada) recoge estas promesas; si fallan o no existen, usa su camino
   normal con reintento y failover. Un solo uso, mismo endpoint y cache:no-store. */
(function(){try{
  var base="https://api.elotrofutbol.media";
  var pedir=function(ruta){
    var c=new AbortController(),t=setTimeout(function(){c.abort();},8000);
    return fetch(base+ruta,{cache:"no-store",signal:c.signal}).then(function(r){
      clearTimeout(t); if(!r.ok) throw new Error("http "+r.status); return r.json();
    },function(e){clearTimeout(t); throw e;});
  };
  var d=pedir("/api/articles?destacado=1&limit=5"),u=pedir("/api/articles?limit=8");
  d.catch(function(){}); u.catch(function(){});
  window.__eofPortada={destacados:d,ultimas:u};
}catch(e){}})();
</script>
