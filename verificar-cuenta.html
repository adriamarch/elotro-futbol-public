<style>
  .cuenta-wrap{max-width:420px;margin:80px auto;padding:0 16px;text-align:center;}
  .cuenta-box{background:var(--tarjeta);padding:36px 30px;border-radius:12px;box-shadow:0 4px 24px rgba(12,27,46,.08);border:1px solid var(--borde);}
  .cuenta-box h2{margin:0 0 10px;font-family:var(--font-tit);font-size:1.25rem;color:var(--marino-texto);}
  .cuenta-box p{margin:0 0 6px;font-size:.92rem;color:var(--texto-suave);}
  .cuenta-box a.btn-volver{display:inline-block;margin-top:20px;padding:11px 26px;background:linear-gradient(135deg, var(--rojo), var(--rojo-oscuro));color:#fff;border-radius:26px;text-decoration:none;font-family:var(--font-tit);text-transform:uppercase;font-size:.9rem;}

<div id="site-header"></div>

<main class="wrap cuenta-wrap">
  <div class="cuenta-box" id="cajaVerificar">
    <div class="icono-estado">⏳</div>
    <h2>Confirmando tu cuenta…</h2>
    <p>Un momento, por favor.</p>
  </div>
</main>

<script src="js/main.js?v=14"></script>
<script>
async function confirmarCuenta() {
  const caja = document.getElementById("cajaVerificar");
  const token = new URLSearchParams(location.search).get("token");
  if (!token) {
    caja.innerHTML = `<div class="icono-estado">⚠️</div><h2>Enlace incompleto</h2><p>Falta el código de confirmación en el enlace.</p><a class="btn-volver" href="/acceso">Ir a mi cuenta</a>`;
    return;
  }
  try {
    const res = await apiFetch("/api/readers/verificar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "No se ha podido confirmar la cuenta");
    guardarSesionLector(data.token, data.reader);
    caja.innerHTML = `<div class="icono-estado">✅</div><h2>¡Cuenta confirmada!</h2><p>Ya puedes comentar las noticias con tu nombre. Iremos añadiendo más funciones para lectores registrados, así que esta cuenta te servirá para mucho más muy pronto.</p><a class="btn-volver" href="/">Ir a la portada</a>`;
  } catch (err) {
    caja.innerHTML = `<div class="icono-estado">⚠️</div><h2>No se ha podido confirmar</h2><p>${err.message}</p><a class="btn-volver" href="/acceso">Ir a mi cuenta</a>`;
  }
}
confirmarCuenta();
</script>
