<script>
fijarSeoBasico({
  titulo: "Calendario — ELOTROFÚTBOLTV",
  descripcion: "Calendario de partidos de LaLiga Hypermotion, Primera y Segunda Federación, jornada a jornada.",
  urlPath: "/calendario",
});

let competicionActual = "hypermotion";
let grupoActual = "";

// Todos los resultados de la competición/grupo elegidos, cargados
// una vez y reutilizados para construir el calendario por jornada (evita
// pedirlos de nuevo cada vez que se cambia de jornada).
let RESULTADOS_COMPETICION = [];
let jornadaSeleccionada = null; // se fija tras la primera carga

// Filtro por equipo (resalta sus partidos y permite ver toda su temporada).
let equipoActual = "";
let modoTemporada = false;
// Posición (1ª, 2ª…) de jornada leída de la URL, que se aplica al cargar.
let jornadaPosPendiente = null;
// La URL (hash) solo se reescribe cuando la persona ya ha interactuado, para
// no ensuciarla en la primera visita.
let hashActivo = false;
const U = window.EOFCalUtil;

(function leerEstadoInicialDeUrl() {
  const h = U.leerHash(location.hash);
  const validas = [...document.querySelectorAll(".filtros button")].map(b => b.dataset.cat);
  if (!h.comp || !validas.includes(h.comp)) return;
  competicionActual = h.comp;
  grupoActual = h.grupo;
  equipoActual = h.equipo;
  modoTemporada = h.temp && !!h.equipo;
  jornadaPosPendiente = h.j;
  hashActivo = true;
  document.querySelectorAll(".filtros button").forEach(b => b.classList.toggle("activo", b.dataset.cat === competicionActual));
})();

// Vista: "tabla" (horario con los días arriba y las horas a la izquierda)
// o "lista" (tarjetas, una debajo de otra). Se recuerda la elección; si
// nunca se ha elegido, en móvil se arranca en lista porque una tabla con
// varias columnas obliga a desplazarse de lado.
let vistaActual = (() => {
  try {
    const g = localStorage.getItem("eof_cal_vista");
    if (g === "tabla" || g === "lista") return g;
  } catch (e) {}
  return window.matchMedia("(max-width: 700px)").matches ? "lista" : "tabla";
})();

document.querySelectorAll(".filtros button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filtros button").forEach(b => b.classList.remove("activo"));
    btn.classList.add("activo");
    competicionActual = btn.dataset.cat;
    // Al cambiar de competición, el filtro de grupo de la competición
    // anterior ya no tiene sentido (un grupo es propio de una única
    // competición), así que se resetea.
    grupoActual = "";
    jornadaSeleccionada = null;
    equipoActual = "";
    modoTemporada = false;
    jornadaPosPendiente = null;
    hashActivo = true;
    cargarTodo();
  });
});

const selectGrupo = document.getElementById("filtroGrupo");

selectGrupo.addEventListener("change", () => {
  grupoActual = selectGrupo.value;
  jornadaSeleccionada = null;
  equipoActual = "";
  modoTemporada = false;
  jornadaPosPendiente = null;
  hashActivo = true;
  cargarTodo();
});

// Segunda Federación tiene 5 grupos regionales. A diferencia de la
// portada (ver filtrarParaPortada en config.js/main.js), aquí en
// Calendario SÍ deben salir los partidos de TODOS los equipos de los 5
// grupos, los cubramos editorialmente o no: el calendario es un listado
// de referencia de la competición completa, no solo de las noticias que
// publicamos. Por eso ya no se filtra por "equipos soportados" como
// antes (esa limitación era solo temporal, mientras la base de datos
// tenía cargados partidos de unos pocos equipos).
//
// El desplegable de grupo se rellena a partir de los grupos que
// realmente aparecen en los resultados ya cargados de esta competición
// (no hay una lista fija de grupos en el frontend, y así tampoco se
// muestra un desplegable vacío o con grupos que no existen todavía).
// En Segunda Federación no tiene sentido un "Todos los grupos": son
// calendarios y numeraciones de jornada independientes entre grupos
// regionales, así que mezclarlos hace que la navegación "Jornada X"
// salte de un grupo a otro sin ningún criterio claro. Por eso, igual
// que en Clasificación, aquí se obliga a elegir siempre un grupo
// concreto (el primero, si no había ninguno seleccionado todavía).
function poblarFiltroGrupo(results) {
  let grupos = [...new Set(results.map(r => r.grupo).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  if (!grupos.length) {
    selectGrupo.hidden = true;
    selectGrupo.innerHTML = "";
    if (grupoActual) { grupoActual = ""; }
    return;
  }
  // Primera RFEF también: sus 2 grupos suman 760 partidos y con "Todos los grupos" la
  // API (límite 500, recorta por fecha DESC) dejaba fuera las jornadas ya jugadas y el
  // calendario arrancaba en una "Jornada 1" con todo por jugar.
  const obligatorio = competicionActual === "segunda_federacion" || competicionActual === "primera_federacion";
  selectGrupo.innerHTML = (obligatorio ? "" : `<option value="">Todos los grupos</option>`) +
    grupos.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");
  if (obligatorio) {
    if (!grupoActual || !grupos.includes(grupoActual)) grupoActual = grupos[0];
  } else if (grupoActual && !grupos.includes(grupoActual)) {
    // Si el grupo seleccionado ya no existe en esta competición, se
    // resetea a "todos" en vez de dejar el desplegable en un valor fantasma.
    grupoActual = "";
  }
  selectGrupo.value = grupoActual;
  selectGrupo.hidden = false;
}

// Fecha de inicio de la temporada de fútbol en curso ("YYYY-MM-DD"), para
// usarla como "desde_fecha" al pedir partidos y no depender solo del
// "limit=500" para acotar la temporada. Ver la explicación completa en la
// función gemela de clasificacion.html (mismo bug: la base de datos
// acumula todas las temporadas jugadas de cada grupo sin ningún campo
// "temporada", así que un grupo con varias temporadas acumuladas podía
// superar los 500 partidos y perder jornadas bajas de la temporada
// ACTUAL de forma intermitente, según cuánto histórico tuviera
// acumulado en cada momento).
function inicioTemporadaActual() {
  const ahora = new Date();
  const mes = ahora.getMonth(); // 0 = enero ... 11 = diciembre
  const anioInicio = mes >= 6 ? ahora.getFullYear() : ahora.getFullYear() - 1;
  return `${anioInicio}-07-01`;
}

// ---------- Carga de datos ----------
async function cargarTodo() {
  const cont = document.getElementById("calendarioCont");
  cont.innerHTML = esqueletoHTML();
  document.getElementById("calTira").hidden = true;
  document.getElementById("calResumen").hidden = true;
  try {
    const desdeFecha = inicioTemporadaActual();

    // El grupo se filtra en el propio backend (para no traer de más),
    // pero para poblar el desplegable de grupos hace falta ver todos los
    // grupos de la competición, así que esa consulta de "qué grupos
    // existen" se hace sin filtrar por grupo aunque haya uno seleccionado.
    // Se acota también por "desde_fecha" (temporada actual): así el
    // "limit=500" ya no tiene que cubrir el histórico completo de todas
    // las temporadas jugadas, solo la actual, y no se pierden nombres de
    // grupo ni jornadas bajas por culpa de partidos antiguos.
    const paramsBase = new URLSearchParams({ competicion: competicionActual, desde_fecha: desdeFecha, limit: "500", con_no_cubiertos: "1" });
    const paramsSinGrupo = paramsBase.toString();
    const { results: resultsParaGrupos } = await conReintento(() =>
      apiFetch(`/api/results?${paramsSinGrupo}`).then(r => r.json())
    );
    poblarFiltroGrupo(resultsParaGrupos);

    // Con el grupo ya decidido (fijado por poblarFiltroGrupo si hacía
    // falta, p.ej. en Segunda Federación), se piden los partidos DE ESE
    // GRUPO filtrados en el propio backend: así el LIMIT 500 aplica solo
    // dentro del grupo elegido y de la temporada actual, y no se pierde
    // ninguna jornada baja por culpa de partidos de otros grupos con
    // jornada más alta ni de temporadas anteriores acumuladas.
    const paramsFinal = new URLSearchParams({ competicion: competicionActual, desde_fecha: desdeFecha, limit: "500", con_no_cubiertos: "1" });
    if (grupoActual) paramsFinal.set("grupo", grupoActual);
    const { results: todos } = grupoActual
      ? await conReintento(() => apiFetch(`/api/results?${paramsFinal.toString()}`).then(r => r.json()))
      : { results: resultsParaGrupos };

    RESULTADOS_COMPETICION = todos;

    // La jornada que guarda la base de datos no siempre arranca en 1
    // dentro de un grupo (ver jornadasDisponibles/pintarCalendario más
    // abajo), así que a cada partido se le anota también la posición
    // relativa de su jornada dentro de las disponibles en este
    // grupo/competición (1ª, 2ª, 3ª...). partidoHTML y el modal de
    // detalle (abrirModalPartido, en partidos.js) usan jornada_mostrar
    // si está presente, así la tarjeta y el modal muestran la misma
    // jornada "correcta" que el navegador de arriba.
    const jornadasOrdenadas = [...new Set(RESULTADOS_COMPETICION.map(r => r.jornada))].sort((a, b) => a - b);
    RESULTADOS_COMPETICION.forEach(r => { r.jornada_mostrar = jornadasOrdenadas.indexOf(r.jornada) + 1; });

    PARTIDOS_CACHE = {};
    RESULTADOS_COMPETICION.forEach(r => { PARTIDOS_CACHE[r.id] = r; });

    poblarFiltroEquipo();
    poblarExportacion();
    pintarCalendario();
  } catch (err) {
    cont.innerHTML = estadoHTML({
      titulo: "No se ha podido conectar",
      texto: "Ha habido un problema al cargar el calendario. Comprueba tu conexión e inténtalo de nuevo.",
      tipo: "error",
      cta: `<a href="javascript:location.reload()" class="btn-volver">Reintentar</a>`,
    });
  }
}

// ---------- Calendario navegable por jornada ----------
function jornadasDisponibles() {
  return [...new Set(RESULTADOS_COMPETICION.map(r => r.jornada))].sort((a, b) => a - b);
}

// La primera vez que se entra se selecciona la jornada "actual": la
// jornada del primer partido pendiente por fecha (el próximo a jugarse
// cronológicamente). Si un partido pendiente no tiene fecha todavía
// asignada, ordenarPartidosCronologicamente no puede distinguirlo de
// otro sin fecha (los dos comparan como NaN) y los deja en el orden en
// que los devolvió el backend -que es por jornada DESCENDENTE-, así que
// aquí SIEMPRE se desempata por número de jornada ascendente antes de
// mirar la fecha; así un partido sin fecha de la jornada 41 nunca puede
// colarse por delante de uno con o sin fecha de una jornada anterior.
function elegirJornadaPorDefecto() {
  const jornadas = jornadasDisponibles();
  if (!jornadas.length) return null;
  const pendientes = RESULTADOS_COMPETICION
    .filter(r => r.estado === "programado" || r.estado === "anulado" || r.estado === "en_juego");
  if (pendientes.length) {
    const ordenados = [...pendientes].sort((a, b) => {
      if (a.jornada !== b.jornada) return a.jornada - b.jornada;
      const ta = timestampFechaPartido(a);
      const tb = timestampFechaPartido(b);
      if (isNaN(ta) && isNaN(tb)) return 0;
      if (isNaN(ta)) return 1;
      if (isNaN(tb)) return -1;
      return ta - tb;
    });
    return ordenados[0].jornada;
  }
  const disputados = ordenarPartidosCronologicamente(
    RESULTADOS_COMPETICION.filter(r => r.estado !== "programado" && r.estado !== "anulado")
  );
  return disputados.length ? disputados[0].jornada : jornadas[jornadas.length - 1];
}

// En Amistosos no hay jornadas reales (todos comparten jornada=0, ver
// admin.js), así que no tiene sentido navegar "Jornada anterior/
// siguiente": siempre habría una única jornada y los botones quedarían
// siempre deshabilitados sin más función que confundir. Por eso esta
// pestaña oculta del todo el bloque de navegación y, dentro de ella, se
// muestran TODOS los amistosos juntos (no solo los de "la jornada
// actual").
function esPestanaAmistosos() {
  return competicionActual === "amistoso";
}

const validoParaStats = (p) => !esFinalizadoSinCubrir(p);
const hoyMadrid = () => new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Madrid" });
const prefiereMenosMovimiento = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function temporadaActiva() { return modoTemporada && !!equipoActual && !esPestanaAmistosos(); }
function esDeEquipo(p) { return !!equipoActual && (p.equipo_local === equipoActual || p.equipo_visitante === equipoActual); }

function esqueletoHTML() {
  const tarjeta = `<div class="cal-esqueleto-tarjeta" aria-hidden="true"><i></i><i></i><i></i></div>`;
  return `<div class="tabla-jornada cal-esqueleto" role="status" aria-label="Cargando calendario">${tarjeta.repeat(5)}<span class="hz-sr">Cargando calendario…</span></div>`;
}

function agruparPorJornada() {
  const m = new Map();
  RESULTADOS_COMPETICION.forEach(r => {
    let a = m.get(r.jornada);
    if (!a) { a = []; m.set(r.jornada, a); }
    a.push(r);
  });
  return m;
}

// ---------- Filtro por equipo ----------
const selectEquipo = document.getElementById("filtroEquipo");
const btnTemporada = document.getElementById("btnTemporada");

function poblarFiltroEquipo() {
  const equipos = [...new Set(RESULTADOS_COMPETICION.flatMap(r => [r.equipo_local, r.equipo_visitante]).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"));
  if (!equipos.length) {
    selectEquipo.hidden = true;
    selectEquipo.innerHTML = "";
    equipoActual = "";
    modoTemporada = false;
    return;
  }
  if (equipoActual && !equipos.includes(equipoActual)) { equipoActual = ""; modoTemporada = false; }
  selectEquipo.innerHTML = `<option value="">Todos los equipos</option>` +
    equipos.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join("");
  selectEquipo.value = equipoActual;
  selectEquipo.hidden = false;
}

function actualizarBotonTemporada() {
  const visible = !!equipoActual && !esPestanaAmistosos();
  btnTemporada.hidden = !visible;
  const activa = visible && modoTemporada;
  btnTemporada.setAttribute("aria-pressed", activa ? "true" : "false");
  btnTemporada.textContent = activa ? "Volver a la jornada" : "Toda su temporada";
}

selectEquipo.addEventListener("change", () => {
  equipoActual = selectEquipo.value;
  if (!equipoActual) modoTemporada = false;
  hashActivo = true;
  sincronizarExportEquipo();
  pintarCalendario();
});

btnTemporada.addEventListener("click", () => {
  modoTemporada = !modoTemporada;
  hashActivo = true;
  pintarCalendario();
  if (modoTemporada) {
    document.querySelector('#calendarioCont [data-proximo="1"]')
      ?.scrollIntoView({ block: "center", behavior: prefiereMenosMovimiento() ? "auto" : "smooth" });
  }
});

// ---------- Estado en la URL ----------
function sincronizarHash() {
  if (!hashActivo) return;
  const pos = (jornadaSeleccionada === null || esPestanaAmistosos()) ? null : jornadasDisponibles().indexOf(jornadaSeleccionada) + 1;
  const h = U.escribirHash({ comp: competicionActual, grupo: grupoActual, equipo: equipoActual, temp: modoTemporada, j: pos || null });
  try { history.replaceState(null, "", location.pathname + location.search + h); } catch (e) {}
}

// ---------- Tira de jornadas ----------
function datosChip(j, i, ps) {
  const est = U.estadoJornada(ps);
  const r = U.resumenJornada(ps, { esValido: validoParaStats });
  const rango = U.formatRango(r.desde, r.hasta);
  let res = "";
  let extra = "";
  if (equipoActual) {
    const m = ps.find(esDeEquipo);
    res = m ? U.resultadoEquipo(m, equipoActual, { esValido: validoParaStats }) : "";
    const txt = { g: "victoria", e: "empate", p: "derrota" }[res];
    if (txt) extra = ` · ${txt} de ${equipoActual}`;
  }
  const tip = `Jornada ${i + 1}${rango ? " · " + rango : ""} · ${r.jugados}/${r.total} jugados${extra}`;
  return { est, res, tip };
}

function pintarTira(jornadas, porJornada) {
  const tira = document.getElementById("calTira");
  const defecto = elegirJornadaPorDefecto();
  tira.innerHTML = jornadas.map((j, i) => {
    const d = datosChip(j, i, porJornada.get(j) || []);
    return `<button type="button" class="cal-chip" data-pos="${i + 1}" data-estado="${d.est}"${d.res ? ` data-res="${d.res}"` : ""}${j === defecto ? ' data-actual="1"' : ""}${j === jornadaSeleccionada ? ' aria-current="true"' : ""} title="${escapeHtml(d.tip)}" aria-label="${escapeHtml(d.tip)}">${i + 1}</button>`;
  }).join("");
  tira.hidden = jornadas.length < 2;
  centrarChipSeleccionado();
}

function centrarChipSeleccionado() {
  const tira = document.getElementById("calTira");
  const c = tira.querySelector('[aria-current="true"]');
  if (!c || tira.scrollWidth <= tira.clientWidth) return;
  tira.scrollTo({ left: c.offsetLeft - (tira.clientWidth - c.offsetWidth) / 2, behavior: prefiereMenosMovimiento() ? "auto" : "smooth" });
}

document.getElementById("calTira").addEventListener("click", (e) => {
  const b = e.target.closest(".cal-chip");
  if (!b) return;
  const j = jornadasDisponibles()[parseInt(b.dataset.pos, 10) - 1];
  if (j === undefined || j === jornadaSeleccionada) return;
  jornadaSeleccionada = j;
  hashActivo = true;
  pintarCalendario();
});

// ---------- Resumen ----------
function dato(valor, etiqueta, clase = "") {
  return `<span class="cal-dato${clase}"><b>${valor}</b><em>${etiqueta}</em></span>`;
}

function pintarResumen(partidos, { equipo = false } = {}) {
  const el = document.getElementById("calResumen");
  const r = U.resumenJornada(partidos, { esValido: validoParaStats });
  const partes = [];
  const rango = U.formatRango(r.desde, r.hasta);
  if (rango) partes.push(dato(rango, equipo ? "temporada" : "fechas"));
  partes.push(dato(`${r.jugados}/${r.total}`, "jugados"));
  if (r.enVivo) partes.push(dato(`<i class="en-vivo-punto"></i>${r.enVivo}`, "en juego", " cal-dato-vivo"));
  if (r.conMarcador) {
    const media = r.mediaGoles.toLocaleString("es-ES", { maximumFractionDigits: 1 });
    partes.push(dato(r.goles, `goles · ${media} por partido`));
  }
  if (equipoActual) {
    const b = U.balanceEquipo(RESULTADOS_COMPETICION, equipoActual, { esValido: validoParaStats });
    if (b.pj) partes.push(dato(`${b.g}-${b.e}-${b.p}`, `G-E-P · ${b.gf}:${b.gc} goles`, " cal-dato-equipo"));
  }
  document.getElementById("calResumenDatos").innerHTML = partes.join("");
  const pct = Math.round(r.progreso * 100);
  const barra = document.getElementById("calProgreso");
  barra.setAttribute("aria-valuenow", String(pct));
  barra.firstElementChild.style.width = pct + "%";
  barra.hidden = !r.total;
  const btnActual = document.getElementById("btnJornadaActual");
  btnActual.hidden = equipo || jornadaSeleccionada === elegirJornadaPorDefecto();
  el.hidden = false;
}

// Se llama tras cada refresco en vivo: actualiza chips y resumen sin
// repintar la tira entera (así no se pierde su posición de scroll).
function actualizarIndicadores() {
  if (esPestanaAmistosos()) return;
  if (temporadaActiva()) { pintarResumen(RESULTADOS_COMPETICION.filter(esDeEquipo), { equipo: true }); return; }
  if (jornadaSeleccionada === null) return;
  const porJornada = agruparPorJornada();
  const jornadas = jornadasDisponibles();
  document.querySelectorAll("#calTira .cal-chip").forEach(c => {
    const i = parseInt(c.dataset.pos, 10) - 1;
    const d = datosChip(jornadas[i], i, porJornada.get(jornadas[i]) || []);
    c.dataset.estado = d.est;
    if (d.res) c.dataset.res = d.res; else delete c.dataset.res;
    c.title = d.tip;
    c.setAttribute("aria-label", d.tip);
  });
  pintarResumen(porJornada.get(jornadaSeleccionada) || []);
}

// ---------- Lista agrupada por día ----------
function listaPorDiaHTML(partidos) {
  const grupos = U.agruparPorDia(partidos);
  if (!grupos.some(g => g.dia)) {
    return `<div class="tabla-jornada">${U.ordenarPorDia(partidos).map(p => partidoHTML(p)).join("")}</div>`;
  }
  const hoy = hoyMadrid();
  return `<div class="tabla-jornada">` + grupos.map(g => {
    const n = g.partidos.length;
    return `<div class="cal-dia-titulo${g.dia === hoy ? " cal-dia-hoy" : ""}" role="heading" aria-level="2"><span>${escapeHtml(U.etiquetaDia(g.dia, hoy))}</span><small>${n} ${n === 1 ? "partido" : "partidos"}</small></div>` +
      g.partidos.map(p => partidoHTML(p)).join("");
  }).join("") + `</div>`;
}

// Toda la temporada de un equipo: sus partidos jornada a jornada.
function temporadaEquipoHTML() {
  const porJornada = agruparPorJornada();
  const jornadas = jornadasDisponibles();
  let proximo = null;
  const trozos = [];
  jornadas.forEach((j, i) => {
    const mios = U.ordenarPorDia((porJornada.get(j) || []).filter(esDeEquipo));
    if (!mios.length) return;
    if (!proximo) proximo = mios.find(PARTIDO_PENDIENTE) || null;
    const r = U.resumenJornada(porJornada.get(j) || []);
    const rango = U.formatRango(r.desde, r.hasta);
    trozos.push(`<div class="cal-dia-titulo cal-jornada-titulo" role="heading" aria-level="2"><span>Jornada ${i + 1}</span>${rango ? `<small>${rango}</small>` : ""}</div>` +
      mios.map(p => partidoHTML(p)).join(""));
  });
  return { html: `<div class="tabla-jornada cal-temporada">${trozos.join("")}</div>`, proximoId: proximo ? proximo.id : null };
}

function pintarCalendario() {
  const cont = document.getElementById("calendarioCont");
  const navEl = document.querySelector(".calendario-nav");
  const tiraEl = document.getElementById("calTira");
  const resumenEl = document.getElementById("calResumen");
  const jornadas = jornadasDisponibles();
  const sinNavegacion = esPestanaAmistosos() || temporadaActiva();
  actualizarToggleVista(sinNavegacion);
  actualizarBotonTemporada();
  cont.classList.toggle("cal-con-equipo", !!equipoActual);
  tiraEl.hidden = true;
  resumenEl.hidden = true;
  const contexto = `${categoriaLabel(competicionActual)}${grupoActual ? " · " + grupoActual : ""}`;

  if (esPestanaAmistosos()) {
    navEl.hidden = true;
    if (!jornadas.length) {
      cont.innerHTML = estadoHTML({
        titulo: "Sin amistosos todavía",
        texto: grupoActual
          ? "No hay partidos con los filtros seleccionados. Prueba a quitar algún filtro."
          : "Aún no se han publicado partidos para esta competición. Prueba con otra categoría o vuelve más tarde.",
      });
      sincronizarHash();
      return;
    }
    // Dentro de Amistosos, los partidos programados (por jugar) van
    // arriba del todo y los ya disputados debajo: al contrario que el
    // orden habitual del resto de competiciones (que destaca primero lo
    // ya jugado), aquí interesa ver antes lo que queda por venir.
    const base = equipoActual ? RESULTADOS_COMPETICION.filter(esDeEquipo) : RESULTADOS_COMPETICION;
    const programados = ordenarPartidosCronologicamente(
      base.filter(r => r.estado === "programado" || r.estado === "anulado" || r.estado === "en_juego")
    );
    const disputados = ordenarPartidosCronologicamente(
      base.filter(r => r.estado !== "programado" && r.estado !== "anulado" && r.estado !== "en_juego")
    );
    const partidos = [...programados, ...disputados];
    document.getElementById("calendarioJornadaTitulo").textContent = "Amistosos";
    document.getElementById("calendarioJornadaSubtitulo").textContent = contexto;
    cont.innerHTML = `<div class="tabla-jornada">${partidos.map(p => partidoHTML(p)).join("")}</div>`;
    inicializarClicsPartidos("calendarioCont");
    marcarEstadosPartidos();
    sincronizarHash();
    return;
  }

  if (!jornadas.length) {
    navEl.hidden = false;
    document.getElementById("calendarioJornadaTitulo").textContent = "Sin calendario";
    document.getElementById("calendarioJornadaSubtitulo").textContent = "";
    document.getElementById("btnJornadaAnterior").disabled = true;
    document.getElementById("btnJornadaSiguiente").disabled = true;
    cont.innerHTML = estadoHTML({
      titulo: "Todavía no hay calendario",
      texto: grupoActual
        ? "No hay partidos con los filtros seleccionados. Prueba a quitar algún filtro."
        : "Aún no se han publicado partidos para esta competición. Prueba con otra categoría o vuelve más tarde.",
    });
    sincronizarHash();
    return;
  }

  if (jornadaSeleccionada === null || !jornadas.includes(jornadaSeleccionada)) {
    const deUrl = jornadaPosPendiente ? jornadas[jornadaPosPendiente - 1] : undefined;
    jornadaSeleccionada = deUrl !== undefined ? deUrl : elegirJornadaPorDefecto();
    jornadaPosPendiente = null;
  }

  if (temporadaActiva()) {
    navEl.hidden = true;
    const { html, proximoId } = temporadaEquipoHTML();
    cont.innerHTML = html;
    inicializarClicsPartidos("calendarioCont");
    marcarEstadosPartidos();
    if (proximoId !== null) {
      const el = cont.querySelector(`.partido[data-id="${proximoId}"]`);
      if (el) el.dataset.proximo = "1";
    }
    pintarResumen(RESULTADOS_COMPETICION.filter(esDeEquipo), { equipo: true });
    sincronizarHash();
    return;
  }

  navEl.hidden = false;
  const idx = jornadas.indexOf(jornadaSeleccionada);
  document.getElementById("btnJornadaAnterior").disabled = idx <= 0;
  document.getElementById("btnJornadaSiguiente").disabled = idx >= jornadas.length - 1;

  const porJornada = agruparPorJornada();
  const partidosJornada = porJornada.get(jornadaSeleccionada) || [];

  // El número de "jornada" que guarda la base de datos no siempre
  // arranca en 1 dentro de un grupo (varios grupos regionales de
  // Segunda Federación usan rangos de jornada distintos entre sí, p.ej.
  // el Grupo 4 empieza en la 41 y el Grupo 1 en la 1), así que mostrar
  // ese número crudo confunde. Aquí se muestra la posición real de la
  // jornada seleccionada dentro de las jornadas disponibles de este
  // grupo/competición (1ª, 2ª, 3ª...), no el número interno de la BD.
  document.getElementById("calendarioJornadaTitulo").textContent = `Jornada ${idx + 1}`;
  document.getElementById("calendarioJornadaSubtitulo").textContent = contexto;

  pintarTira(jornadas, porJornada);
  pintarResumen(partidosJornada);

  if (vistaActual === "tabla") {
    cont.innerHTML = horarioHTML(partidosJornada);
  } else {
    cont.innerHTML = listaPorDiaHTML(partidosJornada);
    inicializarClicsPartidos("calendarioCont");
    marcarEstadosPartidos();
  }
  sincronizarHash();
}

// ---------- Navegación: botones, teclado, gesto, atajos ----------
function irAJornada(delta) {
  if (esPestanaAmistosos() || temporadaActiva()) return false;
  const js = jornadasDisponibles();
  const i = js.indexOf(jornadaSeleccionada);
  const n = i + delta;
  if (i < 0 || n < 0 || n >= js.length) return false;
  jornadaSeleccionada = js[n];
  hashActivo = true;
  pintarCalendario();
  return true;
}

document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = e.target;
  if (t && t.closest && t.closest("input, select, textarea, [contenteditable], .horario-wrap")) return;
  const modal = document.getElementById("modalPartido");
  if (modal && modal.classList.contains("abierto")) return;
  if (irAJornada(e.key === "ArrowLeft" ? -1 : 1)) e.preventDefault();
});

// Gesto horizontal en móvil sobre la barra de jornada y la lista de tarjetas
// (la tabla tiene su propio scroll horizontal, así que queda fuera).
(function () {
  let x0 = null, y0 = 0, t0 = 0;
  const zona = ".calendario-nav, .tabla-jornada";
  document.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || !e.target.closest || !e.target.closest(zona)) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Date.now() - t0 > 700) return;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) irAJornada(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

document.getElementById("btnJornadaActual").addEventListener("click", () => {
  jornadaSeleccionada = elegirJornadaPorDefecto();
  hashActivo = true;
  pintarCalendario();
});

// ---------- Compartir enlace ----------
let _tCompartir = null;
async function compartirVista() {
  hashActivo = true;
  sincronizarHash();
  const url = location.href;
  const msg = document.getElementById("calCompartirMsg");
  const titulo = document.getElementById("calendarioJornadaTitulo").textContent;
  const avisar = (txt) => {
    msg.textContent = txt;
    clearTimeout(_tCompartir);
    _tCompartir = setTimeout(() => { msg.textContent = ""; }, 3500);
  };
  if (navigator.share && window.matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({ title: `${titulo} — ELOTROFÚTBOLTV`, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    avisar("Enlace copiado.");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove();
    avisar(ok ? "Enlace copiado." : url);
  }
}
document.getElementById("btnCompartir").addEventListener("click", compartirVista);

// Nota: antes había aquí una función que anulaba por JS el enlace de
// .equipo a la ficha del club (para que en calendario.html el clic
// siempre abriera el modal del partido). Ya no hace falta: .equipo es
// un <span> en la tarjeta de la lista (ver partidos.js), así que el
// clic en el nombre/escudo del equipo ya cae de forma natural en el
// clic de toda la tarjeta y abre el modal, igual que en las demás
// páginas.

// ---------- Añadir a mi calendario (.ics) ----------
// Descarga un archivo .ics con los partidos PENDIENTES de la jornada
// visible o de un equipo (todo lo que queda de temporada en la
// competición/grupo elegidos). Se abre con la app de calendario del
// móvil/ordenador. El UID de cada evento es fijo (partido-<id>), así que
// volver a importarlo actualiza los eventos en vez de duplicarlos en la
// mayoría de aplicaciones. Lógica del .ics en js/calendario-ics.js.
const CLAVE_EQUIPO_EXPORT = "eof_cal_export_equipo";
const PARTIDO_PENDIENTE = (r) => r.estado === "programado" || r.estado === "retrasado" || r.estado === "en_juego";

function poblarExportacion() {
  const caja = document.getElementById("calExport");
  const sel = document.getElementById("calExportSel");
  const msg = document.getElementById("calExportMsg");
  if (!caja || !sel || !window.EOFCalendarioICS) return;
  msg.textContent = "";
  const pendientes = RESULTADOS_COMPETICION.filter(PARTIDO_PENDIENTE);
  if (!pendientes.length) { caja.hidden = true; return; }

  const equipos = [...new Set(pendientes.flatMap(r => [r.equipo_local, r.equipo_visitante]).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"));
  const primera = esPestanaAmistosos()
    ? `<option value="todos">Todos los amistosos por jugar</option>`
    : `<option value="jornada">Esta jornada</option>`;
  sel.innerHTML = primera +
    `<optgroup label="Próximos partidos de…">` +
    equipos.map(e => `<option value="eq:${escapeHtml(e)}">${escapeHtml(e)}</option>`).join("") +
    `</optgroup>`;

  // Se recuerda el último equipo elegido (si juega en esta competición/grupo).
  let recordado = "";
  try { recordado = localStorage.getItem(CLAVE_EQUIPO_EXPORT) || ""; } catch (e) {}
  if (equipoActual && equipos.includes(equipoActual)) recordado = equipoActual;
  if (recordado && equipos.includes(recordado)) sel.value = "eq:" + recordado;
  caja.hidden = false;
}

// Al elegir equipo en el filtro, el desplegable de "Añadir a mi calendario"
// se coloca en ese equipo (o vuelve a lo habitual si se quita el filtro).
function sincronizarExportEquipo() {
  const sel = document.getElementById("calExportSel");
  if (!sel) return;
  const v = equipoActual ? "eq:" + equipoActual : (esPestanaAmistosos() ? "todos" : "jornada");
  if ([...sel.options].some(o => o.value === v)) sel.value = v;
}

function descargarCalendarioIcs() {
  const sel = document.getElementById("calExportSel");
  const msg = document.getElementById("calExportMsg");
  const v = sel.value;
  let partidos, nombre;
  if (v === "jornada") {
    partidos = RESULTADOS_COMPETICION.filter(r => r.jornada === jornadaSeleccionada);
    const n = jornadasDisponibles().indexOf(jornadaSeleccionada) + 1;
    nombre = `${categoriaLabel(competicionActual)}${grupoActual ? " " + grupoActual : ""} · Jornada ${n}`;
  } else if (v === "todos") {
    partidos = RESULTADOS_COMPETICION;
    nombre = "Amistosos";
  } else {
    const equipo = v.slice(3);
    partidos = RESULTADOS_COMPETICION.filter(r => r.equipo_local === equipo || r.equipo_visitante === equipo);
    nombre = equipo;
    try { localStorage.setItem(CLAVE_EQUIPO_EXPORT, equipo); } catch (e) {}
  }
  const { ics, incluidos, sinFecha } = EOFCalendarioICS.construirICS(partidos, { nombre });
  if (!incluidos) {
    msg.textContent = sinFecha
      ? "Estos partidos aún no tienen fecha: vuelve a probar cuando se confirmen."
      : "No quedan partidos por jugar.";
    return;
  }
  EOFCalendarioICS.descargar(ics, EOFCalendarioICS.nombreArchivo(nombre));
  msg.textContent = `${incluidos} ${incluidos === 1 ? "partido descargado" : "partidos descargados"}` +
    (sinFecha ? ` · ${sinFecha} sin fecha todavía (no incluidos)` : "") + ".";
}
document.getElementById("calExportBtn")?.addEventListener("click", descargarCalendarioIcs);
document.getElementById("calExportSel")?.addEventListener("change", () => {
  document.getElementById("calExportMsg").textContent = "";
});

// ---------- Apoyo visual (solo CSS: ver calendario-mejoras.css) ----------
// Anota en cada tarjeta el estado del partido y, si ya ha terminado con
// ganador, quién ganó (por goles o, si hubo empate, por penaltis), para
// que el CSS pueda diferenciar "por jugar", "retrasado", y resaltar al
// ganador. No cambia el contenido ni el comportamiento de la tarjeta.
function ganadorPartido(p) {
  if (p.estado !== "finalizado" || esFinalizadoSinCubrir(p)) return "";
  const gl = Number(p.goles_local), gv = Number(p.goles_visitante);
  if (isNaN(gl) || isNaN(gv)) return "";
  let dif = gl - gv;
  if (dif === 0 && p.penaltis_local != null && p.penaltis_visitante != null) {
    dif = Number(p.penaltis_local) - Number(p.penaltis_visitante);
  }
  return dif > 0 ? "local" : dif < 0 ? "visitante" : "";
}

function marcarEstadosPartidos() {
  document.querySelectorAll("#calendarioCont .partido[data-id]").forEach(el => {
    const p = PARTIDOS_CACHE[el.dataset.id];
    if (!p) return;
    el.dataset.estado = p.estado || "";
    el.removeAttribute("data-ganador");
    const g = ganadorPartido(p);
    if (g) el.dataset.ganador = g;
    if (esDeEquipo(p)) el.dataset.mio = "1"; else delete el.dataset.mio;
  });
}

// ---------- Vista de tabla (horario) ----------
// Día y hora de un partido tal y como ya los muestra formatFecha (config.js):
// "YYYY-MM-DD" = solo día; "YYYY-MM-DDTHH:MM" = día y hora de España tal
// cual se escribieron; cualquier otro formato = instante UTC pasado a
// España (solo se usa el día, igual que formatFecha).
const fechaHoraPartido = (p) => U.fechaHoraPartido(p);

function miniPartidoHTML(p) {
  const enJuego = p.estado === "en_juego";
  const enDescanso = enJuego && p.cronometro_pausado_en !== null && p.cronometro_pausado_en !== undefined;
  const mostrarGoles = p.estado === "finalizado" || enJuego;
  const gl = p.goles_local ?? 0, gv = p.goles_visitante ?? 0;
  const hayPen = p.penaltis_local != null && p.penaltis_visitante != null;
  const pen = (v) => hayPen ? `<sup class="hz-pen">(${v})</sup>` : "";
  const sinCubrir = esFinalizadoSinCubrir(p);
  const etiquetas = { programado: "Por jugar", finalizado: sinCubrir ? "Jugado · sin cubrir" : "Final", anulado: "Por jugar", retrasado: "Retrasado" };
  const estadoTxt = enJuego
    ? `<span class="en-vivo-punto"></span>${enDescanso ? "Descanso" : "En juego"} <span data-minuto-en-vivo="${p.id}">${minutoEnVivoTexto(p)}</span>`
    : (etiquetas[p.estado] || escapeHtml(p.estado));
  const lugar = p.estado === "anulado"
    ? `<span class="hz-lugar">· Pendiente de reprogramar</span>`
    : (((p.estado === "programado" || p.estado === "finalizado") && p.ubicacion) ? `<span class="hz-lugar">· ${escapeHtml(p.ubicacion)}</span>` : "");
  const g = ganadorPartido(p);
  const fila = (lado, nombre, escudoNombre, escudoUrl, goles, penVal) => `
      <div class="hz-equipo hz-${lado}">
        <img class="escudo" src="${getEscudoUrl(escudoNombre, escudoUrl)}" alt="" loading="lazy" data-equipo="${escapeHtml(escudoNombre)}" onerror="manejarErrorEscudo(this);">
        <span class="hz-nombre" title="${escapeHtml(nombre)}">${escapeHtml(nombre)}</span>
        ${mostrarGoles ? `<b class="hz-goles">${goles}${pen(penVal)}</b>` : ""}
      </div>`;
  return `
    <div class="hz-partido${enJuego ? " hz-en-vivo" : ""}" data-id="${p.id}" data-firma="${[p.estado, p.goles_local, p.goles_visitante, p.penaltis_local, p.penaltis_visitante, p.cronometro_pausado_en].join("|")}" data-estado="${escapeHtml(p.estado || "")}"${sinCubrir ? ' data-sin-cubrir="1" title="Ya se ha jugado, pero aún no se ha cubierto ni actualizado: no cuenta en la clasificación."' : ""}${g ? ` data-ganador="${g}"` : ""}${esPartidazo(p) ? ` data-partidazo="1"` : ""}${esDeEquipo(p) ? ` data-mio="1"` : ""} role="button" tabindex="0">
      ${fila("local", p.equipo_local, p.equipo_local, p.escudo_local_url, gl, p.penaltis_local)}
      ${fila("visitante", p.equipo_visitante, p.equipo_visitante, p.escudo_visitante_url, gv, p.penaltis_visitante)}
      <div class="hz-pie"><span class="hz-estado">${estadoTxt}</span>${lugar}</div>
    </div>`;
}

function horarioHTML(partidos) {
  const info = partidos.map(p => ({ p, ...fechaHoraPartido(p) }));
  const dias = [...new Set(info.map(i => i.dia).filter(Boolean))].sort();
  const columnas = [...dias, ...(info.some(i => !i.dia) ? [null] : [])];
  const horas = [...new Set(info.map(i => i.hora).filter(Boolean))].sort();
  const filas = [...horas, ...(info.some(i => !i.hora) ? [null] : [])];
  const hoy = new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Madrid" });

  const cabeceraDia = (dia) => {
    if (!dia) return `<th scope="col" class="hz-dia hz-dia-pendiente"><span class="hz-dia-sem">Fecha</span><span class="hz-dia-num">?</span><span class="hz-dia-mes">por confirmar</span></th>`;
    const [y, m, d] = dia.split("-").map(Number);
    const f = new Date(y, m - 1, d);
    const sem = f.toLocaleDateString("es-ES", { weekday: "short" }).replace(".", "");
    const mes = f.toLocaleDateString("es-ES", { month: "short" }).replace(".", "");
    const n = info.filter(i => i.dia === dia).length;
    return `<th scope="col" class="hz-dia${dia === hoy ? " hz-hoy" : ""}">
      ${dia === hoy ? `<span class="hz-hoy-badge">Hoy</span>` : ""}
      <span class="hz-dia-sem">${sem}</span><span class="hz-dia-num">${String(d).padStart(2, "0")}</span><span class="hz-dia-mes">${mes}</span>
      <span class="hz-dia-n">${n} ${n === 1 ? "partido" : "partidos"}</span></th>`;
  };

  const cuerpo = filas.map(hora => `
    <tr>
      <th scope="row" class="hz-hora${hora ? "" : " hz-hora-pendiente"}"><span>${hora || "Hora por confirmar"}</span></th>
      ${columnas.map(dia => {
        const delCuadro = info.filter(i => i.dia === dia && i.hora === hora)
          .sort((a, b) => a.p.equipo_local.localeCompare(b.p.equipo_local, "es"));
        const claseHoy = dia && dia === hoy ? " hz-hoy-col" : "";
        if (!delCuadro.length) return `<td class="hz-celda hz-vacia${claseHoy}"></td>`;
        return `<td class="hz-celda${claseHoy}"><div class="hz-pila">${delCuadro.map(i => miniPartidoHTML(i.p)).join("")}</div></td>`;
      }).join("")}
    </tr>`).join("");

  return `
    <div class="horario-wrap">
      <table class="horario" style="--hz-cols:${columnas.length}">
        <caption class="hz-sr">Horario de la jornada: días en columnas, horas en filas</caption>
        <thead><tr>
          <th scope="col" class="hz-esquina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Hora</span></th>
          ${columnas.map(cabeceraDia).join("")}
        </tr></thead>
        <tbody>${cuerpo}</tbody>
      </table>
    </div>`;
}

// El auto-refresco en vivo (partidos.js) solo repinta las tarjetas ".partido"
// de la lista; aquí se amplía para que también se actualicen los partidos de
// la tabla, y solo cuando algo ha cambiado de verdad (evita parpadeos).
const _actualizarPartidoOriginal = actualizarPartidoEnPantalla;
actualizarPartidoEnPantalla = function (resultado, eventos) {
  _actualizarPartidoOriginal(resultado, eventos);
  // Se devuelve a la lista de la competición la versión actualizada, para
  // que al cambiar de jornada no reaparezca el estado anterior del partido.
  const actualizado = PARTIDOS_CACHE[resultado.id];
  if (actualizado) {
    const i = RESULTADOS_COMPETICION.findIndex(r => r.id === actualizado.id);
    if (i >= 0) RESULTADOS_COMPETICION[i] = actualizado;
  }
  // El repintado de la tarjeta (partidos.js) pierde las marcas de estado.
  marcarEstadosPartidos();
  actualizarIndicadores();
  const el = document.querySelector(`.hz-partido[data-id="${resultado.id}"]`);
  const p = PARTIDOS_CACHE[resultado.id];
  if (!el || !p) return;
  const nuevo = miniPartidoHTML(p).trim();
  const tmp = document.createElement("div");
  tmp.innerHTML = nuevo;
  if (tmp.firstElementChild && tmp.firstElementChild.dataset.firma !== el.dataset.firma) {
    el.replaceWith(tmp.firstElementChild);
  }
};

function actualizarToggleVista(ocultar) {
  const t = document.getElementById("vistaToggle");
  t.hidden = !!ocultar;
  t.querySelectorAll("button").forEach(b => {
    const act = b.dataset.vista === vistaActual;
    b.classList.toggle("activo", act);
    b.setAttribute("aria-pressed", act ? "true" : "false");
  });
}

document.getElementById("vistaToggle").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-vista]");
  if (!b || b.dataset.vista === vistaActual) return;
  vistaActual = b.dataset.vista;
  try { localStorage.setItem("eof_cal_vista", vistaActual); } catch (err) {}
  pintarCalendario();
});

// Clic / teclado sobre un partido de la tabla -> mismo modal de detalle.
(function () {
  const cont = document.getElementById("calendarioCont");
  const abrir = (el) => { if (el) abrirModalPartido(parseInt(el.dataset.id, 10)); };
  cont.addEventListener("click", (e) => abrir(e.target.closest(".hz-partido")));
  cont.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const el = e.target.closest(".hz-partido");
    if (!el) return;
    e.preventDefault();
    abrir(el);
  });
})();

// La cabecera del sitio es "sticky" y su altura cambia según pantalla y
// banners; se mide para que la barra de jornada se quede justo debajo de
// ella en vez de quedar tapada.
function ajustarAltoCabecera() {
  const h = document.querySelector(".main-header");
  if (!h) return;
  document.body.style.setProperty("--cal-header-alto", Math.round(h.getBoundingClientRect().height + (parseFloat(getComputedStyle(h).top) || 0)) + "px");
}
window.addEventListener("resize", ajustarAltoCabecera);
window.addEventListener("load", ajustarAltoCabecera);
document.addEventListener("DOMContentLoaded", () => {
  ajustarAltoCabecera();
  // El header se inyecta con layout.js: se observa por si llega o cambia después.
  const sh = document.getElementById("site-header");
  if (sh && "MutationObserver" in window) new MutationObserver(ajustarAltoCabecera).observe(sh, { childList: true, subtree: true });
  if ("ResizeObserver" in window) {
    const t = setInterval(() => {
      const h = document.querySelector(".main-header");
      if (h) { new ResizeObserver(ajustarAltoCabecera).observe(h); clearInterval(t); }
    }, 200);
    setTimeout(() => clearInterval(t), 5000);
  }
});

document.getElementById("btnJornadaAnterior").addEventListener("click", () => irAJornada(-1));
document.getElementById("btnJornadaSiguiente").addEventListener("click", () => irAJornada(1));

document.addEventListener("DOMContentLoaded", () => {
  cargarTodo();
});
</script>
