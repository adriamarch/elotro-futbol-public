<script>
const ES_PREVIEW = new URLSearchParams(location.search).get("preview") === "1";

async function cargaArticulo() {
  const cont = document.getElementById("contenidoArticulo");

  // Modo previsualizacion. El panel puede abrir esta pagina en otra
  // pestaña/ventana, y sessionStorage no siempre se conserva según cómo
  // se haya abierto la pestaña o las políticas del navegador. Por eso
  // intentamos primero sessionStorage y después localStorage.
  if (ES_PREVIEW) {
    _seoMeta("name", "robots", "noindex, nofollow");

    // Cada previsualización lleva su propio id (?pid=...) y su propia clave,
    // para que otra noticia previsualizada en otra pestaña no la sustituya.
    const PID_PREVIEW = new URLSearchParams(location.search).get("pid") || "";
    const CLAVE_PREVIEW = "eof_preview_articulo:" + PID_PREVIEW;
    const leerPreview = () => {
      const almacenes = [sessionStorage, localStorage];
      for (const almacenamiento of almacenes) {
        try {
          const bruto = almacenamiento.getItem(CLAVE_PREVIEW);
          if (!bruto) continue;
          const articulo = JSON.parse(bruto);
          if (articulo && typeof articulo === "object") return articulo;
        } catch (_) {}
      }
      return null;
    };

    let article = leerPreview();

    if (!article) {
      cont.innerHTML = estadoHTML({
        titulo: "Vista previa no disponible",
        texto: "No se ha encontrado ningun contenido para previsualizar. Vuelve al panel e intentalo de nuevo.",
        tipo: "error",
        cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
      });
      return;
    }

    mostrarAvisoPreview();
    renderizaArticulo(article);

    // Actualizacion en vivo desde el panel. Ademas de BroadcastChannel,
    // escuchamos el evento "storage" para que funcione incluso cuando el
    // navegador no permite/soporta BroadcastChannel.
    if ("BroadcastChannel" in window) {
      const canalPreview = new BroadcastChannel("eof_preview_articulo");
      canalPreview.onmessage = (ev) => {
        if (!ev.data || typeof ev.data !== "object") return;
        // Solo se aceptan mensajes de la sesión de edición que abrió esta pestaña.
        if (ev.data.id !== PID_PREVIEW || !ev.data.article || typeof ev.data.article !== "object") return;
        try {
          sessionStorage.setItem(CLAVE_PREVIEW, JSON.stringify(ev.data.article));
        } catch (_) {}
        try {
          localStorage.setItem(CLAVE_PREVIEW, JSON.stringify(ev.data.article));
        } catch (_) {}
        mostrarAvisoPreview();
        renderizaArticulo(ev.data.article);
      };
    }

    window.addEventListener("storage", (ev) => {
      if (ev.key !== CLAVE_PREVIEW || !ev.newValue) return;
      try {
        const actualizado = JSON.parse(ev.newValue);
        if (!actualizado || typeof actualizado !== "object") return;
        try { sessionStorage.setItem(CLAVE_PREVIEW, ev.newValue); } catch (_) {}
        mostrarAvisoPreview();
        renderizaArticulo(actualizado);
      } catch (_) {}
    });

    return;
  }

  // El slug llega por query string en el formato antiguo (?slug=...) o,
  // con la URL bonita /futbol/categoria/slug, directamente en el
  // pathname: el navegador nunca ve el ?slug= interno que usa
  // _worker.js para pedir este mismo archivo a env.ASSETS.fetch(), así
  // que aquí hay que extraerlo también del pathname como alternativa.
  const matchPathBonito = location.pathname.match(/^\/futbol\/[^/]+\/([^/]+)\/?$/);
  const slug = new URLSearchParams(location.search).get("slug") || (matchPathBonito && decodeURIComponent(matchPathBonito[1]));
  if (!slug) {
    _seoMeta("name", "robots", "noindex");
    cont.innerHTML = estadoHTML({
      titulo: "Noticia no especificada",
      texto: "El enlace al que has accedido no incluye ninguna noticia. Vuelve a la portada para seguir navegando.",
      tipo: "error",
      cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
    });
    return;
  }
  try {
    const { res, data } = await conReintento(async () => {
      const res = await apiFetch(`/api/articles/${encodeURIComponent(slug)}`);
      const data = await res.json().catch(() => null);
      return { res, data };
    });

    // El slug ha cambiado desde que se compartió este enlace (el título
    // se editó mientras la noticia todavía estaba en borrador/programada):
    // se redirige de forma transparente al slug actual, conservando el
    // resto de la query (p. ej. ?lang=eu) por si la llevaba.
    if (data && data.redirect) {
      const params = new URLSearchParams(location.search);
      params.set("slug", data.redirect);
      // IMPORTANTE: ruta ABSOLUTA (empieza por "/"). Si esta página se
      // cargó desde la URL bonita /futbol/{categoria}/{slug}, una ruta
      // relativa "noticia.html?..." se resolvería contra ese path (p.ej.
      // /futbol/categoria/noticia.html?slug=... o peor aún con barra
      // final /futbol/categoria/slug/noticia.html?...), que no es una
      // ruta que el worker ni los estáticos reconozcan, y en combinación
      // con las reglas de trailing-slash de Pages puede acabar en un
      // bucle de redirecciones (ERR_TOO_MANY_REDIRECTS).
      // Si la API trae la categoría (noticia fusionada con otra del mismo
      // partido) se va a su URL bonita, que es la que conviene compartir.
      if (data.categoria && typeof urlNoticia === "function") {
        params.delete("slug");
        const resto = params.toString();
        location.replace(urlNoticia(data.categoria, data.redirect) + (resto ? `?${resto}` : ""));
        return;
      }
      location.replace(`/noticia.html?${params.toString()}`);
      return;
    }

    // La noticia existe y está programada, pero todavía no ha llegado su
    // hora de publicación: se muestra una cuenta atrás en vez del error
    // genérico, para quien haya recibido el enlace con antelación.
    if (data && data.programado) {
      _seoMeta("name", "robots", "noindex, nofollow");
      pintarCuentaAtrasProgramada(data.programado);
      return;
    }

    if (!res.ok || !data || !data.article) {
      const errNoEncontrada = new Error("No encontrada");
      // Solo un 404/410 de la API significa de verdad "esta noticia no
      // existe". Un 5xx, un 429 (cuota agotada), un timeout o un corte de
      // red son fallos TRANSITORIOS: marcar noindex ahí hacía que un
      // Googlebot que renderizara justo en ese momento sacara del índice
      // una noticia perfectamente válida.
      errNoEncontrada.noticiaNoExiste = res.status === 404 || res.status === 410;
      throw errNoEncontrada;
    }
    await precalentarHashesFotos(data.article);
    renderizaArticulo(data.article);
    // Tracking propio de vistas y tiempo de lectura (ver
    // js/analiticas-tracking.js y public/panel-analiticas.html). Solo se
    // dispara si la noticia se ha renderizado con éxito, para no contar
    // vistas de errores/noticias no encontradas.
    if (typeof window.iniciarTrackingLectura === "function") {
      window.iniciarTrackingLectura(data.article.slug || slug, window.IDIOMA_NOTICIA_MOSTRADO || "es");
    }
  } catch (err) {
    if (err && err.noticiaNoExiste) {
      _seoMeta("name", "robots", "noindex");
    } else if (cont.dataset && cont.dataset.prepintado === "1") {
      // Fallo transitorio y el servidor ya entregó el cuerpo de la noticia
      // (versión para bots): se conserva en vez de taparlo con un error.
      return;
    }
    cont.innerHTML = estadoHTML({
      titulo: "No se ha podido cargar la noticia",
      texto: "Puede que la noticia ya no exista o que haya un problema de conexion. Vuelve a la portada e intentalo de nuevo.",
      tipo: "error",
      cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
    });
  }
}

// Pinta la cuenta atrás bonita para una noticia programada (todavía no
// publicada) a la que alguien ha accedido con antelación mediante el
// enlace ya compartido. Se actualiza cada segundo y, en cuanto llega a
// cero, recarga la página sola para pasar a mostrar la noticia real (el
// disparador programado del Worker la publica en torno a ese mismo
// minuto, ver "scheduled" en worker/src/index.js).
let _timerCuentaAtras = null;
function pintarCuentaAtrasProgramada(programado) {
  const cont = document.getElementById("contenidoArticulo");
  // programado_para llega desde la base de datos en formato SQLite
  // "YYYY-MM-DD HH:MM:SS" en UTC pero SIN indicar la zona. Si se le pasa
  // tal cual a `new Date(...)`, la mayoría de navegadores lo interpretan
  // como hora LOCAL en vez de UTC, así que el contador se desfasaba
  // exactamente el huso horario del lector (p. ej. 2h en verano en
  // España): mostraba menos tiempo del que quedaba de verdad. Se
  // normaliza igual que ya se hace en partidos.js con inicio_cronometro_at.
  let rawFecha = String(programado.programado_para).trim();
  if (!/[zZ]|[+-]\d\d:?\d\d$/.test(rawFecha)) {
    rawFecha = rawFecha.includes("T") ? rawFecha + "Z" : rawFecha.replace(" ", "T") + "Z";
  }
  const objetivo = new Date(rawFecha).getTime();

  const tipoLabel = { noticia: "Noticia", previa: "Previa", cronica: "Crónica", analisis: "Análisis", opinion: "Opinión", entrevista: "Entrevista", uno_por_uno: "1x1 de jugadores" }[programado.tipo] || "Artículo";

  cont.innerHTML = `
    <div class="programada-caja">
      <span class="programada-etiqueta"><span class="punto-vivo"></span>${tipoLabel} programada</span>
      <h1 class="programada-titulo">${escapeHtml(programado.titulo)}</h1>
      <div class="programada-contador" id="programadaContador">
        <div class="unidad"><span class="numero" id="pc_dias">00</span><span class="etiqueta-unidad">Días</span></div>
        <div class="unidad"><span class="numero" id="pc_horas">00</span><span class="etiqueta-unidad">Horas</span></div>
        <div class="unidad"><span class="numero" id="pc_min">00</span><span class="etiqueta-unidad">Min</span></div>
        <div class="unidad"><span class="numero" id="pc_seg">00</span><span class="etiqueta-unidad">Seg</span></div>
      </div>
      <p class="programada-fecha">Se publica el ${formatFechaConHora(programado.programado_para)}</p>
      <p class="programada-ayuda">Esta noticia todavía se está terminando de revisar. En cuanto llegue la hora se publicará ella sola aquí mismo, sin que tengas que hacer nada.</p>
      <a href="/" class="btn-volver">Ir a portada mientras tanto</a>
    </div>`;

  const pad = (n) => String(Math.max(0, n)).padStart(2, "0");
  function actualizar() {
    const restante = objetivo - Date.now();
    if (restante <= 0) {
      clearInterval(_timerCuentaAtras);
      // Se recarga sola para pasar a la noticia real. OJO: el disparador
      // programado revisa cada minuto, así que justo al llegar la hora la
      // noticia puede tardar hasta ~60 s en publicarse y la API sigue
      // respondiendo "programada" (para que X/Facebook vean la tarjeta). Una
      // recarga inmediata entraría en bucle: se reintenta cada 5 s.
      const ayuda = document.querySelector(".programada-ayuda");
      if (ayuda) ayuda.textContent = "Publicándose ahora mismo… esta página se actualizará sola en unos segundos.";
      setTimeout(() => location.reload(), 5000);
      return;
    }
    const totalSeg = Math.floor(restante / 1000);
    const dias = Math.floor(totalSeg / 86400);
    const horas = Math.floor((totalSeg % 86400) / 3600);
    const min = Math.floor((totalSeg % 3600) / 60);
    const seg = totalSeg % 60;
    document.getElementById("pc_dias").textContent = pad(dias);
    document.getElementById("pc_horas").textContent = pad(horas);
    document.getElementById("pc_min").textContent = pad(min);
    document.getElementById("pc_seg").textContent = pad(seg);
  }
  actualizar();
  _timerCuentaAtras = setInterval(actualizar, 1000);
}

function mostrarAvisoPreview() {
  // Evita duplicar el aviso si se llama varias veces (p.ej. en cada
  // actualización en vivo desde el panel de administración).
  if (document.getElementById("avisoPreviewSticky")) return;
  const aviso = document.createElement("div");
  aviso.id = "avisoPreviewSticky";
  aviso.textContent = "Vista previa \u00b7 esta noticia todavia no esta publicada";
  aviso.style.cssText = "position:sticky;top:0;z-index:999;background:#222;color:#fff;text-align:center;padding:10px;font:600 14px/1.4 Inter,sans-serif;";
  document.body.prepend(aviso);
}

// ---------- Traducciones de la noticia (solo contenido, no la interfaz) ----------
// El selector de idioma de esta página es independiente del idioma de la
// interfaz (que siempre está en castellano). Solo cambia el título, el
// subtítulo y el cuerpo de la noticia, y solo entre los idiomas que el
// redactor haya traducido al subirla; si un idioma no está disponible se
// muestra en castellano con un aviso de "Disponible en...".
const IDIOMAS_NOTICIA = [
  { cod: "es", nombre: "Castellano" },
  { cod: "eu", nombre: "Euskera" },
  { cod: "ca", nombre: "Català" },
  { cod: "gl", nombre: "Galego" },
  { cod: "en", nombre: "English" },
];
let ARTICULO_ACTUAL = null;
let IDIOMA_NOTICIA_ACTUAL = "es";
let FOTOS_DE_TEXTO_ACTUAL = null;

// Peu de foto con el crédito/cita de la fotografía (autor, agencia...),
// cuando se ha indicado al subirla desde el panel. Se usa en todas las
// fotos de la noticia: portada, intercaladas en el texto y de galería.
function creditoFotoHTML(f) {
  return f && f.credito ? `<span class="credito-foto">${escapeHtml(f.credito)}</span>` : "";
}
// Reparte las fotos "de posición" (inicio/medio/final) dentro de un texto
// del cuerpo, intercalándolas entre sus bloques de nivel superior. Se usa
// tanto al pintar la noticia por primera vez como al cambiar de idioma,
// para que las fotos intercaladas en el texto nunca se pierdan aunque el
// contenido de ese idioma sea distinto del castellano.
// Deja funcionales los enlaces que vienen dentro del HTML del cuerpo de la
// noticia: si a alguno le falta el "https://" (enlaces antiguos creados sin
// protocolo) el navegador lo trataría como ruta relativa dentro de la propia
// web y rompería el enlace; y los que sí son externos se abren en pestaña
// nueva con rel="noopener noreferrer" para no perder al lector de la noticia
// ni exponer la página de origen a la de destino.
function arreglarEnlacesCuerpo(cuerpoEl) {
  if (!cuerpoEl) return;
  cuerpoEl.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href").trim();
    if (!href) return;
    const tieneEsquema = /^[a-z][a-z0-9+.-]*:/i.test(href);
    const esInterna = href.startsWith("/") || href.startsWith("#") || href.startsWith("?");
    if (!tieneEsquema && !esInterna) {
      a.setAttribute("href", `https://${href}`);
    }
    const esExterna = !esInterna && (tieneEsquema ? /^https?:/i.test(href) : true);
    if (esExterna) {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
    }
  });
}

// Convierte los blockquote.twitter-tweet que haya en el cuerpo de la
// noticia (insertados desde el panel con el botón "Tweet" del editor)
// en la tarjeta visual real del tweet -texto, foto, likes, botón de
// seguir...-. El HTML guardado es solo un enlace de respaldo (lo que ve
// cualquiera sin JavaScript, o mientras carga); el script oficial de X
// (widgets.js) es quien lo "hincha" al vuelo al detectar ese blockquote
// en la página.
// El script solo se pide la primera vez que hace falta (se reutiliza la
// misma promesa en llamadas posteriores): si la noticia no tiene ningún
// tweet incrustado, ni siquiera se llega a pedir, para no gastar una
// petición de red de más en el resto de noticias.
let SCRIPT_TWITTER_WIDGETS_CARGANDO = null;
let SCRIPT_INSTAGRAM_EMBED_CARGANDO = null;
function cargarWidgetsTwitterSiHaceFalta(cuerpoEl) {
  if (!cuerpoEl || !cuerpoEl.querySelector("blockquote.twitter-tweet")) return;
  if (window.twttr && window.twttr.widgets) {
    // El script ya está cargado (p.ej. se cambió de idioma y el nuevo
    // cuerpo también trae tweets): solo hay que pedirle que revise la
    // página de nuevo, no volver a insertarlo.
    window.twttr.widgets.load(cuerpoEl);
    return;
  }
  if (!SCRIPT_TWITTER_WIDGETS_CARGANDO) {
    SCRIPT_TWITTER_WIDGETS_CARGANDO = new Promise((resolve) => {
      const script = document.createElement("script");
      script.src = "https://platform.twitter.com/widgets.js";
      script.async = true;
      script.charset = "utf-8";
      script.onload = resolve;
      script.onerror = resolve; // si falla (p.ej. sin red), el enlace de respaldo se queda tal cual
      document.body.appendChild(script);
    });
  }
  SCRIPT_TWITTER_WIDGETS_CARGANDO.then(() => window.twttr?.widgets?.load(cuerpoEl));
}

// Igual que cargarWidgetsTwitterSiHaceFalta pero para los posts (o
// reels) de Instagram incrustados desde el mismo botón "Añadir tweet o
// post" del panel (ver admin.js, crearFilaTweet). Solo se pide el
// script de Instagram si de verdad hay algún blockquote.instagram-media
// en el cuerpo, para no gastar una petición de más en el resto de
// noticias.
function cargarWidgetsInstagramSiHaceFalta(cuerpoEl) {
  if (!cuerpoEl || !cuerpoEl.querySelector("blockquote.instagram-media")) return;
  if (window.instgrm && window.instgrm.Embeds) {
    window.instgrm.Embeds.process(cuerpoEl);
    return;
  }
  if (!SCRIPT_INSTAGRAM_EMBED_CARGANDO) {
    SCRIPT_INSTAGRAM_EMBED_CARGANDO = new Promise((resolve) => {
      const script = document.createElement("script");
      script.src = "https://www.instagram.com/embed.js";
      script.async = true;
      script.onload = resolve;
      script.onerror = resolve; // si falla (p.ej. sin red), el enlace de respaldo se queda tal cual
      document.body.appendChild(script);
    });
  }
  SCRIPT_INSTAGRAM_EMBED_CARGANDO.then(() => window.instgrm?.Embeds?.process(cuerpoEl));
}

function cargarEmbedsRedesSiHaceFalta(cuerpoEl) {
  cargarWidgetsTwitterSiHaceFalta(cuerpoEl);
  cargarWidgetsInstagramSiHaceFalta(cuerpoEl);
}

// Embed oficial de un tweet o post de Instagram incrustado en el cuerpo
// de la noticia: mismo blockquote estándar de cada plataforma que
// inserta el editor (ver crearFilaTweet en admin.js), envuelto en
// .article-tweet para poder centrarlo y limitarle el ancho sin pelear
// con el CSS que inyecta cada widget. cargarEmbedsRedesSiHaceFalta() se
// encarga luego de convertir el blockquote en la tarjeta visual real.
function tweetEmbedHTML(t) {
  if (t.plataforma === "instagram") {
    return `<div class="article-tweet"><blockquote class="instagram-media" data-instgrm-permalink="${escapeHtml(t.url)}" data-instgrm-version="14"></blockquote></div>`;
  }
  return `<div class="article-tweet"><blockquote class="twitter-tweet"><a href="${escapeHtml(t.url)}">${escapeHtml(t.url)}</a></blockquote></div>`;
}

// Distintos números de fotos por foto en una plantilla de collage (debe
// coincidir con las clases .collage-<plantilla> de css/style.css).
const FOTOS_POR_PLANTILLA_COLLAGE = { "2-horizontal": 2, "2-vertical": 2, "3-una-grande": 3, "3-fila": 3, "4-cuadricula": 4 };

const COLLAGE_PLANTILLA_POR_NUM = { 2: "2-horizontal", 3: "3-fila", 4: "4-cuadricula" };

function collageHTML(fotos) {
  // Antes se pintaban solo las N primeras de la plantilla (slice) y el resto de
  // fotos del grupo DESAPARECÍA. Ahora la plantilla se ajusta al número de fotos y,
  // si hay más de 4, se reparten en varios collages: no se pierde ninguna.
  if (fotos.length > 4) {
    let html = "";
    let resto = fotos.slice();
    while (resto.length > 0) {
      const toma = resto.length > 4 ? (resto.length - 4 === 1 ? 3 : 4) : resto.length;
      html += collageHTML(resto.slice(0, toma));
      resto = resto.slice(toma);
    }
    return html;
  }
  if (fotos.length === 1) {
    const f = fotos[0];
    return `<div class="article-img">${EOF_FOCO.img({ src: cloudinaryOptimizada(f.url, 780), alt: "", foco: f.foco, fallback: "" })}${creditoFotoHTML(f)}</div>`;
  }
  const pedida = fotos[0].plantilla || "2-horizontal";
  const plantilla = FOTOS_POR_PLANTILLA_COLLAGE[pedida] === fotos.length ? pedida : (COLLAGE_PLANTILLA_POR_NUM[fotos.length] || pedida);
  return `
    <div class="article-collage collage-${plantilla}">
      ${fotos.map((f) => `
        <div class="article-collage-foto">${EOF_FOCO.img({ src: cloudinaryOptimizada(f.url, 700), alt: "", foco: f.foco, fallback: "" })}${creditoFotoHTML(f)}</div>`).join("")}
    </div>`;
}

// Agrupa las fotos de posición "collage" por su id de "grupo" (varias
// fotos, mismo grupo = un único collage) y las convierte en un único
// bloque, en el punto del texto marcado por la primera foto del grupo.
// "resolver" (opcional) calcula ese punto contando los bloques reales del
// cuerpo (ver construirCuerpoConFotos); sin él se usa trasParrafo tal cual.
function agruparEnCollages(fotos, resolver) {
  const grupos = new Map();
  const orden = [];
  fotos.forEach((f) => {
    const clave = f.grupo || "collage-1";
    if (!grupos.has(clave)) { grupos.set(clave, []); orden.push(clave); }
    grupos.get(clave).push(f);
  });
  return orden.map((clave) => {
    const fotosGrupo = grupos.get(clave);
    return { trasParrafo: resolver ? resolver(fotosGrupo[0]) : (fotosGrupo[0].trasParrafo || 1), html: collageHTML(fotosGrupo) };
  });
}

function construirCuerpoConFotos(deTexto, cuerpoOriginal) {
  const personalizadas = deTexto.personalizada || [];
  const collages = deTexto.collage || [];
  const inicioSueltas = (deTexto.inicio || []).filter((f) => !f.grupo);
  const inicioCollages = agruparEnCollages((deTexto.inicio || []).filter((f) => f.grupo));
  const hayFotosEnTexto = inicioSueltas.length || inicioCollages.length || personalizadas.length || collages.length;
  if (!hayFotosEnTexto) return cuerpoOriginal;

  const fotoHTML = (f) =>
    f.esTweet
      ? tweetEmbedHTML(f)
      : `<div class="article-img">${EOF_FOCO.img({ src: cloudinaryOptimizada(f.url, 780), alt: "", foco: f.foco, fallback: "" })}${creditoFotoHTML(f)}</div>`;
  // Bloque a insertar al principio de todo: primero las fotos sueltas de
  // "inicio" (comportamiento clásico), luego los collages marcados como
  // "inicio" (un collage entero, no fotos sueltas).
  const bloqueInicio = inicioSueltas.map(fotoHTML).join("") + inicioCollages.map((c) => c.html).join("");

  const wrapTmp = document.createElement("div");
  wrapTmp.innerHTML = cuerpoOriginal;
  const elementos = [...wrapTmp.children];
  const bloques = elementos.map((n) => n.outerHTML);

  // PÁGINA FUSIONADA (varias previas/crónicas del mismo partido): el servidor pone
  // un <h2 class="fusion-seccion fusion-sN"> al empezar cada sección y marca cada
  // foto con su sección ("seccion") y su párrafo DENTRO de ella ("trasRel"). Aquí se
  // localizan esos encabezados contando los bloques reales del HTML ya saneado y se
  // calcula el punto exacto de cada foto. Así una foto nunca se cuela en otra
  // sección aunque el saneado, la traducción o el editor hayan cambiado el número
  // de bloques (antes se usaba un contador global calculado en el servidor).
  const inicios = [];
  elementos.forEach((el, i) => {
    if (el.tagName !== "H2") return;
    const m = /(?:^|\s)fusion-s(\d+)(?:\s|$)/.exec(el.getAttribute("class") || "");
    if (m && inicios[Number(m[1])] === undefined) inicios[Number(m[1])] = i;
  });
  const hayMarcas = inicios.some((x) => x !== undefined);
  const finDeSeccion = (k) => {
    for (let j = k + 1; j < inicios.length; j++) if (inicios[j] !== undefined) return inicios[j];
    return bloques.length;
  };
  const resolver = (f) => {
    const k = f && f.seccion;
    if (!hayMarcas || !Number.isInteger(k) || inicios[k] === undefined) return (f && f.trasParrafo) || 1;
    const ini = inicios[k];
    const fin = finDeSeccion(k);
    const nb = Math.max(0, fin - ini - 1);
    if (f.alFinalSeccion) return fin;
    if (f.alInicioSeccion) return ini + 1;
    if (!Number.isFinite(f.trasRel)) return f.trasParrafo || 1;
    return ini + 1 + (nb > 0 ? Math.min(Math.max(f.trasRel, 1), nb) : 0);
  };
  const collagesAgrupados = agruparEnCollages(collages, resolver);

  // Si el contenido no está hecho de bloques normales (caso raro: texto
  // suelto sin párrafos), no se puede partir con garantías sin arriesgarse
  // a perder texto; en ese caso las fotos "de texto" se colocan igualmente,
  // pero antes/después de todo el cuerpo en vez de intercaladas, para no
  // perder ni una palabra de la noticia.
  if (bloques.join("").length < cuerpoOriginal.length * 0.9) {
    const despues = personalizadas.map(fotoHTML).join("") + collagesAgrupados.map((c) => c.html).join("");
    return bloqueInicio + cuerpoOriginal + despues;
  }
  // Las fotos con posición personalizada (y los collages) se insertan
  // tras el número de párrafo elegido por quien escribe la noticia (1 =
  // tras el primer bloque). Se agrupan por índice y se insertan de más
  // al fondo hacia el principio para que los índices de las demás no se
  // descuadren al ir añadiendo bloques.
  const porIndice = new Map();
  const anadirAIndice = (indice, html) => {
    indice = Math.min(bloques.length, Math.max(1, indice));
    if (!porIndice.has(indice)) porIndice.set(indice, []);
    porIndice.get(indice).push(html);
  };
  personalizadas.forEach((f) => anadirAIndice(resolver(f), fotoHTML(f)));
  collagesAgrupados.forEach((c) => anadirAIndice(c.trasParrafo, c.html));
  [...porIndice.keys()].sort((a, b) => b - a).forEach((indice) => {
    bloques.splice(indice, 0, porIndice.get(indice).join(""));
  });
  if (bloqueInicio) {
    bloques.splice(0, 0, bloqueInicio);
  }
  return bloques.join("");
}

function textoArticuloEnIdioma(article, idioma) {
  if (idioma === "es") {
    return { titulo: article.titulo, subtitulo: article.subtitulo, contenido: article.contenido };
  }
  return {
    titulo: article[`titulo_${idioma}`] || article.titulo,
    subtitulo: article[`subtitulo_${idioma}`] || article.subtitulo,
    contenido: article[`contenido_${idioma}`] || article.contenido,
  };
}

// Centra el chip del idioma activo dentro de la fila de idiomas (en móvil la
// fila hace scroll horizontal). Solo mueve el scroll de la propia fila, nunca
// el de la página.
function centrarIdiomaActivo() {
  const fila = document.querySelector(".selector-idioma-noticia");
  const activo = fila && fila.querySelector(".idioma-noticia-btn.activo");
  if (!fila || !activo || fila.scrollWidth <= fila.clientWidth) return;
  const izq = activo.offsetLeft - (fila.clientWidth - activo.offsetWidth) / 2;
  fila.scrollTo({ left: Math.max(0, izq), behavior: "smooth" });
}

function selectorIdiomaHTML(article) {
  // En previsualización no hay "idiomas_disponibles" (no viene de la API
  // tal cual), así que se calcula igual aquí a partir de los campos.
  const disponibles = article.idiomas_disponibles || IDIOMAS_NOTICIA
    .map((i) => i.cod)
    .filter((cod) => cod === "es" || (article[`titulo_${cod}`] && article[`contenido_${cod}`]));

  const botones = IDIOMAS_NOTICIA.map(({ cod, nombre }) => {
    const disponible = disponibles.includes(cod);
    return `<button type="button" class="idioma-noticia-btn${cod === IDIOMA_NOTICIA_ACTUAL ? " activo" : ""}" data-idioma="${cod}" ${disponible ? "" : "disabled"} title="${disponible ? nombre : nombre + ": disponible solo en castellano"}" aria-label="${nombre}"><span class="nombre-idioma">${nombre}</span><span class="cod-idioma" aria-hidden="true">${cod.toUpperCase()}</span></button>`;
  }).join("");

  return `
    <div class="selector-idioma-noticia">
      ${botones}
    </div>
    <p class="aviso-idioma-noticia" style="display:none;"></p>
  `;
}

function disponiblesDeArticulo(article) {
  return article.idiomas_disponibles || IDIOMAS_NOTICIA
    .map((i) => i.cod)
    .filter((cod) => cod === "es" || (article[`titulo_${cod}`] && article[`contenido_${cod}`]));
}

// Una misma foto puede subirse dos veces a Cloudinary (p. ej. como portada y
// otra vez dentro del texto, o una por cada redactor al fusionar previas): son
// archivos distintos y no se detectan por URL. Aquí se comparan por contenido
// (hash perceptual dHash 8x8 de una miniatura) y, en orden de aparición
// (portada primero), se oculta la segunda y siguientes. Si algo falla
// (sin CORS, no es Cloudinary...) la foto se deja visible.
const _hashFotoCache = new Map();
const _hashResuelto = new Map(); // url -> hash ya calculado (consulta síncrona al pintar)

// Huella visual de una foto: dHash 16x16 (256 bits) + rejilla de luminosidad 8x8 +
// proporción. Dos fotos solo se consideran la misma si coinciden las tres cosas
// (ver fotosIguales): así se detectan las resubidas (otro archivo, otra compresión)
// sin confundir dos fotos distintas del mismo partido. Devuelve null si no se puede.
function hashVisualFoto(src) {
  if (_hashFotoCache.has(src)) return _hashFotoCache.get(src);
  const p = new Promise((resolve) => {
    const m = String(src).match(/^(https?:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\/)(?:[^/]*,[^/]*\/|[a-z]{1,3}_[^/]+\/)*(v\d+\/.+)$/i);
    if (!m) return resolve(null);
    // c_fit (no c_scale) para conservar la proporción real de la foto.
    const miniatura = m[1] + "f_jpg,q_auto,w_136,h_128,c_fit/" + m[2].replace(/\.[a-z0-9]{2,4}$/i, "") + ".jpg";
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = 17; c.height = 16;
        const ctx = c.getContext("2d");
        ctx.drawImage(im, 0, 0, 17, 16);
        const d = ctx.getImageData(0, 0, 17, 16).data;
        const g = (x, y) => { const i = (y * 17 + x) * 4; return d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; };
        const bits = [];
        for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) bits.push(g(x, y) > g(x + 1, y) ? 1 : 0);
        const unos = bits.reduce((t, v) => t + v, 0);
        // Foto casi lisa (fondo negro, cartel de un solo color...): el hash no es
        // fiable y todas saldrían "iguales". Se deja siempre visible.
        if (unos < 38 || unos > 218) return resolve(null);
        const lum = [];
        for (let by = 0; by < 8; by++) for (let bx = 0; bx < 8; bx++) {
          lum.push((g(bx * 2, by * 2) + g(bx * 2 + 1, by * 2) + g(bx * 2, by * 2 + 1) + g(bx * 2 + 1, by * 2 + 1)) / 4);
        }
        const media = lum.reduce((t, v) => t + v, 0) / 64;
        const ratio = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0;
        resolve({ bits, lum: lum.map((v) => v - media), ratio });
      } catch (e) { resolve(null); }
    };
    im.onerror = () => resolve(null);
    im.src = miniatura;
  });
  _hashFotoCache.set(src, p);
  p.then((v) => { _hashResuelto.set(src, v); });
  return p;
}

// Misma foto = proporción casi igual (±8%) Y dHash casi igual (<= 20 de 256 bits)
// Y luminosidad por zonas casi igual (diferencia media <= 14 de 255). Ante la duda
// se MUESTRAN las dos: mejor una repetida que perder una foto distinta.
function fotosIguales(a, b) {
  if (!a || !b) return false;
  if (a.ratio && b.ratio && Math.abs(a.ratio - b.ratio) / Math.max(a.ratio, b.ratio) > 0.08) return false;
  let dif = 0;
  for (let k = 0; k < 256; k++) { if (a.bits[k] !== b.bits[k] && ++dif > 20) return false; }
  let suma = 0;
  for (let k = 0; k < 64; k++) suma += Math.abs(a.lum[k] - b.lum[k]);
  return suma / 64 <= 14;
}

// Calcula de antemano las huellas de todas las fotos de la noticia (con un tope de
// tiempo) para poder quitar los duplicados ANTES de pintar, también los de la
// galería, que la pasada posterior sobre el DOM no alcanzaba. Solo en páginas
// fusionadas o con muchas fotos, que es donde se duplican.
async function precalentarHashesFotos(article, limiteMs = 1400) {
  try {
    const urls = new Set();
    const add = (u) => { if (typeof u === "string" && /res\.cloudinary\.com/i.test(u)) urls.add(u); };
    add(article.imagen_url);
    let imgs = article.imagenes;
    if (typeof imgs === "string") { try { imgs = JSON.parse(imgs); } catch { imgs = []; } }
    (Array.isArray(imgs) ? imgs : []).forEach((f) => { if (typeof f === "string") add(f); else if (f && f.tipo !== "tweet") add(f.url); });
    (Array.isArray(article.galeria_fotografo) ? article.galeria_fotografo : []).forEach((f) => add(f && f.url));
    if (urls.size < 2 || (!article.fusion && urls.size < 4)) return;
    await Promise.race([Promise.all([...urls].slice(0, 60).map(hashVisualFoto)), new Promise((r) => setTimeout(r, limiteMs))]);
  } catch (e) { /* no crítico */ }
}

// Detector de repetidas por contenido sobre las huellas ya calculadas (síncrono).
function crearDedupPorContenido() {
  const vistas = [];
  return {
    registrar(url) { const h = _hashResuelto.get(url); if (h) vistas.push(h); },
    repetida(url) {
      const h = _hashResuelto.get(url);
      if (!h) return false;
      if (vistas.some((v) => fotosIguales(v, h))) return true;
      vistas.push(h);
      return false;
    },
  };
}

// Si al quitar repetidas un collage se queda con una sola foto, deja de ser collage
// (una foto suelta en la misma posición) en vez de pintar un collage a medias.
function repararCollagesTrasDedupe(fotos) {
  const cuenta = new Map();
  fotos.forEach((f) => { if (f.grupo) cuenta.set(f.grupo, (cuenta.get(f.grupo) || 0) + 1); });
  return fotos.map((f) => {
    if (!f.grupo || cuenta.get(f.grupo) > 1) return f;
    const { grupo, plantilla, ...resto } = f;
    return f.posicion === "collage" ? { ...resto, posicion: "personalizada" } : resto;
  });
}

async function ocultarFotosRepetidas(raiz) {
  try {
    const imgs = [...(raiz || document).querySelectorAll(".article-img img, .article-collage-foto img")];
    const hashes = await Promise.all(imgs.map((im) => hashVisualFoto(im.getAttribute("src") || "")));
    const vistas = [];
    imgs.forEach((im, i) => {
      const h = hashes[i];
      if (!h) return;
      if (vistas.some((v) => fotosIguales(v, h))) {
        const caja = im.closest(".article-img, .article-collage-foto");
        if (caja) { caja.style.display = "none"; caja.setAttribute("data-foto-repetida", "1"); }
      } else vistas.push(h);
    });
  } catch (e) { /* no crítico */ }
}

function aplicarIdiomaNoticia(idioma, { actualizarUrl = true } = {}) {
  if (!ARTICULO_ACTUAL) return;
  IDIOMA_NOTICIA_ACTUAL = idioma;
  const disponibles = disponiblesDeArticulo(ARTICULO_ACTUAL);
  const disponible = disponibles.includes(idioma);
  const idiomaAMostrar = disponible ? idioma : "es";
  // Idioma REALMENTE mostrado (con el fallback a "es" ya aplicado si el
  // pedido no estaba disponible), para el tracking de "idiomas más
  // usados al leer una noticia" del panel de analíticas -- distinto de
  // IDIOMA_NOTICIA_ACTUAL, que guarda el pedido tal cual (para que el
  // selector marque el botón correcto aunque muestre el aviso de "no
  // disponible, se muestra en castellano").
  window.IDIOMA_NOTICIA_MOSTRADO = idiomaAMostrar;
  if (typeof window.actualizarIdiomaTrackingLectura === "function") {
    window.actualizarIdiomaTrackingLectura(idiomaAMostrar);
  }
  const textos = textoArticuloEnIdioma(ARTICULO_ACTUAL, idiomaAMostrar);

  const tituloEl = document.querySelector(".article-header h1");
  if (tituloEl) tituloEl.textContent = textos.titulo;
  const subtituloEl = document.querySelector(".article-header .subtitulo");
  if (subtituloEl) subtituloEl.textContent = textos.subtitulo || "";
  const cuerpoEl = document.querySelector(".article-body");
  if (cuerpoEl) {
    // Las fotos de posición (inicio/personalizada) son las mismas en todos
    // los idiomas -- solo cambia el texto -- así que se recalculan aquí
    // igual que en el pintado inicial, para que no desaparezcan al
    // cambiar de idioma.
    const deTexto = FOTOS_DE_TEXTO_ACTUAL || { inicio: [], personalizada: [] };
    cuerpoEl.innerHTML = construirCuerpoConFotos(deTexto, sanearHtmlContenido(textos.contenido || ""));
    arreglarEnlacesCuerpo(cuerpoEl);
    cargarEmbedsRedesSiHaceFalta(cuerpoEl);
    ocultarFotosRepetidas(document.getElementById("contenidoArticulo"));
  }

  document.querySelectorAll(".idioma-noticia-btn").forEach((b) => {
    b.classList.toggle("activo", b.dataset.idioma === idioma);
  });
  centrarIdiomaActivo();

  const aviso = document.querySelector(".aviso-idioma-noticia");
  if (aviso) {
    if (!disponible) {
      const nombreIdioma = (IDIOMAS_NOTICIA.find((i) => i.cod === idioma) || {}).nombre || idioma;
      const nombresDisponibles = disponibles
        .map((cod) => (IDIOMAS_NOTICIA.find((i) => i.cod === cod) || {}).nombre)
        .filter(Boolean)
        .join(", ");
      aviso.textContent = `Esta noticia no está disponible en ${nombreIdioma}. Se muestra en castellano. Disponible en: ${nombresDisponibles}.`;
      aviso.style.display = "block";
    } else {
      aviso.textContent = "";
      aviso.style.display = "none";
    }
  }

  // <html lang>, title, meta description, canonical, hreflang, og:locale
  // y JSON-LD se recalculan enteros cada vez que cambia el idioma
  // mostrado, no solo el título como antes.
  if (!ES_PREVIEW) {
    fijarSeoNoticia({
      article: ARTICULO_ACTUAL,
      idiomaActual: idiomaAMostrar,
      disponibles,
      textos,
    });

    // Refleja el idioma elegido en la URL (?lang=xx) para que la etiqueta
    // hreflang de esa variante y la URL visible coincidan, sin recargar
    // la página ni añadir una entrada nueva al historial por cada clic.
    if (actualizarUrl) {
      const params = new URLSearchParams(location.search);
      if (idioma === "es") params.delete("lang");
      else params.set("lang", idioma);
      const nuevaUrl = `${location.pathname}?${params.toString()}`.replace(/\?$/, "");
      history.replaceState(null, "", nuevaUrl);
    }
  }
}

// Pinta "· Editado el ..." junto a la fecha de publicación cuando la
// noticia se ha actualizado después de publicarse. Se compara contra un
// margen de 2 minutos (no una simple desigualdad de string) porque el
// propio guardado inicial de la noticia en el backend puede dejar
// updated_at unos segundos por delante de fecha_publicacion sin que
// haya habido ninguna edición real después de publicar; sin ese margen,
// toda noticia mostraría "editado" desde el mismo momento de publicarse.
// Firma de la noticia. Con 1-2 autores es la de siempre (autor y coautor);
// una previa/crónica fusionada con 3 o más trae la lista completa en
// "firmantes" (ver fusionarGrupoDePartido en el Worker).
function firmaAutoresHTML(article) {
  let firmantes;
  if (Array.isArray(article.firmantes) && article.firmantes.length > 2) {
    firmantes = article.firmantes;
  } else {
    if (!article.autor_nombre) return "";
    firmantes = [
      { id: article.autor_id, nombre: article.autor_nombre },
      article.coautor_nombre ? { id: article.coautor_id, nombre: article.coautor_nombre } : null,
    ].filter(Boolean);
  }
  if (!firmantes.length) return "";
  const enlace = (f) => (f.id ? `<a class="autor-link" href="/autor?id=${f.id}">${escapeHtml(f.nombre)}</a>` : escapeHtml(f.nombre));
  const partes = firmantes.map(enlace);
  const lista = partes.length === 1 ? partes[0] : partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1];
  return " · Por " + lista;
}

function fechaUltimaEdicionHTML(article) {
  if (!article.updated_at || !article.fecha_publicacion) return "";
  const publicada = new Date(String(article.fecha_publicacion).replace(" ", "T") + (/Z$|[+-]\d\d:\d\d$/.test(article.fecha_publicacion) ? "" : "Z"));
  const editada = new Date(String(article.updated_at).replace(" ", "T") + (/Z$|[+-]\d\d:\d\d$/.test(article.updated_at) ? "" : "Z"));
  if (isNaN(publicada) || isNaN(editada)) return "";
  if (editada.getTime() - publicada.getTime() < 2 * 60 * 1000) return "";
  return ` · <span class="fecha-editado">Editado el ${formatFechaConHora(article.updated_at)}</span>`;
}

// ---------- Noticias similares ----------
// Sección al final de la noticia con otras noticias relacionadas, para
// dar continuidad de lectura. "Relacionada" se define primero por club
// (si la noticia tiene uno asignado, es el criterio más específico:
// otras noticias del mismo equipo) y si no hay suficientes, se completa
// con noticias de la misma categoría. Se piden de más (NOTICIAS_SIMILARES_POOL)
// y se guardan en NOTICIAS_SIMILARES_POOL para poder "barajar" un
// subconjunto distinto cada vez que el lector pulsa "Ver otras" sin
// tener que volver a pedir nada al servidor.
let NOTICIAS_SIMILARES_POOL = [];
let NOTICIAS_SIMILARES_MOSTRADAS = [];

async function cargarNoticiasSimilares(article) {
  const cont = document.getElementById("noticiasSimilares");
  if (!cont) return;
  try {
    const peticiones = [];
    if (article.club) {
      // "club" puede tener 1 o 2 nombres (ver parsearClubArticulo en
      // config.js); se pide un lote de relacionadas por cada club para
      // que una crónica con 2 equipos también traiga noticias del
      // segundo, no solo del primero.
      parsearClubArticulo(article.club).forEach((club) => {
        peticiones.push(apiFetch(`/api/articles?club=${encodeURIComponent(club)}&limit=10`).then(r => r.json()).catch(() => ({ articles: [] })));
      });
    }
    peticiones.push(apiFetch(`/api/articles?categoria=${encodeURIComponent(article.categoria)}&limit=10`).then(r => r.json()).catch(() => ({ articles: [] })));
    const resultados = await Promise.all(peticiones);

    // Se juntan ambas listas (club primero, más específica) quitando
    // duplicados y la propia noticia que se está leyendo.
    const vistos = new Set([article.id]);
    const pool = [];
    resultados.forEach((r) => {
      (r.articles || []).forEach((a) => {
        if (vistos.has(a.id)) return;
        vistos.add(a.id);
        pool.push(a);
      });
    });

    if (!pool.length) { cont.innerHTML = ""; return; }
    NOTICIAS_SIMILARES_POOL = pool;
    pintarNoticiasSimilares();
    // ItemList con las relacionadas ayuda a Google a entender el enlazado
    // interno alrededor de esta noticia (no es tan crítico como el
    // NewsArticle/BreadcrumbList, pero es gratis tenerlo ya con los datos
    // que se acaban de pedir). Se limita a las primeras 6 del pool, no
    // solo a las 3 que se ven ahora mismo, para no tener que
    // reconstruirlo cada vez que se pulsa "Ver otras".
    _seoInsertarJsonLd("seo-jsonld-relacionadas", {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Noticias relacionadas",
      "itemListElement": pool.slice(0, 6).map((a, i) => ({
        "@type": "ListItem",
        "position": i + 1,
        "url": _seoUrlAbsoluta(urlNoticia(a.categoria, a.slug)),
      })),
    });
  } catch (err) {
    cont.innerHTML = "";
  }
}

// Elige hasta 3 noticias al azar del pool (sin repetir las que ya se
// estén mostrando, mientras el pool dé para ello) y las pinta. Se llama
// tanto al cargar la página como cada vez que se pulsa "Ver otras".
function pintarNoticiasSimilares() {
  const cont = document.getElementById("noticiasSimilares");
  if (!cont || !NOTICIAS_SIMILARES_POOL.length) return;

  const disponibles = NOTICIAS_SIMILARES_POOL.filter((a) => !NOTICIAS_SIMILARES_MOSTRADAS.includes(a.id));
  const candidatas = disponibles.length >= 3 ? disponibles : NOTICIAS_SIMILARES_POOL;
  const elegidas = [...candidatas].sort(() => Math.random() - 0.5).slice(0, 3);
  NOTICIAS_SIMILARES_MOSTRADAS = elegidas.map((a) => a.id);

  const hayMasDeTres = NOTICIAS_SIMILARES_POOL.length > 3;
  cont.innerHTML = `
    <div class="similares-cabecera">
      <h2 class="section-title" style="margin:0;">Noticias similares</h2>
      ${hayMasDeTres ? `<button type="button" class="btn-ver-otras-similares" onclick="pintarNoticiasSimilares()">Ver otras ↻</button>` : ""}
    </div>
    <div class="grid-noticias grid-similares">
      ${elegidas.map(cardSimilarHTML).join("")}
    </div>`;
}

function cardSimilarHTML(a) {
  // Misma lógica que las tarjetas de portada (js/foco.js): el foco es el de
  // la foto que realmente se muestra, también cuando sale del collage.
  const portada = EOF_FOCO.portadaDeArticulo(a);
  const img = portada.url || "img/default.jpg";
  return `
    <a class="card" data-art-id="${Number(a.id) || ''}" href="${urlNoticia(a.categoria, a.slug)}">
      ${EOF_FOCO.img({ src: img, alt: a.titulo, foco: portada.foco })}
      <div class="cbody">
        <span class="cat">${categoriaLabel(a.categoria)}${clubArticuloLegible(a.club) ? " · " + escapeHtml(clubArticuloLegible(a.club)) : ""}</span>
        <h3>${escapeHtml(a.titulo)}</h3>
        <p>${escapeHtml(resumText(a.subtitulo || a.contenido, 100))}</p>
        <span class="meta">${formatFecha(a.fecha_publicacion)}</span>
      </div>
    </a>`;
}

// Activa/inicializa la barra de progreso de lectura una sola vez (aunque
// renderizaArticulo() se llame varias veces, p. ej. al recibir una
// actualización en vivo por BroadcastChannel en modo preview). Calcula el
// % en base al propio <main id="contenidoArticulo">, no a la página
// entera, para que el progreso llegue a 100% justo al terminar el
// artículo y no se quede corto por el footer/comentarios de debajo.
function iniciarBarraProgresoLectura() {
  const barra = document.getElementById("barraProgresoLectura");
  const relleno = document.getElementById("barraProgresoLecturaRelleno");
  // Solo el cuerpo de texto del artículo (".article-body"): ni la
  // cabecera (foto/título/meta) ni lo que va después (galería final,
  // tweets sueltos, encuesta, comentarios, "más noticias"...) cuentan
  // para el progreso -- la barra debe llegar al 100% justo al acabar de
  // leer el texto, no al llegar al final de toda la página.
  const cuerpo = document.querySelector(".article-body");
  if (!barra || !relleno || !cuerpo) return;
  barra.classList.add("activa");

  let actualizarProgramado = false;
  function actualizar() {
    actualizarProgramado = false;
    // Posición real del cuerpo en el documento (getBoundingClientRect en
    // vez de offsetTop, que depende del ancestro posicionado) y altura de
    // ventana visible estable en móvil (clientHeight no salta cuando la
    // barra de direcciones se oculta/muestra, a diferencia de innerHeight).
    const scrollY = Math.max(0, window.scrollY || window.pageYOffset || 0);
    const alturaVentana = document.documentElement.clientHeight || window.innerHeight;
    const inicio = cuerpo.getBoundingClientRect().top + scrollY;
    const alturaCuerpo = cuerpo.offsetHeight;
    const finLectura = inicio + alturaCuerpo - alturaVentana;
    const recorrido = scrollY - inicio;
    let porcentaje = finLectura > inicio ? (recorrido / (finLectura - inicio)) * 100 : 100;
    // Abajo del todo de la página (también con el rebote/overscroll de iOS)
    // la barra siempre queda completa, nunca a medias.
    const alFinalDePagina = scrollY + alturaVentana >= document.documentElement.scrollHeight - 2;
    if (alFinalDePagina && scrollY > inicio) porcentaje = 100;
    porcentaje = Math.max(0, Math.min(100, Math.round(porcentaje)));
    relleno.style.width = porcentaje + "%";
  }
  function pedirActualizacion() {
    if (actualizarProgramado) return;
    actualizarProgramado = true;
    requestAnimationFrame(actualizar);
  }

  // Evita reenganchar los listeners globales si ya se había iniciado
  // antes (caso preview con varias actualizaciones por BroadcastChannel).
  if (!window._barraProgresoLecturaListo) {
    window.addEventListener("scroll", pedirActualizacion, { passive: true });
    window.addEventListener("resize", pedirActualizacion, { passive: true });
    window._barraProgresoLecturaListo = true;
  }

  // Las fotos DENTRO del cuerpo cargan en lazy y pueden cambiar su altura
  // real bastante después del primer cálculo: se recalcula al ir
  // terminando de cargar cada una para que la barra no se quede corta o
  // llegue al 100% antes de tiempo. Las fotos de la galería final quedan
  // fuera a propósito (no forman parte de ".article-body").
  cuerpo.querySelectorAll("img").forEach((img) => {
    if (img.complete) return;
    img.addEventListener("load", pedirActualizacion, { once: true });
  });

  actualizar();
}

function renderizaArticulo(article) {
  const cont = document.getElementById("contenidoArticulo");
  ARTICULO_ACTUAL = article;
  // El resto de páginas del sitio marcan en el <body> a qué sección del
  // menú superior pertenecen (data-page="calendario", "inicio"...) y
  // renderHeader() usa justo ese atributo para resaltar el ítem activo
  // (fondo celeste + borde inferior). noticia.html es la única página
  // que no lo llevaba fijo en el HTML porque su sección depende de la
  // categoría del artículo, que no se conoce hasta que llega de la API:
  // por eso el menú se veía "plano", sin nada resaltado, a diferencia
  // del resto de la web. Se fija aquí en cuanto se conoce la categoría
  // y se repinta el header para que el resaltado se aplique.
  if (article.categoria) {
    document.body.dataset.page = article.categoria;
    const headerEl = document.getElementById("site-header");
    if (headerEl && typeof renderHeader === "function") {
      headerEl.innerHTML = renderHeader();
      if (typeof pintarFechaHoy === "function") pintarFechaHoy();
      if (typeof reengancharMenu === "function") reengancharMenu();
      if (typeof inicializarBusquedaEnVivo === "function") inicializarBusquedaEnVivo();
    }
  }
  // Si se entra con ?lang=xx (por ejemplo desde un resultado de búsqueda
  // que apuntaba a la variante hreflang de ese idioma), se respeta como
  // idioma inicial; si no está disponible, aplicarIdiomaNoticia hará el
  // fallback a castellano igualmente.
  const idiomaUrl = new URLSearchParams(location.search).get("lang");
  IDIOMA_NOTICIA_ACTUAL = (idiomaUrl && IDIOMAS_NOTICIA.some((i) => i.cod === idiomaUrl)) ? idiomaUrl : "es";
  try {

    // Fotos: cada una (salvo la portada, que siempre se muestra arriba del
    // todo) lleva guardada la posición donde debe aparecer dentro de la
    // noticia ("inicio"/"medio"/"final" del texto, o "galeria" al final)
    // y el punto que no se debe recortar nunca ("foco"). Se admite también
    // el formato antiguo (solo URLs, sin posición ni foco) para las
    // noticias guardadas antes de tener este control.
    const normalizarImagen = (img) =>
      typeof img === "string" ? { url: img, posicion: "galeria", foco: "50% 50%" } : img;
    // Tras fusionar noticias el array puede llegar como texto JSON, con huecos
    // (null) o con entradas sin URL: se sanea para que una sola entrada rara no
    // rompa el pintado de TODA la noticia ni haga desaparecer el resto de fotos.
    let imagenesBrutas = article.imagenes;
    if (typeof imagenesBrutas === "string") { try { imagenesBrutas = JSON.parse(imagenesBrutas); } catch { imagenesBrutas = []; } }
    const imagenesArticulo = (Array.isArray(imagenesBrutas) ? imagenesBrutas : [])
      .filter((v) => v && (typeof v === "string" ? v.trim() : (v.url || v.tipo === "tweet")))
      .map(normalizarImagen);
    // Los tweets incrustados viven en el mismo array que las fotos (ver
    // normalizarImagenes en el worker), marcados con tipo:"tweet"; se
    // separan aquí para no tratarlos como una foto más (no tienen foco,
    // no entran en collages ni en la galería visual de fotos).
    const tweetsArticulo = imagenesArticulo.filter((v) => v && v.tipo === "tweet");
    // Clave para saber si dos URLs son la misma foto de Cloudinary aunque
    // cambie la transformación (w_900, f_auto...), la versión (v123) o la
    // query string (misma lógica que claveImagenFusion del Worker).
    const claveFoto = (url) => {
      const u = String(url == null ? "" : url).trim();
      if (!u) return "";
      const limpia = u.split(/[?#]/)[0];
      const m = limpia.match(/^https?:\/\/res\.cloudinary\.com\/([^/]+)\/(?:image|video)\/upload\/(.+)$/i);
      if (!m) return limpia.replace(/^http:/i, "https:");
      const partes = m[2].split("/");
      // Se quitan solo las transformaciones (w_900, f_auto,q_auto...) y la versión
      // (v123). Si hay versión, TODO lo anterior es transformación; si no, solo los
      // tramos con coma o con parámetros conocidos de Cloudinary. Antes también se
      // recortaban carpetas tipo "eof_cronicas/", y dos fotos distintas con el mismo
      // nombre de archivo en carpetas distintas contaban como la misma y se perdía una.
      const iVer = partes.findIndex((x) => /^v\d+$/.test(x));
      if (iVer > -1 && iVer < partes.length - 1) partes.splice(0, iVer + 1);
      else while (partes.length > 1 && (partes[0].includes(",") || /^(?:w|h|c|f|q|g|ar|dpr|e|a|b|bo|co|o|r|x|y|z|fl|l|t|u|e|pg)_[^/]+$/i.test(partes[0]))) partes.shift();
      return m[1] + "/" + partes.join("/").replace(/\.[a-z0-9]{2,4}$/i, "");
    };
    // Una misma foto no debe salir dos veces (p. ej. al fusionar previas o
    // crónicas del mismo partido): se queda la primera aparición.
    const clavesVistas = new Set();
    const galeria = imagenesArticulo.filter((v) => {
      if (v && v.tipo === "tweet") return false;
      const k = claveFoto(v && v.url);
      if (!k) return true;
      if (clavesVistas.has(k)) return false;
      clavesVistas.add(k);
      return true;
    });
    const portadaUrl = article.imagen_url || (galeria[0] && galeria[0].url) || "";

    // La portada siempre existe como foto (tarjetas, hero por defecto...) y
    // debe mostrarse siempre como la foto grande de cabecera, arriba del
    // todo. Si no aparece ya en el array con una posición propia, se añade
    // como "cabecera" para no perderla (fallback antiguo). Pero si SÍ
    // aparece en el array y su posición es "galeria" (el valor por defecto
    // al subir una foto, o el que arrastran noticias/collages antiguos),
    // antes se dejaba tal cual: como esa foto ya "estaba en el array", no
    // se la marcaba como cabecera, así que fotoHTML.posicion seguía siendo
    // "galeria" y la portada acababa mezclada dentro de la galería inferior
    // (posiblemente MÁS DE UNA vez si además de portada era la primera
    // galeria[0]) en vez de destacada arriba, y la cabecera se quedaba
    // vacía -aunque la noticia sí tuviera fotos guardadas, arriba no se
    // veía ninguna-. Se reescribe aquí su posición a "cabecera" (sin
    // moverla de sitio en el array, solo cambiar cómo se clasifica más
    // abajo) para que la portada sea SIEMPRE la foto de cabecera, tenga la
    // posición que tenga guardada, salvo que el redactor la haya puesto a
    // propósito dentro del texto ("inicio"/"personalizada"), caso en el
    // que ya tiene sentido propio ahí y no se toca.
    let fotos = galeria.map((f) => {
      if (f.url === portadaUrl && f.posicion !== "inicio" && f.posicion !== "personalizada") {
        return { ...f, posicion: "cabecera" };
      }
      return f;
    });
    if (portadaUrl && !fotos.some((f) => f.url === portadaUrl)) {
      fotos = [{ url: portadaUrl, posicion: "cabecera", foco: "50% 50%" }, ...fotos];
    }

    // Repetidas por CONTENIDO (la misma foto subida dos veces por redactores
    // distintos es otro archivo y la comparación por URL no la ve). Se conserva
    // la de más peso en la página: portada > inicio > texto > collage > galería >
    // galería del fotógrafo. Solo actúa con huellas ya calculadas (precalentarHashesFotos).
    const dupContenido = crearDedupPorContenido();
    dupContenido.registrar(portadaUrl);
    {
      const rango = { cabecera: 0, inicio: 1, personalizada: 2, medio: 2, final: 2, collage: 3, galeria: 4 };
      const quitar = new Set();
      fotos.map((f, i) => ({ f, i }))
        .sort((a, b) => ((rango[a.f.posicion] ?? 4) - (rango[b.f.posicion] ?? 4)) || (a.i - b.i))
        .forEach(({ f }) => { if (f.url !== portadaUrl && dupContenido.repetida(f.url)) quitar.add(f); });
      if (quitar.size) fotos = repararCollagesTrasDedupe(fotos.filter((f) => !quitar.has(f)));
    }

    const fotoHTML = (f) =>
      `<div class="article-img">${EOF_FOCO.img({ src: f.url, alt: article.titulo, foco: f.foco, fallback: "" })}</div>`;

    const cabecera = fotos.filter((f) => f.posicion === "cabecera");
    const deTexto = { inicio: [], personalizada: [], collage: [] };
    fotos.forEach((f) => {
      // Las noticias antiguas guardadas con "medio" o "final" se siguen
      // mostrando dentro del texto, tratándolas como personalizadas.
      const posicion = (f.posicion === "medio" || f.posicion === "final") ? "personalizada" : f.posicion;
      if (deTexto[posicion]) deTexto[posicion].push(f);
    });
    const deGaleriaTodas = fotos.filter((f) => f.posicion === "galeria");
    const deGaleriaCollages = agruparEnCollages(deGaleriaTodas.filter((f) => f.grupo));
    // Fase 14: además de las fotos subidas junto con la noticia, se añaden
    // aquí (al final) las fotos del fotógrafo vinculadas vía galería de
    // partido o banco de media (article_media, ver Fase 12/13). Llevan su
    // propio crédito (el autor real de la foto en la tabla media), así
    // que se muestran en el mismo carrusel de galería en vez de crear un
    // bloque visual aparte.
    const clavesPintadas = new Set(fotos.map((f) => claveFoto(f.url)).concat([claveFoto(portadaUrl)]).filter(Boolean));
    const galeriaFotografo = (Array.isArray(article.galeria_fotografo) ? article.galeria_fotografo : []).filter((f) => {
      const k = claveFoto(f && f.url);
      if (!k) return true;
      if (clavesPintadas.has(k)) return false;
      clavesPintadas.add(k);
      return !(f && f.url && dupContenido.repetida(f.url));
    });
    const deGaleria = deGaleriaTodas.filter((f) => !f.grupo).concat(galeriaFotografo);

    // Tweets: mismo esquema de posición que las fotos ("inicio"/
    // "personalizada" se intercalan en el texto; "galeria" para un tweet
    // no significa carrusel de fotos, sino "al final del cuerpo", justo
    // antes de la galería de imágenes si la hay.
    const tweetsDeTexto = { inicio: [], personalizada: [] };
    const tweetsAlFinal = [];
    tweetsArticulo.forEach((t) => {
      if (tweetsDeTexto[t.posicion]) tweetsDeTexto[t.posicion].push(t);
      else tweetsAlFinal.push(t);
    });
    deTexto.inicio = (deTexto.inicio || []).concat(tweetsDeTexto.inicio.map((t) => ({ ...t, esTweet: true })));
    deTexto.personalizada = (deTexto.personalizada || []).concat(tweetsDeTexto.personalizada.map((t) => ({ ...t, esTweet: true })));

    // Se guarda para poder recalcular el cuerpo al cambiar de idioma (las
    // fotos y tweets de posición son los mismos en todos los idiomas,
    // solo cambia el texto que se intercala entre ellos).
    FOTOS_DE_TEXTO_ACTUAL = deTexto;

    const cuerpoOriginal = sanearHtmlContenido(article.contenido || "");
    const cuerpoConFotos = construirCuerpoConFotos(deTexto, cuerpoOriginal);
    const tweetsAlFinalHTML = tweetsAlFinal.map(tweetEmbedHTML).join("");

    cont.innerHTML = `
      <div class="article-header">
        <span class="cat">${categoriaLabel(article.categoria)}${clubArticuloLegible(article.club) ? " · " + escapeHtml(clubArticuloLegible(article.club)) : ""}</span>
        ${Array.isArray(article.categorias_adicionales) && article.categorias_adicionales.length ? `
        <div class="cats-adicionales">
          ${article.categorias_adicionales.map((c) => `<span class="cat-adicional">${categoriaLabel(c)}</span>`).join("")}
        </div>` : ""}
        <h1>${escapeHtml(article.titulo)}</h1>
        ${article.subtitulo ? `<p class="subtitulo">${escapeHtml(article.subtitulo)}</p>` : ""}
        <p class="meta">${formatFecha(article.fecha_publicacion)}${fechaUltimaEdicionHTML(article)}${firmaAutoresHTML(article)}</p>
        ${!ES_PREVIEW && article.id ? `<div class="lect-acciones" id="lectAccionesNoticia"></div>` : ""}
      </div>
      ${selectorIdiomaHTML(article)}
      ${cabecera.length ? `
        <div class="article-img">
          ${EOF_FOCO.img({ src: cloudinaryOptimizada(cabecera[0].url, 900), alt: article.titulo, foco: cabecera[0].foco, eager: true, fallback: "", extra: 'id="fotoPrincipal"' })}
          ${creditoFotoHTML(cabecera[0])}
        </div>` : ""}
      ${article.resultado ? marcadorArticuloHTML({ ...article.resultado, alineaciones: article.alineaciones }) : ""}
      <div class="article-body">${cuerpoConFotos}</div>
      ${tweetsAlFinalHTML}
      ${deGaleriaCollages.length ? `
        <div class="article-galeria-collages">
          ${deGaleriaCollages.map((c) => c.html).join("")}
        </div>` : ""}
      ${deGaleria.length ? `
        <div class="article-galeria">
          <p class="article-galeria-titulo">Galería<span class="contador-galeria" id="galeriaContadorTitulo">1 / ${deGaleria.length}</span></p>
          <div class="article-galeria-principal">
            ${deGaleria.length > 1 ? `<button type="button" class="article-galeria-flecha prev" id="galeriaPrev" aria-label="Foto anterior">&#10094;</button>` : ""}
            ${EOF_FOCO.img({ src: cloudinaryOptimizada(deGaleria[0].url, 900), alt: "Foto 1", foco: deGaleria[0].foco, eager: true, fallback: "", extra: 'id="fotoGaleriaPrincipal" onload="this.classList.add(\'cargada\')"' })}
            ${deGaleria.length > 1 ? `<button type="button" class="article-galeria-flecha next" id="galeriaNext" aria-label="Foto siguiente">&#10095;</button>` : ""}
            ${deGaleria.length > 1 ? `<span class="article-galeria-contador-flotante" id="galeriaContadorFlotante">1 / ${deGaleria.length}</span>` : ""}
          </div>
          <span id="galeriaCreditoActual" class="credito-foto credito-foto-galeria">${deGaleria[0].credito ? escapeHtml(deGaleria[0].credito) : ""}</span>
          <div class="miniaturas" id="miniaturasGaleria">
            ${deGaleria.map((f, i) => `<img src="${cloudinaryOptimizada(f.url, 140)}" alt="Foto ${i + 1}" loading="lazy" class="foco-img${i === 0 ? " activa" : ""}" style="${EOF_FOCO.estilo(f.foco)}" data-src="${cloudinaryOptimizada(f.url, 900)}" data-foco="${EOF_FOCO.texto(f.foco)}" data-credito="${f.credito ? escapeHtml(f.credito) : ""}">`).join("")}
          </div>
        </div>` : ""}
      ${article.tipo === "cronica" ? fichaTecnicaArticuloHTML(article.ficha_tecnica) : ""}
      <div id="ad-final-noticia">${adSlot("noticia_final")}</div>
      ${article.id ? `<div id="encuestaArticuloWrap"></div>` : ""}
      ${compartirArticuloHTML(article)}
      ${!ES_PREVIEW && article.id ? seccionComentariosHTML() : ""}
      <section id="noticiasSimilares" class="noticias-similares"></section>
    `;

    // "cont" entero, no solo ".article-body": los tweets/posts con
    // posición "galería final" se insertan justo después del cuerpo, como
    // hermanos de .article-body, no dentro.
    cargarEmbedsRedesSiHaceFalta(cont);
    ocultarFotosRepetidas(cont);
    cargarNoticiasSimilares(article);
    if (article.id) cargarEncuestaNoticia(article.id);
    if (typeof insertarAdIntext === "function") insertarAdIntext(cont.querySelector(".article-body"));
    if (typeof initAds === "function") initAds();
    if (!ES_PREVIEW && article.id) iniciarComentarios(article.id);
    // Guardadas e historial (js/lecturas.js): botón "Guardar para leer luego" y
    // registro de esta lectura. Nunca en la vista previa del panel.
    if (!ES_PREVIEW && article.id && window.EOFLecturas) {
      EOFLecturas.montarBotonNoticia(document.getElementById("lectAccionesNoticia"), article.id);
      EOFLecturas.registrarLectura(article.id);
    }
    revelarBotonCompartirNativo();

    const selectorIdioma = document.querySelector(".selector-idioma-noticia");
    if (selectorIdioma) {
      centrarIdiomaActivo();
      selectorIdioma.addEventListener("click", (e) => {
        const btn = e.target.closest(".idioma-noticia-btn");
        if (!btn || btn.disabled) return;
        aplicarIdiomaNoticia(btn.dataset.idioma);
      });
    }

    const fotoPrincipal = document.getElementById("fotoPrincipal");

    // Galería final: foto grande con flechas prev/next, contador y tira de
    // miniaturas sincronizada, en vez de solo un grid de miniaturas suelto.
    const miniaturas = document.getElementById("miniaturasGaleria");
    const fotoGaleria = document.getElementById("fotoGaleriaPrincipal");
    if (miniaturas && fotoGaleria) {
      const imgsMini = [...miniaturas.querySelectorAll("img[data-src]")];
      const contadorTitulo = document.getElementById("galeriaContadorTitulo");
      const contadorFlotante = document.getElementById("galeriaContadorFlotante");
      let indiceGaleria = 0;

      function mostrarFotoGaleria(i) {
        indiceGaleria = (i + imgsMini.length) % imgsMini.length;
        const img = imgsMini[indiceGaleria];
        fotoGaleria.classList.remove("cargada");
        fotoGaleria.src = img.dataset.src;
        fotoGaleria.alt = img.alt;
        EOF_FOCO.aplicar(fotoGaleria, img.dataset.foco);
        imgsMini.forEach((m) => m.classList.remove("activa"));
        img.classList.add("activa");
        img.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
        const texto = `${indiceGaleria + 1} / ${imgsMini.length}`;
        if (contadorTitulo) contadorTitulo.textContent = texto;
        if (contadorFlotante) contadorFlotante.textContent = texto;
        const creditoActual = document.getElementById("galeriaCreditoActual");
        if (creditoActual) creditoActual.textContent = img.dataset.credito || "";
      }

      miniaturas.addEventListener("click", (e) => {
        const img = e.target.closest("img[data-src]");
        if (!img) return;
        mostrarFotoGaleria(imgsMini.indexOf(img));
      });

      const btnPrev = document.getElementById("galeriaPrev");
      const btnNext = document.getElementById("galeriaNext");
      if (btnPrev) btnPrev.addEventListener("click", () => mostrarFotoGaleria(indiceGaleria - 1));
      if (btnNext) btnNext.addEventListener("click", () => mostrarFotoGaleria(indiceGaleria + 1));
    }

    // Pinta el título/subtítulo/cuerpo en el idioma inicial (el pedido por
    // ?lang= si estaba disponible, si no castellano) y con ello fija todo
    // el SEO (lang, meta, hreflang, og:locale, JSON-LD). No se toca la URL
    // aquí: si ya traía ?lang=xx se deja como está, y si no llevaba nada
    // no hace falta añadir "?lang=es" por defecto.
    aplicarIdiomaNoticia(IDIOMA_NOTICIA_ACTUAL, { actualizarUrl: false });

    // Barra de % leído: se activa aquí, ya con el artículo pintado en el
    // DOM (fotos/tweets incluidos), para que offsetHeight refleje la
    // altura real del artículo y no la de "Cargando...".
    iniciarBarraProgresoLectura();
  } catch (err) {
    cont.innerHTML = estadoHTML({
      titulo: "No se ha podido cargar la noticia",
      texto: "Puede que la noticia ya no exista o que haya un problema de conexión. Vuelve a la portada e inténtalo de nuevo.",
      tipo: "error",
      cta: `<a href="/" class="btn-volver">Ir a portada</a>`,
    });
  }
}
// ---------- Encuesta de la noticia (si tiene una vinculada) ----------
async function cargarEncuestaNoticia(articleId) {
  const wrap = document.getElementById("encuestaArticuloWrap");
  if (!wrap) return;
  try {
    const res = await apiFetchLector(`/api/articles/${articleId}/poll`);
    const { encuesta } = await res.json();
    if (!encuesta) { wrap.remove(); return; }
    pintarEncuesta(wrap, encuesta, "");
  } catch (err) {
    // Si falla, simplemente no se muestra la encuesta: no es contenido
    // crítico de la noticia como para mostrar un aviso de error aparte.
    wrap.remove();
  }
}
