// Identificador anónimo del visitante para votos/denuncias: no es una
// cuenta, solo evita votar/denunciar dos veces el mismo comentario desde
// el mismo navegador. Se genera una vez y se guarda en localStorage.
function idVotanteComentarios() {
  const CLAVE = "eof_votante_id";
  let id = localStorage.getItem(CLAVE);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
    localStorage.setItem(CLAVE, id);
  }
  return id;
}

function votoActualComentario(id) {
  try {
    return JSON.parse(localStorage.getItem("eof_votos_comentarios") || "{}")[id] || 0;
  } catch { return 0; }
}
function guardarVotoComentario(id, valor) {
  let votos = {};
  try { votos = JSON.parse(localStorage.getItem("eof_votos_comentarios") || "{}"); } catch {}
  if (valor === 0) delete votos[id]; else votos[id] = valor;
  localStorage.setItem("eof_votos_comentarios", JSON.stringify(votos));
}
function comentarioYaDenunciado(id) {
  try {
    return (JSON.parse(localStorage.getItem("eof_denuncias_comentarios") || "[]")).includes(id);
  } catch { return false; }
}
function marcarComentarioDenunciado(id) {
  let lista = [];
  try { lista = JSON.parse(localStorage.getItem("eof_denuncias_comentarios") || "[]"); } catch {}
  if (!lista.includes(id)) lista.push(id);
  localStorage.setItem("eof_denuncias_comentarios", JSON.stringify(lista));
}

function comentarioItemHTML(c) {
  const esRespuesta = !!c.parent_id;
  // Solo se indica a quién se contesta cuando no es el comentario raíz del hilo
  // (en una respuesta directa ya se ve por la sangría).
  const enRespuestaA = esRespuesta && c.responde_a_nombre && c.responde_a_id !== c.parent_id
    ? `<span class="comentario-en-respuesta">en respuesta a ${escapeHtml(c.responde_a_nombre)}</span>` : "";
  const inicial = (c.nombre || "?").trim().charAt(0);
  const votoActual = votoActualComentario(c.id);
  const denunciado = comentarioYaDenunciado(c.id);
  const insigniaVerificado = c.reader_id ? `<span class="comentario-verificado" title="Cuenta verificada"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2l2.4 2.3 3.2-.6 1 3.1 3.1 1-.6 3.2L23.4 13l-2.3 2.4.6 3.2-3.1 1-1 3.1-3.2-.6L12 24l-2.4-2.3-3.2.6-1-3.1-3.1-1 .6-3.2L.6 13l2.3-2.4-.6-3.2 3.1-1 1-3.1 3.2.6z"/><path d="M8.5 12.3l2.4 2.4 4.6-4.7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : "";
  return `
    <div class="comentario-item${esRespuesta ? " comentario-item-respuesta" : ""}" id="comentario-${c.id}" data-comentario-id="${c.id}" data-autor="${escapeHtml(c.nombre)}">
      <div class="comentario-avatar">${escapeHtml(inicial)}</div>
      <div class="comentario-cuerpo">
        <div class="comentario-cabecera">
          <span class="comentario-autor">${escapeHtml(c.nombre)}${insigniaVerificado}</span>
          <span class="comentario-fecha">${formatFecha(c.created_at)}</span>
        </div>
        ${enRespuestaA}
        <p class="comentario-texto">${escapeHtml(c.texto)}</p>
        <div class="comentario-acciones">
          <button type="button" class="comentario-voto comentario-voto-like${votoActual === 1 ? " activo" : ""}" data-voto="1" title="Me gusta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 22V11m0 11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3m3 0h6.31a2 2 0 0 1 1.98 2.28l-.7 5a2 2 0 0 1-1.98 1.72H10m3-11V6a2 2 0 0 0-4 0v1a3 3 0 0 1-3 3"/></svg>
            <span class="comentario-voto-num">${c.likes || 0}</span>
          </button>
          <button type="button" class="comentario-voto comentario-voto-dislike${votoActual === -1 ? " activo" : ""}" data-voto="-1" title="No me gusta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2v11m0-11h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-3m-3 0H7.69a2 2 0 0 1-1.98-2.28l.7-5a2 2 0 0 1 1.98-1.72H14v11z"/></svg>
            <span class="comentario-voto-num">${c.dislikes || 0}</span>
          </button>
          <button type="button" class="comentario-responder" title="Responder a ${escapeHtml(c.nombre)}">Responder</button>
          <button type="button" class="comentario-denunciar${denunciado ? " activo" : ""}" ${denunciado ? "disabled" : ""}>
            ${denunciado ? "Denunciado" : "Denunciar"}
          </button>
        </div>
      </div>
    </div>`;
}

// Agrupa los comentarios en hilos: cada comentario raíz seguido de sus
// respuestas (en orden de publicación), todas dentro de un mismo bloque.
function comentariosEnHilosHTML(comentarios) {
  const respuestas = new Map();
  for (const c of comentarios) {
    if (!c.parent_id) continue;
    if (!respuestas.has(c.parent_id)) respuestas.set(c.parent_id, []);
    respuestas.get(c.parent_id).push(c);
  }
  return comentarios.filter((c) => !c.parent_id).map((raiz) => {
    const hijas = respuestas.get(raiz.id) || [];
    return `<div class="comentario-hilo">${comentarioItemHTML(raiz)}${
      hijas.length ? `<div class="comentario-respuestas">${hijas.map(comentarioItemHTML).join("")}</div>` : ""
    }</div>`;
  }).join("");
}

async function iniciarComentarios(articleId) {
  const lista = document.getElementById("listaComentarios");
  const contador = document.getElementById("comentariosContador");

  iniciarBotonCerrarSesionLector();

  // Si hay sesión de lector, ya no hace falta pedir nombre/email a mano
  // en cada comentario: se ocultan esos dos campos y se rellenan solos
  // con los datos ya verificados de la cuenta.
  const lector = sesionLectorActual();
  if (lector) {
    const fila = document.getElementById("filaDatosComentario");
    if (fila) fila.style.display = "none";
    const campoNombre = document.getElementById("comentarioNombre");
    const campoEmail = document.getElementById("comentarioEmail");
    if (campoNombre) { campoNombre.value = lector.nombre; campoNombre.required = false; }
    if (campoEmail) { campoEmail.value = lector.email; campoEmail.required = false; }
  }

  const ayudaComentario = document.querySelector("#formComentario .comentario-ayuda");
  if (ayudaComentario) {
    ayudaComentario.textContent = lector
      ? "Se publicará en cuanto lo revise la redacción. Te avisaremos por correo cuando se publique y cuando te respondan (puedes cambiarlo en Mi cuenta)."
      : "Se publicará en cuanto lo revise la redacción. Con una cuenta de lector te avisamos por correo cuando te respondan.";
  }

  // ---- Responder a un comentario ----
  // El formulario es único (con su captcha): al pulsar "Responder" se anota a
  // quién se contesta, se muestra el aviso "Respondiendo a ..." y se lleva a
  // la persona al formulario.
  let respondiendoA = null;
  const formRespuesta = document.getElementById("formComentario");
  const bannerRespuesta = document.getElementById("comentarioRespondiendo");
  function iniciarRespuesta(id, nombre) {
    respondiendoA = { id, nombre };
    document.getElementById("comentarioRespondiendoNombre").textContent = nombre;
    bannerRespuesta.hidden = false;
    document.getElementById("comentarioTextoEtiqueta").textContent = "Tu respuesta";
    document.getElementById("comentarioTexto").placeholder = "Escribe tu respuesta...";
    formRespuesta.querySelector(".btn-enviar-comentario").textContent = "Enviar respuesta";
    formRespuesta.scrollIntoView({ behavior: "smooth", block: "center" });
    document.getElementById("comentarioTexto").focus({ preventScroll: true });
  }
  function cancelarRespuesta() {
    respondiendoA = null;
    bannerRespuesta.hidden = true;
    document.getElementById("comentarioTextoEtiqueta").textContent = "Comentario";
    document.getElementById("comentarioTexto").placeholder = "Escribe tu comentario...";
    formRespuesta.querySelector(".btn-enviar-comentario").textContent = "Enviar comentario";
  }
  document.getElementById("comentarioRespondiendoCancelar").addEventListener("click", cancelarRespuesta);

  async function cargarComentarios() {
    try {
      const res = await apiFetch(`/api/articles/${articleId}/comments`);
      const { comentarios = [] } = await res.json();
      contador.textContent = comentarios.length ? ` (${comentarios.length})` : "";
      lista.innerHTML = comentarios.length
        ? comentariosEnHilosHTML(comentarios)
        : `<p class="comentarios-vacio">Sé el primero en comentar esta noticia.</p>`;
      // Enlace de un aviso por correo (#comentario-123): se lleva a ese comentario.
      const ancla = /^#comentario-(\d+)$/.exec(location.hash);
      const destino = ancla && document.getElementById(`comentario-${ancla[1]}`);
      if (destino) {
        destino.scrollIntoView({ block: "center" });
        destino.classList.add("comentario-destacado");
      }
    } catch (err) {
      lista.innerHTML = `<p class="comentarios-vacio">No se han podido cargar los comentarios.</p>`;
    }
  }

  lista.addEventListener("click", async (e) => {
    const item = e.target.closest(".comentario-item");
    if (!item) return;
    const comentarioId = parseInt(item.dataset.comentarioId);

    if (e.target.closest(".comentario-responder")) {
      iniciarRespuesta(comentarioId, item.dataset.autor || "");
      return;
    }

    const btnVoto = e.target.closest(".comentario-voto");
    if (btnVoto) {
      const valorClic = parseInt(btnVoto.dataset.voto);
      const valorPrevio = votoActualComentario(comentarioId);
      const nuevoValor = valorPrevio === valorClic ? 0 : valorClic;
      btnVoto.disabled = true;
      try {
        const res = await apiFetch(`/api/comments/${comentarioId}/vote`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ votanteId: idVotanteComentarios(), valor: nuevoValor }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "No se ha podido votar");
        guardarVotoComentario(comentarioId, nuevoValor);
        item.querySelector(".comentario-voto-like .comentario-voto-num").textContent = data.likes || 0;
        item.querySelector(".comentario-voto-dislike .comentario-voto-num").textContent = data.dislikes || 0;
        item.querySelector(".comentario-voto-like").classList.toggle("activo", nuevoValor === 1);
        item.querySelector(".comentario-voto-dislike").classList.toggle("activo", nuevoValor === -1);
      } catch (err) {
        // silencioso: un fallo al votar no debe interrumpir la lectura
      } finally {
        btnVoto.disabled = false;
      }
      return;
    }

    const btnDenunciar = e.target.closest(".comentario-denunciar");
    if (btnDenunciar && !btnDenunciar.disabled) {
      if (!confirm("¿Denunciar este comentario para que la redacción lo revise?")) return;
      btnDenunciar.disabled = true;
      try {
        const res = await apiFetch(`/api/comments/${comentarioId}/report`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ votanteId: idVotanteComentarios() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "No se ha podido denunciar");
        marcarComentarioDenunciado(comentarioId);
        btnDenunciar.textContent = "Denunciado";
        btnDenunciar.classList.add("activo");
      } catch (err) {
        btnDenunciar.disabled = false;
        alert(err.message);
      }
    }
  });

  const form = document.getElementById("formComentario");
  const msgOk = document.getElementById("comentarioOk");
  const msgErr = document.getElementById("comentarioError");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgOk.style.display = "none";
    msgErr.style.display = "none";
    const nombre = document.getElementById("comentarioNombre").value.trim();
    const email = document.getElementById("comentarioEmail").value.trim();
    const texto = document.getElementById("comentarioTexto").value.trim();
    const contTurnstile = form.querySelector("[data-eof-turnstile]");
    const btn = form.querySelector(".btn-enviar-comentario");
    const textoBtn = btn.textContent;
    btn.disabled = true;
    // Con sesión de lector el servidor no pide captcha: no hace falta esperar el token.
    const turnstileToken = sesionLectorActual() ? "" : await (btn.textContent = "Verificando...", window.EOFTurnstile.esperarToken(contTurnstile));
    btn.textContent = textoBtn;
    try {
      const lectorActual = sesionLectorActual();
      const headers = { "Content-Type": "application/json" };
      if (lectorActual) headers.Authorization = `Bearer ${tokenLectorActual()}`;
      const res = await apiFetch(`/api/articles/${articleId}/comments`, {
        method: "POST",
        headers,
        body: JSON.stringify({ nombre, email, texto, turnstileToken, web: window.EOFTurnstile.trampa(contTurnstile), parent_id: respondiendoA ? respondiendoA.id : undefined }),
      });
      window.EOFTurnstile.reiniciar(contTurnstile);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se ha podido enviar el comentario");
      msgOk.textContent = data.mensaje || "Comentario enviado. Gracias por participar.";
      msgOk.style.display = "block";
      form.reset();
      cancelarRespuesta();
    } catch (err) {
      msgErr.textContent = err.message;
      msgErr.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });

  cargarComentarios();
}

document.addEventListener("DOMContentLoaded", cargaArticulo);
</script>
<style>
  /* ---- Barra de porcentaje leído (en vivo) ---- */
  /* Fija bajo el header, se rellena de 0 a 100% según cuánto se ha
     scrolleado del artículo. Solo tiene sentido mientras se lee una
     noticia real, así que se oculta en preview, en estados de error y en
     la cuenta atrás de una noticia programada (ver JS: solo se activa
     dentro de renderizaArticulo). */
  .barra-progreso-lectura{
    position:sticky;top:0;left:0;width:100%;height:3px;
    background:transparent;z-index:500;pointer-events:none;
    opacity:0;transition:opacity .25s ease;
  }
  .barra-progreso-lectura.activa{opacity:1;}
  .barra-progreso-lectura-relleno{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--rojo), var(--rojo-oscuro));
    transition:width .12s linear;
  }

  /* Mismo ancho que el cuerpo de la noticia, para que quede alineado */
  .comentarios-seccion{max-width:780px;margin:44px auto 0;padding-top:30px;border-top:1px solid #e4e7ec;}
  .comentarios-titulo{
    font-family:var(--font-tit);text-transform:uppercase;font-size:1.05rem;letter-spacing:.4px;
    color:var(--marino-texto);border-left:5px solid var(--rojo);padding-left:12px;
    margin:0 0 20px;display:flex;align-items:baseline;gap:6px;
  }
  .comentarios-contador{color:#9aa0ab;font-weight:400;text-transform:none;font-family:var(--font-text);font-size:.85rem;}

  /* ---- Acceso de lector (encima del formulario) ---- */
  .acceso-lector{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--gris-claro);border-radius:var(--radio);padding:12px 18px;margin-bottom:16px;
    font-size:.85rem;color:var(--texto-suave);
  }
  .acceso-lector-activo{background:#eef7f0;}
  [data-theme="dark"] .acceso-lector-activo{background:#123321;}
  .acceso-lector-link{
    background:none;border:none;color:var(--rojo);font-weight:700;cursor:pointer;
    text-decoration:none;font-size:.85rem;padding:0;
  }
  .acceso-lector-link:hover{text-decoration:underline;}
  .acceso-lector-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .comentario-verificado{
    display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;color:#1a9e4f;margin-left:4px;vertical-align:middle;
  }

  /* ---- Formulario ---- */
  .form-comentario{
    background:var(--gris-claro);border-radius:var(--radio);
    padding:20px 22px;margin-bottom:28px;
  }
  .form-comentario-fila{display:flex;gap:12px;margin-bottom:12px;}
  .form-comentario label{
    display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
    color:var(--gris-texto);margin-bottom:5px;
  }
  .form-comentario-campo{flex:1;min-width:0;}
  .form-comentario input, .form-comentario textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--borde);border-radius:7px;
    font-size:.92rem;font-family:var(--font-text);background:var(--fondo);color:var(--texto);
    transition:border-color .15s, box-shadow .15s;
  }
  .form-comentario textarea{min-height:96px;resize:vertical;margin-bottom:2px;line-height:1.5;}
  .form-comentario input::placeholder, .form-comentario textarea::placeholder{color:#aab0bb;}
  .form-comentario input:focus, .form-comentario textarea:focus{
    outline:none;border-color:var(--celeste);box-shadow:0 0 0 3px rgba(91,184,232,.18);
  }
  .form-comentario-pie{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:14px;
  }
  .comentario-ayuda{font-size:.78rem;color:#8891a0;margin:0;}
  .btn-enviar-comentario{
    background:linear-gradient(135deg, var(--rojo), var(--rojo-oscuro));color:#fff;border:none;
    padding:11px 26px;border-radius:24px;font-family:var(--font-tit);text-transform:uppercase;
    cursor:pointer;letter-spacing:.4px;font-size:.82rem;flex-shrink:0;
    transition:transform .15s, box-shadow .15s;
  }
  .btn-enviar-comentario:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(209,19,46,.28);}
  .btn-enviar-comentario:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
  .comentario-msg{display:none;padding:11px 14px;border-radius:7px;font-size:.86rem;margin-top:14px;}
  .comentario-msg-ok{color:#166534;background:#dcfce7;}
  .comentario-msg-error{color:#991b1b;background:#fee2e2;}

  /* ---- Lista de comentarios ---- */
  .lista-comentarios{display:flex;flex-direction:column;gap:16px;}
  .comentario-item{display:flex;gap:12px;}
  .comentario-avatar{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;
    background:var(--marino);color:#fff;font-family:var(--font-tit);font-size:.95rem;
    display:flex;align-items:center;justify-content:center;text-transform:uppercase;
  }
  .comentario-cuerpo{flex:1;min-width:0;background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:13px 16px;}
  .comentario-cabecera{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;flex-wrap:wrap;}
  .comentario-autor{font-weight:700;color:var(--marino-texto);font-size:.9rem;}
  .comentario-fecha{font-size:.75rem;color:#9aa0ab;flex-shrink:0;}
  .comentario-texto{font-size:.9rem;line-height:1.55;color:var(--texto);white-space:pre-wrap;word-break:break-word;margin:0;}
  .comentarios-vacio{color:#9aa0ab;font-size:.88rem;padding:10px 0;}

  /* ---- Hilos: respuestas con sangría bajo el comentario raíz ---- */
  .comentario-hilo{display:flex;flex-direction:column;gap:12px;}
  .comentario-respuestas{
    display:flex;flex-direction:column;gap:12px;
    margin-left:19px;padding-left:18px;border-left:2px solid var(--borde);
  }
  .comentario-item-respuesta .comentario-avatar{width:30px;height:30px;font-size:.8rem;}
  .comentario-item-respuesta .comentario-cuerpo{padding:11px 14px;}
  .comentario-en-respuesta{display:block;font-size:.76rem;color:#8891a0;margin:-2px 0 6px;}
  .comentario-destacado .comentario-cuerpo{animation:comentarioDestacado 2.6s ease-out;}
  @keyframes comentarioDestacado{
    0%,40%{border-color:var(--celeste);box-shadow:0 0 0 3px rgba(91,184,232,.35);}
    100%{border-color:var(--borde);box-shadow:none;}
  }
  .comentario-responder{
    background:none;border:none;color:#8891a0;font-size:.8rem;font-weight:600;
    font-family:var(--font-text);cursor:pointer;padding:4px 8px;border-radius:20px;transition:.15s;
  }
  .comentario-responder:hover{color:var(--rojo);background:rgba(209,19,46,.07);}
  .comentario-respondiendo{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(91,184,232,.14);border-left:3px solid var(--celeste);border-radius:6px;
    padding:8px 12px;margin-bottom:12px;font-size:.85rem;color:var(--texto);
  }
  .comentario-respondiendo[hidden]{display:none;}
  .comentario-respondiendo-x{background:none;border:none;color:#8891a0;cursor:pointer;font-size:.95rem;line-height:1;padding:2px 4px;}
  .comentario-respondiendo-x:hover{color:var(--rojo);}

  /* ---- Votos y denuncia de comentarios ---- */
  .comentario-acciones{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .comentario-voto{
    display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--borde);
    border-radius:20px;padding:4px 10px;cursor:pointer;color:#8891a0;font-size:.8rem;
    font-family:var(--font-text);transition:.15s;
  }
  .comentario-voto svg{width:14px;height:14px;}
  .comentario-voto:hover:not(:disabled){border-color:#c3c9d3;color:var(--marino-texto);}
  .comentario-voto:disabled{opacity:.6;cursor:default;}
  .comentario-voto-like.activo{color:#166534;border-color:#86efac;background:#f0fdf4;}
  .comentario-voto-dislike.activo{color:#991b1b;border-color:#fca5a5;background:#fef2f2;}
  .comentario-denunciar{
    margin-left:auto;background:none;border:none;color:#aab0bb;font-size:.76rem;
    font-family:var(--font-text);cursor:pointer;text-decoration:underline;padding:4px 2px;
  }
  .comentario-denunciar:hover:not(:disabled){color:#991b1b;}
  .comentario-denunciar.activo, .comentario-denunciar:disabled{color:#c94b4b;text-decoration:none;cursor:default;}
  .comentarios-seccion .spinner{margin:20px auto;}

  @media(max-width:600px){
    .comentario-respuestas{margin-left:8px;padding-left:12px;}
    .form-comentario{padding:16px 16px;}
    .form-comentario-fila{flex-direction:column;gap:12px;}
    .form-comentario-pie{flex-direction:column;align-items:stretch;}
    .btn-enviar-comentario{width:100%;text-align:center;}
    .comentario-avatar{width:32px;height:32px;font-size:.85rem;}
  }
</style>
<script>
/* ---------- Ampliar las fotos de la noticia con el visor compartido ----------
   Delegado sobre el contenedor del artículo (que se repinta al cambiar de
   idioma): recoge en orden todas las fotos (cabecera, las del texto,
   collages y la galería) y abre el visor en la pulsada. */
(function () {
  const SEL_FOTOS = ".article-img img, .article-body .foto-articulo img, .article-collage-foto img, #miniaturasGaleria img[data-src]";

  function coleccionar() {
    const cont = document.getElementById("contenidoArticulo");
    const lista = [];
    cont.querySelectorAll(SEL_FOTOS).forEach((img) => {
      const esMini = img.matches("#miniaturasGaleria img");
      const src = esMini ? img.dataset.src : (img.currentSrc || img.src);
      if (!src) return;
      const pie = esMini ? (img.dataset.credito || "") :
        ((img.closest("figure, .article-img, .article-collage-foto") || img.parentElement).querySelector(".credito-foto, figcaption")?.textContent || "");
      const cap = esMini ? "" : (img.closest("figure")?.querySelector("figcaption")?.textContent || "");
      lista.push({ el: img, item: { tipo: "foto", url: src, thumb: src, titulo: cap.trim(), credito: (esMini ? pie : (cap ? "" : pie)).trim() } });
    });
    return lista;
  }

  function abrirDesde(img) {
    if (typeof VisorMedia === "undefined") return;
    const lista = coleccionar();
    if (!lista.length) return;
    let objetivo = img;
    if (img.id === "fotoGaleriaPrincipal") objetivo = document.querySelector("#miniaturasGaleria img.activa") || img;
    let i = lista.findIndex((x) => x.el === objetivo);
    if (i < 0) i = 0;
    const titulo = document.querySelector("h1")?.textContent?.trim() || document.title;
    VisorMedia.abrir(lista.map((x) => x.item), i, {
      titulo,
      compartirUrl: () => location.href.split("#")[0],
    });
  }

  document.addEventListener("click", (e) => {
    const img = e.target.closest && e.target.closest(".article-img img, .article-body .foto-articulo img, .article-collage-foto img, #fotoGaleriaPrincipal");
    if (!img || !document.getElementById("contenidoArticulo").contains(img)) return;
    e.preventDefault();
    abrirDesde(img);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const img = e.target;
    if (img.tagName === "IMG" && img.hasAttribute("data-vm-foto")) { e.preventDefault(); abrirDesde(img); }
  });

  // Hace que las fotos sean alcanzables con teclado y lectores de pantalla.
  function marcar() {
    document.querySelectorAll(".article-img img, .article-body .foto-articulo img, .article-collage-foto img, #fotoGaleriaPrincipal").forEach((img) => {
      if (img.hasAttribute("data-vm-foto")) return;
      img.setAttribute("data-vm-foto", "");
      img.tabIndex = 0;
      img.setAttribute("role", "button");
      img.setAttribute("aria-label", "Ampliar foto" + (img.alt && !/^Foto \d+$/.test(img.alt) ? ": " + img.alt : ""));
    });
  }
  const cont = document.getElementById("contenidoArticulo");
  if (cont) { new MutationObserver(marcar).observe(cont, { childList: true, subtree: true }); marcar(); }
})();
</script>
